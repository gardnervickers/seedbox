name: gossip
services:
  n1:
    image: docker.io/library/python:3.12-alpine
    command: [python3, -u, /gossip.py, n1]
    configs:
      - {source: gossip, target: /gossip.py}
    volumes:
      - data1:/data
  n2:
    image: docker.io/library/python:3.12-alpine
    command: [python3, -u, /gossip.py, n2]
    configs:
      - {source: gossip, target: /gossip.py}
    volumes:
      - data2:/data
  n3:
    image: docker.io/library/python:3.12-alpine
    command: [python3, -u, /gossip.py, n3]
    configs:
      - {source: gossip, target: /gossip.py}
    volumes:
      - data3:/data
  n4:
    image: docker.io/library/python:3.12-alpine
    command: [python3, -u, /gossip.py, n4]
    configs:
      - {source: gossip, target: /gossip.py}
    volumes:
      - data4:/data
configs:
  gossip: {file: ./gossip.py}
volumes:
  data1: {}
  data2: {}
  data3: {}
  data4: {}
x-seedbox:
  version: 1
  seed: 1103
  network: {latency: 1ms, jitter: 200us}
  limits: {simulated_time: 20s, wall_time: 15m}
  check: {service: n1, exit_code: 0}
