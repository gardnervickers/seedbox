# Experiment variant of compose.yaml (branch claude/pv-profile-exp).
name: timer-races-b1000
services:
  races:
    build: .
    entrypoint: [/races]
    environment: {SEEDBOX_DEBUG_BUDGET: '1000'}
x-seedbox:
  version: 1
  seed: 1101
  limits: {simulated_time: 20s, wall_time: 15m}
  check: {service: races, exit_code: 0}
