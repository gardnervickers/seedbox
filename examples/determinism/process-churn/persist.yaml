# Experiment variant of compose.yaml (branch claude/pv-profile-exp).
name: determinism-process-churn-persist
services:
  churn:
    build: .
    environment: {SEEDBOX_DEBUG_DROPTS: -persist -persist_dir /tmp/drcache}
x-seedbox:
  version: 1
  seed: 1105
  limits: {simulated_time: 30s, wall_time: 15m}
  check: {service: churn, exit_code: 0}
