# Experiment variant of compose.yaml (branch claude/pv-profile-exp).
name: determinism-cpu-time-native
services:
  cputime:
    build: .
    entrypoint: [/cputime]
    environment: {SEEDBOX_DEBUG_TRANSLATOR: native}
x-seedbox:
  version: 1
  seed: 1102
  limits: {simulated_time: 15s, wall_time: 15m}
  check: {service: cputime, exit_code: 0}
