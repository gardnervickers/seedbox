name: determinism-randomness
services:
  randomness:
    image: docker.io/library/python:3.12-alpine
    command: [python3, /randomness.py]
    configs:
      - {source: driver, target: /randomness.py}
configs:
  driver: {file: ./randomness.py}
x-seedbox:
  version: 1
  seed: 1104
  limits: {simulated_time: 90s, wall_time: 15m}
  check: {service: randomness, exit_code: 0}
