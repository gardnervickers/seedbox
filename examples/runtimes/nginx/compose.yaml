name: runtime-nginx
services:
  nginx:
    image: docker.io/library/nginx:stable-alpine
    entrypoint: [sh, /runtime.sh]
    configs:
      - {source: driver, target: /runtime.sh}
configs:
  driver: {file: ./runtime_nginx.sh}
x-seedbox:
  version: 1
  machine: {memory_mb: 2048}
  seed: 172
  limits: {simulated_time: 60s, wall_time: 15m}
  check: {service: nginx, exit_code: 0}
