name: runtime-postgres
services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    entrypoint: [bash, /runtime.sh]
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    configs:
      - {source: driver, target: /runtime.sh}
configs:
  driver: {file: ./runtime_postgres.sh}
x-seedbox:
  version: 1
  machine: {memory_mb: 2048}
  seed: 172
  limits: {simulated_time: 60s, wall_time: 15m}
  check: {service: postgres}
