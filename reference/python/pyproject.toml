[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seedbox"
version = "0.1.0"
description = "Seeded instruction scheduling and deterministic Linux ABI models"
requires-python = ">=3.11"
dependencies = ["unicorn>=2.1,<3", "capstone>=5,<6", "pyelftools>=0.31,<1"]

[project.scripts]
seedbox = "seedbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
