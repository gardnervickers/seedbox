bind 0.0.0.0
port 6379
protected-mode no
# These isolated benchmark VMs have no outside ingress; topology is world-owned.
daemonize no
save ""
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 0
hz 10
dynamic-hz no
repl-diskless-sync yes
repl-diskless-sync-delay 0
maxmemory 0
# dir, replicaof and pidfile are supplied per owned machine/data directory.
