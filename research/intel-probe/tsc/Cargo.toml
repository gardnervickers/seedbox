[package]
name = "seedbox-tsc-kvm-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
build = "build.rs"

[workspace]

[dependencies]
sha2 = "=0.10.9"
serde_json = "=1.0.151"

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
kvm-ioctls = "=0.25.0"
kvm-bindings = { version = "=0.14.1", features = ["fam-wrappers"] }
libc = "=0.2.190"

[profile.release]
debug = 1
