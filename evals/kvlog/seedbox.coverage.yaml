# The buggy variant with edge coverage on the server: campaigns can guide by
# new edges and hit counts as well as by property outcomes.
name: kvlog-eval-coverage
machines:
  kv:
    build:
      context: ../..
      dockerfile: evals/kvlog/Dockerfile
    entrypoint: [/kvlog-server]
    environment:
      SEEDBOX_COVERAGE: "1"
      KVLOG_BUG: "1"
    # The log must outlive a crash: keep it on a disk.
    volumes:
      data:
        target: /data
oracle:
  build:
    context: ../..
    dockerfile: evals/kvlog/Dockerfile
  entrypoint: [/kvlog-oracle]
network:
  latency: 1ms
