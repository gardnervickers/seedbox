# The buggy variant with edge coverage on the server: campaigns can guide by
# new edges and hit counts as well as by property outcomes and states.
name: retry-eval-coverage
machines:
  log:
    build:
      context: ../..
      dockerfile: evals/retry/Dockerfile
    entrypoint: [/retry-server]
    environment:
      SEEDBOX_COVERAGE: "1"
      RETRY_BUG: "1"
    volumes:
      data:
        target: /data
oracle:
  build:
    context: ../..
    dockerfile: evals/retry/Dockerfile
  entrypoint: [/retry-oracle]
network:
  latency: 1ms
