name: slowdisk-eval
machines:
  store:
    build:
      context: ../..
      dockerfile: evals/slowdisk/Dockerfile
    entrypoint: [/slowdisk-server]
    environment:
      SLOWDISK_BUG: "1"
    volumes:
      data:
        target: /data
oracle:
  build:
    context: ../..
    dockerfile: evals/slowdisk/Dockerfile
  entrypoint: [/slowdisk-oracle]
network:
  latency: 1ms
