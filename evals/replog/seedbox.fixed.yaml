name: replog-eval-fixed
machines:
  r1:
    build:
      context: ../..
      dockerfile: evals/replog/Dockerfile
    entrypoint: [/replog-replica]
    environment:
      REPLOG_LEADER: "1"
      REPLOG_FOLLOWERS: "r2,r3"
      REPLOG_BUG: "0"
  r2:
    build:
      context: ../..
      dockerfile: evals/replog/Dockerfile
    entrypoint: [/replog-replica]
    environment:
      REPLOG_BUG: "0"
  r3:
    build:
      context: ../..
      dockerfile: evals/replog/Dockerfile
    entrypoint: [/replog-replica]
    environment:
      REPLOG_BUG: "0"
oracle:
  build:
    context: ../..
    dockerfile: evals/replog/Dockerfile
  entrypoint: [/replog-oracle]
network:
  latency: 1ms
