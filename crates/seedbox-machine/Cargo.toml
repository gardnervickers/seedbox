[package]
name = "seedbox-machine"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
dynamorio-tests = []
dynamorio-isolated-tests = []
test-support = ["dep:seedbox-test-time"]

[dependencies]
seedbox-test-time = { workspace = true, optional = true }
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true

[dev-dependencies]
seedbox-test-time.workspace = true
seedbox-test.workspace = true
sha2.workspace = true
hex.workspace = true
tempfile.workspace = true
libc.workspace = true

[package.metadata.seedbox-check.suites]
dynamorio = ["dynamorio-tests"]
dynamorio-isolated = ["dynamorio-isolated-tests"]

[[test]]
name = "dynamorio"
path = "../../vendor/dynamorio/seedbox-tests/dynamorio.rs"
required-features = ["dynamorio-tests"]

[[test]]
name = "dynamorio_isolated"
path = "../../vendor/dynamorio/seedbox-tests/dynamorio_isolated.rs"
required-features = ["dynamorio-isolated-tests"]
