[package]
name = "seedbox-check"
description = "Development-only Rust test coordinator and source policy checks"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
libc.workspace = true
serde_json.workspace = true
syn = { workspace = true, features = ["full", "visit"] }
proc-macro2 = { workspace = true, features = ["span-locations"] }

[dev-dependencies]
seedbox-test-time.workspace = true
tempfile.workspace = true

# Development-only coordinator moved out of seedbox-test: it never runs inside
# a Seedbox server or worker, so its subprocesses cannot race their exec writes.
[lints.clippy]
disallowed_methods = "allow"
