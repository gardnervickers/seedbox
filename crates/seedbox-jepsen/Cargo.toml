# Jepsen-style reproductions under Seedbox: oracle kit, nemeses, checkers,
# scenario generator and campaign runner. This is its own workspace because it
# depends on the private wgl-checker repository, which the Seedbox workspace and
# its public CI must not need; see AGENTS.md.
[workspace]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[package]
name = "seedbox-jepsen"
description = "Jepsen-style oracles, nemeses and checkers for Seedbox simulations"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
seedbox-control-client = { path = "../seedbox-control-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgl = { git = "ssh://git@github.com/lbradstreet/wgl-checker.git", rev = "94231b4be5f5914e257263f7f64afb3f67e51c93" }

[profile.release]
# The guest binary is copied into every simulation; keep symbols, drop debug info.
strip = "debuginfo"
