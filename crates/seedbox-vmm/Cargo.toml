[package]
name = "seedbox-vmm"
description = "Seedbox KVM VMM and world scheduler"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
kvm-ioctls = "=0.25.0"
kvm-bindings = { version = "=0.14.1", features = ["fam-wrappers"] }
libc.workspace = true
serde_json.workspace = true
sha2.workspace = true
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info"] }
