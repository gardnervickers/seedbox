[package]
name = "seedbox-vmm"
version = "0.1.0"
edition = "2021"
publish = false

# Keep the standalone VMM build and its lockfile available through `cargo
# build-vmm`. The Seedbox executable also links this library: that combined
# build uses the root workspace's features and has its own engine identity.
[workspace]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies]
seedbox-engine-core = { package = "seedbox-vmm-engine-core", path = "engine-core" }
# Keep standalone dependency metadata relative to this workspace while sharing
# the protocol source with Seedbox. See control/Cargo.toml for package isolation.
seedbox-control = { package = "seedbox-vmm-control", path = "control" }
kvm-ioctls = "=0.25.0"
kvm-bindings = { version = "=0.14.1", features = ["fam-wrappers"] }
libc = "0.2"
serde = { workspace = true }
serde_json = "1"
sha2 = "0.10"
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info"] }

[profile.release]
debug = 1
