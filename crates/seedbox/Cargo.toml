[package]
name = "seedbox"
build = "build-runtime.rs"
description = "Seedbox CLI and retained engine worker executable"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
seedbox-cli.workspace = true
seedbox-machine-pv.workspace = true
seedbox-application.workspace = true
seedbox-driver-execution.workspace = true
seedbox-engine-protocol.workspace = true
serde_json.workspace = true
libc.workspace = true



[dev-dependencies]
seedbox-test.workspace = true
seedbox-test-time.workspace = true
seedbox-machine-pv = { workspace = true, features = ["test-support"] }
seedbox-server = { workspace = true, features = ["test-support"] }
seedbox-api.workspace = true
seedbox-client.workspace = true
seedbox-artifacts.workspace = true
seedbox-spec.workspace = true
serde_yaml_ng.workspace = true
tar.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["process"] }

# Suite membership is read from Cargo metadata by seedbox-check.
[package.metadata.seedbox-check.suites]
linux-apps = ["application-tests", "etcd-prep-tests"]
mac-apps = ["application-tests"]
linux-pause = ["retained-run-tests"]

[features]
application-tests = []
etcd-prep-tests = []
retained-run-tests = []

[[test]]
name = "applications"
required-features = ["application-tests"]

[[test]]
name = "etcd_service_native"
required-features = ["etcd-prep-tests"]

[[test]]
name = "host_pause"
required-features = ["retained-run-tests"]
