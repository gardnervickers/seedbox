[package]
name = "seedbox"
build = "build-runtime.rs"
description = "Seedbox CLI and retained engine worker executable"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
seedbox-cli.workspace = true
seedbox-machine-pv.workspace = true
seedbox-application.workspace = true
seedbox-engine-protocol.workspace = true
serde_json.workspace = true
libc.workspace = true

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
seedbox-vmm = { path = "../seedbox-vmm" }

[target.'cfg(all(target_arch = "aarch64", any(target_os = "linux", target_os = "macos")))'.dependencies]
seedbox-arm64 = { path = "../seedbox-arm64" }

[dev-dependencies]
seedbox-test-time.workspace = true
seedbox-server.workspace = true
seedbox-api.workspace = true
seedbox-client.workspace = true
seedbox-engine-core.workspace = true
seedbox-spec.workspace = true
serde_yaml_ng.workspace = true
tar.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["process"] }

[features]
application-tests = []
etcd-prep-tests = []
retained-run-tests = []

[[test]]
name = "applications"
required-features = ["application-tests"]

[[test]]
name = "etcd_service_native"
required-features = ["etcd-prep-tests"]

[[test]]
name = "host_pause"
required-features = ["retained-run-tests"]
