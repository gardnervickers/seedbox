[package]
name = "seedbox"
build = "build-runtime.rs"
description = "Seedbox CLI and retained engine worker executable"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
seedbox-spec.workspace = true
seedbox-application.workspace = true
seedbox-api.workspace = true
seedbox-client.workspace = true
seedbox-tui.workspace = true
seedbox-server.workspace = true
seedbox-engine-protocol.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
tempfile.workspace = true
bollard.workspace = true
futures-util.workspace = true
tokio.workspace = true
libc.workspace = true
signal-hook = "0.3"

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
seedbox-vmm = { path = "../seedbox-vmm" }

[target.'cfg(all(target_arch = "aarch64", any(target_os = "linux", target_os = "macos")))'.dependencies]
seedbox-arm64 = { path = "../seedbox-arm64" }

[dev-dependencies]
seedbox-engine-core.workspace = true
tar.workspace = true
