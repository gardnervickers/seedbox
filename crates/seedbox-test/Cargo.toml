[package]
name = "seedbox-test"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
libc.workspace = true
seedbox-exec.workspace = true
serde_json.workspace = true

[dev-dependencies]
seedbox-test-time.workspace = true
sha2.workspace = true
tempfile.workspace = true
