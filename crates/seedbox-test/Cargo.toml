[package]
name = "seedbox-test"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
libc.workspace = true
serde_json.workspace = true

[dev-dependencies]
seedbox-machine = { workspace = true, features = ["test-support"] }
seedbox-machine-pv = { workspace = true, features = ["test-support"] }
seedbox-machine-tcg = { workspace = true, features = ["test-support"] }
seedbox-driver.workspace = true
serde.workspace = true
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true
libc.workspace = true
hex.workspace = true

# Developer tool: never runs inside a Seedbox server or worker, so its spawns
# cannot race an executable write there (see clippy.toml).
[lints.clippy]
disallowed_methods = "allow"
