[package]
name = "seedbox-driver"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
test-support = ["seedbox-machine/test-support", "dep:tar"]

[dependencies]
# Engine-core supplies only the canonical pure connection/link policy shared
# with standalone engines; scheduling and RNG stay in this crate.
seedbox-engine-core.workspace = true
seedbox-engine-protocol.workspace = true
seedbox-spec.workspace = true
seedbox-machine.workspace = true
seedbox-machine-tcg.workspace = true
seedbox-machine-pv.workspace = true
rayon.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
tar = { workspace = true, optional = true }

[dev-dependencies]
# Integration tests and examples use this crate's own test-support fixtures.
seedbox-driver = { workspace = true, features = ["test-support"] }
seedbox-test.workspace = true
tempfile.workspace = true
seedbox-test-time.workspace = true
seedbox-machine = { workspace = true, features = ["test-support"] }
seedbox-machine-pv = { workspace = true, features = ["test-support"] }
# Native TCG scenarios run under the backend's test run watchdog.
seedbox-machine-tcg = { workspace = true, features = ["test-support"] }

tar.workspace = true
hex.workspace = true

[[test]]
name = "native_driver"
path = "tests/native_driver/mod.rs"
