[package]
build = "build-cache.rs"
name = "seedbox-arm64-engine-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Keep the standalone package source ID inside its own workspace, while both
# backends compile the same canonical policies. The protocol stays isolated too.
[lib]
name = "seedbox_engine_core"
path = "src/lib.rs"

[dependencies]
hex.workspace = true
hickory-proto.workspace = true
seedbox-engine-protocol = { package = "seedbox-arm64-protocol", path = "../protocol" }
seedbox-control = { package = "seedbox-arm64-control", path = "../control" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# Work-stealing machine workers for the windowed scheduler.
rayon = "1"

[dev-dependencies]
tempfile = "3"
