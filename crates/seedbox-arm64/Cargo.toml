[package]
name = "seedbox-arm64"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Deliberately isolated: changing this engine cannot change the x86 engine.
[workspace]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
tempfile = "3"
hex = "0.4"
libc = "0.2"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies]
tempfile.workspace = true
hex.workspace = true
seedbox-engine-core = { package = "seedbox-arm64-engine-core", path = "engine-core" }
seedbox-control = { package = "seedbox-arm64-control", path = "control" }
clap = { version = "4", features = ["derive"] }
libc.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
kvm-bindings = "0.14"
kvm-ioctls = "0.24"

[build-dependencies]
cc = "1"

[dev-dependencies]
fdt = "0.1"
