[package]
name = "seedbox-arm64"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Deliberately isolated: changing this engine cannot change the x86 engine.
[workspace]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies]
seedbox-engine-core = { package = "seedbox-arm64-engine-core", path = "engine-core" }
seedbox-control = { package = "seedbox-arm64-control", path = "control" }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
kvm-bindings = "0.14"
kvm-ioctls = "0.24"

[dev-dependencies]
fdt = "0.1"

[features]
kvm-tests = []
hvf-tests = []
# Real guest inputs are additional to the native hypervisor primitives.
guest-tests = []
