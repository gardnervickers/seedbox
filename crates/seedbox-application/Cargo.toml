[package]
name = "seedbox-application"
description = "Seedbox simulation configuration and orchestration"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
hex.workspace = true
seedbox-artifacts.workspace = true
seedbox-spec.workspace = true
seedbox-engine-protocol.workspace = true
seedbox-driver-execution.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
tempfile.workspace = true
tar.workspace = true
walkdir = "2"
bollard.workspace = true
futures-util.workspace = true
tokio-util = { version = "0.7", features = ["io"] }
globset = "0.4"
tokio.workspace = true
ocirender = "0.2.2"


[dev-dependencies]
# Preparation tests use Driver execution's synthetic runtime package.
seedbox-driver-execution = { workspace = true, features = ["test-support"] }
libc.workspace = true
seedbox-test.workspace = true
seedbox-test-time.workspace = true
seedbox-machine = { workspace = true, features = ["test-support"] }

# Suite membership is read from Cargo metadata by seedbox-check.
[package.metadata.seedbox-check.suites]
linux-oci = ["oci-tests"]

[features]
oci-tests = []

[[test]]
name = "oci_engine"
required-features = ["oci-tests"]

# The Redis template embeds this standalone workload and its Dockerfile builds it
# with plain rustc; this target type-checks and unit-tests it in the workspace.
[[example]]
name = "redis-workload"
path = "../../examples/redis/workload/main.rs"
test = true
