[package]
name = "seedbox-server"
description = "Simulation catalogue, execution ownership and live observation"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
kvm-tests = []
tcg-tests = []
# Explicit opt-in: never activated by normal release CLI/server dependencies.
worker-failure-tests = ["seedbox-application/test-support"]

[dependencies]
seedbox-control.workspace = true
seedbox-artifacts.workspace = true
seedbox-application.workspace = true
seedbox-api.workspace = true
seedbox-engine-protocol.workspace = true
tokio.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
libc.workspace = true
getrandom.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
futures-util.workspace = true
seedbox-spec.workspace = true

[dev-dependencies]
seedbox-driver.workspace = true
seedbox-test-time.workspace = true
seedbox-client.workspace = true
seedbox-machine = { workspace = true, features = ["test-support"] }
seedbox-machine-pv.workspace = true
seedbox-machine-tcg.workspace = true
tar.workspace = true
