[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/seedbox"]
# Research probes are standalone, version-pinned crates kept as evidence.
exclude = ["research"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
libc = "0.2"
serde_json = "1"
sha2 = "0.10"

[profile.release]
debug = 1
