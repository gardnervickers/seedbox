[package]
name = "seedbox"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Seeded instruction scheduling and deterministic Linux ABI models"

[dependencies]
unicorn-engine = { version = "=2.1.5", default-features = false, features = ["arch_x86", "dynamic_linkage"] }
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info"] }
goblin = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
sha2 = "0.10"

[profile.release]
debug = 1

[[bin]]
name = "seedbox"
path = "src/main.rs"
