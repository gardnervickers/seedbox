[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/seedbox"]
# The VMM is its own workspace (see its Cargo.toml).
exclude = ["crates/seedbox-vmm", "crates/seedbox-arm64"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
seedbox-test-time = { path = "crates/seedbox-test-time" }
# Parser features are activated only by the seedbox-check consumer.
syn = "2"
proc-macro2 = "1"
seedbox-cli = { path = "crates/seedbox-cli" }
seedbox-machine = { path = "crates/seedbox-machine" }
seedbox-machine-pv = { path = "crates/seedbox-machine-pv" }
seedbox-machine-tcg = { path = "crates/seedbox-machine-tcg" }
seedbox-driver = { path = "crates/seedbox-driver" }
bollard = { version = "0.21", features = ["buildkit", "chrono"] }
hex = "0.4"
seedbox-artifacts = { path = "crates/seedbox-artifacts" }
seedbox-exec = { path = "crates/seedbox-exec" }
seedbox-test = { path = "crates/seedbox-test" }
seedbox-application = { path = "crates/seedbox-application" }
seedbox-server = { path = "crates/seedbox-server" }
seedbox-api = { path = "crates/seedbox-api" }
seedbox-client = { path = "crates/seedbox-client" }
seedbox-tui = { path = "crates/seedbox-tui" }
seedbox-spec = { path = "crates/seedbox-spec" }
tokio = { version = "1", features = ["rt", "time", "fs", "macros", "sync"] }
thiserror = "2"
futures-util = "0.3"
getrandom = "0.4"
tempfile = "3"
tar = "0.4"
serde_yaml_ng = "0.10"
seedbox-engine-protocol = { path = "crates/seedbox-engine-protocol" }
clap = { version = "4", features = ["derive", "env"] }
seedbox-engine-core = { path = "crates/seedbox-engine-core" }
serde = { version = "1", features = ["derive"] }
seedbox-control = { path = "crates/seedbox-control" }
libc = "0.2"
serde_json = "1"
rayon = "1"
sha2 = "0.11"

[profile.release]
debug = 1
