name: PV cleanup canary

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seedbox-pv-cloud
  cancel-in-progress: false

jobs:
  canary:
    if: github.ref == 'refs/heads/main'
    environment: pv-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prove the external Function can destroy an expired droplet
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DO_CI_TOKEN }}
        run: |
          python3 tools/pv-ci/control.py canary --size s-1vcpu-1gb \
            --tag "seedbox-pv-job-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
  cleanup:
    needs: canary
    if: always() && github.ref == 'refs/heads/main'
    environment: pv-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Delete any failed canary
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DO_CI_TOKEN }}
        run: |
          python3 tools/pv-ci/control.py cleanup --tag "seedbox-pv-job-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
