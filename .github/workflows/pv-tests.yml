name: PV tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pv-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_tests: ${{ steps.changes.outputs.run_tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect changes that need PV tests
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PYTHON'
          import os, subprocess

          base, head = os.environ['BASE_SHA'], os.environ['HEAD_SHA']
          run_tests = True
          if os.environ['GITHUB_EVENT_NAME'] != 'workflow_dispatch' and base and set(base) != {'0'}:
              revisions = [f'{base}...{head}'] if os.environ['GITHUB_EVENT_NAME'] == 'pull_request' else [base, head]
              changed = subprocess.check_output(['git', 'diff', '--no-renames', '--name-only', '-z', *revisions, '--'])
              paths = [path for path in changed.split(b'\0') if path]
              run_tests = any(not path.endswith(b'.md') for path in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'run_tests={str(run_tests).lower()}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('PV tests required.\n' if run_tests else 'Markdown-only changes; PV tests skipped.\n')
          PYTHON

  test:
    needs: changes
    # A skipped job satisfies the required check; a skipped workflow never does.
    # Run conservatively if change detection fails rather than skipping tests.
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.run_tests == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      # Use the Docker engine checked below, even when Podman's socket exists.
      DOCKER_HOST: unix:///var/run/docker.sock
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Nix's submodule source accessor also traverses DR's nested gitlinks.
          submodules: recursive
      - name: Identify Nix cache inputs
        id: sources
        env:
          NIX_INPUTS: ${{ hashFiles('flake.lock', 'flake.nix', '.gitmodules', 'nix/**', 'Cargo.toml', 'Cargo.lock', 'crates/seedbox-check/**', 'crates/seedbox-exec/**', 'crates/seedbox-test-time/**', 'crates/seedbox-machine/**/*.nix', 'crates/seedbox-machine/guest/**', 'crates/seedbox-machine/src/pv/**', 'crates/seedbox-machine/tests/fixtures/**', 'crates/seedbox-machine/src/machine/disk.rs', 'crates/seedbox-machine/src/machine/disk/**', 'crates/seedbox-machine-tcg/qemu/**', 'examples/minio/inputs.lock.json') }}
        run: |
          echo "dynamorio=$(git rev-parse HEAD:vendor/dynamorio)" >> "$GITHUB_OUTPUT"
          echo "nix-inputs=$NIX_INPUTS" >> "$GITHUB_OUTPUT"
      - name: Reclaim unused hosted SDK space
        run: |
          # Leave the hosted SDKs alone when the filesystem has enough headroom.
          available=$(df --output=avail -B1 / | tail -n 1)
          if (( available < 40 * 1024 * 1024 * 1024 )); then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/share/swift
          fi
          df -h /
      - name: Verify usable KVM before building
        run: |
          grep -m1 '^vendor_id' /proc/cpuinfo
          grep -m1 '^model name' /proc/cpuinfo
          uname -r
          sudo chmod a+rw /dev/kvm
          python3 - <<'PYTHON'
          import fcntl, os
          # Globally disabled PMU yields no per-VM disable capability, also on AMD.
          try:
              with open('/sys/module/kvm/parameters/enable_pmu') as parameter:
                  print(f'KVM enable_pmu={parameter.read().strip()}')
          except OSError as error:
              print(f'KVM enable_pmu evidence unavailable: {error}')
          with open('/dev/kvm', 'rb') as kvm:
              assert fcntl.ioctl(kvm, 0xAE00, 0) == 12, 'unsupported KVM API'
              vm = fcntl.ioctl(kvm, 0xAE01, 0)
              # KVM_CHECK_EXTENSION(KVM_CAP_PMU_CAPABILITY), disable bit = 1.
              pmu = fcntl.ioctl(vm, 0xAE03, 212)
              print(f'KVM PMU capability={pmu}; disable supported={bool(pmu & 1)}')
              os.close(vm)
          print('KVM VM creation succeeded')
          PYTHON
          docker info
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: nix-community/cache-nix-action/restore@v7
        id: nix-cache
        with:
          primary-key: pv-nix-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.sources.outputs.dynamorio }}-${{ steps.sources.outputs.nix-inputs }}-${{ github.run_id }}-${{ github.run_attempt }}
          # Each run saves newly realized derivations, including after an exact
          # input match. The immutable cache can only be written once per key.
          restore-prefixes-first-match: |
            pv-nix-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.sources.outputs.dynamorio }}-${{ steps.sources.outputs.nix-inputs }}-
            pv-nix-v3-${{ runner.os }}-${{ runner.arch }}-
            pv-nix-v2-${{ runner.os }}-${{ runner.arch }}-
            pv-nix-${{ runner.os }}-${{ runner.arch }}-
      - name: Prepare and root the Nix development environment
        run: nix develop --profile "$RUNNER_TEMP/pv-dev" --command true
      - uses: Swatinem/rust-cache@v2
        id: cargo-cache
        with:
          key: pv-${{ hashFiles('flake.lock', 'flake.nix') }}
          cmd-format: nix develop --command {0}
          workspaces: |
            . -> target
            . -> build/cargo
          cache-bin: false
      - name: Build and root guest assets from the checkout
        run: |
          nix build .#machinePvAssets .#machineTcgAssets .#machineGuestFormatter .#machineGuestFormatterX86 .#machineTcgTestFixtures .#machinePvTestFixtures --out-link "$RUNNER_TEMP/pv-assets"
      # Save expensive dependencies before tests, so a test failure does not
      # force the next run to rebuild the kernel or download the toolchain.
      - uses: nix-community/cache-nix-action/save@v7
        with:
          primary-key: ${{ steps.nix-cache.outputs.primary-key }}
          gc-max-store-size: 5G
      - name: Record cache results
        env:
          NIX_HIT: ${{ steps.nix-cache.outputs.hit }}
          CARGO_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
        run: |
          {
            echo "Nix cache restored: $NIX_HIT"
            echo "Cargo exact cache hit: $CARGO_HIT"
            du -sh /nix/store
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Portable prerequisites and PV application acceptance
        run: nix develop --command bash harness/check.sh linux-apps
      - name: Native TCG machine and public-service acceptance
        run: nix develop --command bash harness/check-machine-tcg.sh --skip-portable
      - name: Bound diagnostic artifact storage
        if: always()
        # Privileged KVM tests leave root-owned manifests and logs.
        run: sudo python3 tools/pv-ci/artifacts.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pv-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/pv-artifacts/
          retention-days: 7
      - name: Exclude test state from the Cargo cache
        if: always()
        # Diagnostics have been uploaded. Rust-cache archives the target tree,
        # so remove root-owned VM state and per-run reports before its post step.
        run: sudo rm -rf -- target/check-reports target/pv-artifacts
