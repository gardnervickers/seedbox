name: PV tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pv-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_tests: ${{ steps.changes.outputs.run_tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect changes that need PV tests
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PYTHON'
          import os, subprocess

          base, head = os.environ['BASE_SHA'], os.environ['HEAD_SHA']
          run_tests = True
          if os.environ['GITHUB_EVENT_NAME'] != 'workflow_dispatch' and base and set(base) != {'0'}:
              revisions = [f'{base}...{head}'] if os.environ['GITHUB_EVENT_NAME'] == 'pull_request' else [base, head]
              changed = subprocess.check_output(['git', 'diff', '--no-renames', '--name-only', '-z', *revisions, '--'])
              paths = [path for path in changed.split(b'\0') if path]
              run_tests = any(not path.endswith(b'.md') for path in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'run_tests={str(run_tests).lower()}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('PV tests required.\n' if run_tests else 'Markdown-only changes; PV tests skipped.\n')
          PYTHON

  test:
    needs: changes
    # A skipped job satisfies the required check; a skipped workflow never does.
    # Run conservatively if change detection fails rather than skipping tests.
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.run_tests == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Reclaim unused hosted SDK space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/share/swift
          df -h /
      - name: Enable KVM and inspect the container engine
        run: |
          sudo chmod a+rw /dev/kvm
          test -c /dev/kvm && test -r /dev/kvm && test -w /dev/kvm
          docker info
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: nix-community/cache-nix-action/restore@v7
        id: nix-cache
        with:
          primary-key: pv-nix-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/**', 'kernel/**', 'kernel-arm64/**', 'guest/**', 'tools/runtime/**', 'crates/xtask/**') }}
          restore-prefixes-first-match: |
            pv-nix-v2-${{ runner.os }}-${{ runner.arch }}-
            pv-nix-${{ runner.os }}-${{ runner.arch }}-
      - name: Prepare and root the Nix development environment
        run: nix develop --profile "$RUNNER_TEMP/pv-dev" --command true
      - uses: Swatinem/rust-cache@v2
        id: cargo-cache
        with:
          key: pv-${{ hashFiles('flake.lock', 'flake.nix') }}
          cmd-format: nix develop --command {0}
          workspaces: |
            . -> target
            . -> build/cargo
            crates/seedbox-vmm -> target
            crates/seedbox-arm64 -> target
          cache-bin: false
      - name: Check system suite requirements before building guests
        run: nix develop --command cargo xtask check linux-apps --list
      - name: Build and root guest assets from the checkout
        run: |
          nix build .#guestKernel .#runtimeArchive --out-link "$RUNNER_TEMP/pv-assets"
      # Save expensive dependencies before tests, so a test failure does not
      # force the next run to rebuild the kernel or download the toolchain.
      - uses: nix-community/cache-nix-action/save@v7
        with:
          primary-key: ${{ steps.nix-cache.outputs.primary-key }}
          gc-max-store-size: 5G
      - name: Record cache results
        env:
          NIX_HIT: ${{ steps.nix-cache.outputs.hit }}
          CARGO_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
        run: |
          {
            echo "Nix cache restored: $NIX_HIT"
            echo "Cargo exact cache hit: $CARGO_HIT"
            du -sh /nix/store
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Portable prerequisites and PV application acceptance
        run: nix develop --command bash harness/check.sh linux-apps
      - name: Bound diagnostic artifact storage
        if: always()
        # Privileged KVM tests leave root-owned manifests and logs.
        run: sudo python3 tools/pv-ci/artifacts.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pv-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/pv-artifacts/
          retention-days: 7
      - name: Exclude test state from the Cargo cache
        if: always()
        # Diagnostics have been uploaded. Rust-cache archives the target tree,
        # so remove root-owned VM state and per-run reports before its post step.
        run: sudo rm -rf -- target/check-reports target/pv-artifacts
