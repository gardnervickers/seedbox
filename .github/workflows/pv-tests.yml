name: PV tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pv-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify usable KVM before building
        run: |
          sudo chmod a+rw /dev/kvm
          python3 - <<'PYTHON'
          import fcntl, os
          with open('/dev/kvm', 'rb') as kvm:
              assert fcntl.ioctl(kvm, 0xAE00, 0) == 12, 'unsupported KVM API'
              vm = fcntl.ioctl(kvm, 0xAE01, 0)
              os.close(vm)
          print('KVM VM creation succeeded')
          PYTHON
          docker info
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: pv-nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/**', 'kernel/**', 'guest/**', 'tools/runtime/**') }}
          restore-prefixes-first-match: pv-nix-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
            crates/seedbox-vmm/target
            crates/seedbox-arm64/target
          key: pv-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', '**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            pv-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', '**/Cargo.lock') }}-
      - name: Build guest assets from the checkout
        run: bash tools/build-assets.sh
      - name: Portable prerequisites and PV application acceptance
        run: nix develop --command bash harness/check.sh linux-apps --cpu 1
      - name: Bound diagnostic artifact storage
        if: always()
        run: python3 tools/pv-ci/artifacts.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pv-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/pv-artifacts/
          retention-days: 7
