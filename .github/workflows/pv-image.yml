name: PV runner image

on:
  push:
    branches: [main]
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - '**/Cargo.lock'
      - 'nix/**'
      - 'kernel/**'
      - 'guest/**'
      - 'tools/runtime/**'
      - 'tools/pv-ci/**'
      - '.github/workflows/pv-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seedbox-pv-cloud
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && vars.PV_CI_ENABLED == 'true'
    environment: pv-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      AWS_DEFAULT_REGION: us-east-1
      SPACES_BUCKET: ${{ vars.DO_CI_SPACES_BUCKET }}
      SPACES_REGION: ${{ vars.DO_CI_SPACES_REGION || 'nyc3' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: key
        name: Select dependency image key
        run: echo "key=$(python3 tools/pv-ci/image-key.py)" >> "$GITHUB_OUTPUT"
      - id: plan
        name: Reuse existing image or reserve a bounded build attempt
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DO_CI_TOKEN }}
          IMAGE_KEY: ${{ steps.key.outputs.key }}
          DO_REGION: ${{ vars.DO_CI_REGION || 'nyc3' }}
        run: python3 tools/pv-ci/control.py image-plan --key "$IMAGE_KEY" --region "$DO_REGION"
      - uses: cachix/install-nix-action@v31
        if: steps.plan.outputs.needed == 'true'
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: 'system-features = nixos-test benchmark big-parallel kvm'
      - name: Verify storage expiration and multipart cleanup
        if: steps.plan.outputs.needed == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET_ACCESS_KEY }}
        run: |
          nix shell nixpkgs#awscli2 --command python3 tools/pv-ci/storage.py check
      - name: Build complete NixOS disk image
        if: steps.plan.outputs.needed == 'true'
        run: |
          sudo chmod a+rw /dev/kvm
          nix build .#nixosConfigurations.pv-runner.config.system.build.digitalOceanImage --out-link runner-image
      - id: stage
        name: Stage image privately in Spaces
        if: steps.plan.outputs.needed == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          test -n "$SPACES_BUCKET"
          object="pv-images/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.qcow2.gz"
          echo "object=$object" >> "$GITHUB_OUTPUT"
          mapfile -t images < <(rg --files --follow runner-image | rg '\.qcow2\.gz$')
          test "${#images[@]}" -eq 1
          test "$(stat -c %s "${images[0]}")" -le 8589934592
          nix shell nixpkgs#awscli2 --command aws --endpoint-url "https://$SPACES_REGION.digitaloceanspaces.com" \
            s3 cp "${images[0]}" "s3://$SPACES_BUCKET/$object" --only-show-errors
          nix shell nixpkgs#awscli2 --command aws --endpoint-url "https://$SPACES_REGION.digitaloceanspaces.com" \
            s3 presign "s3://$SPACES_BUCKET/$object" --expires-in 3600 > "$RUNNER_TEMP/image-url"
          chmod 600 "$RUNNER_TEMP/image-url"
      - name: Import and publish the dependency image
        if: steps.plan.outputs.needed == 'true'
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DO_CI_TOKEN }}
          IMAGE_KEY: ${{ steps.key.outputs.key }}
          DO_REGION: ${{ vars.DO_CI_REGION || 'nyc3' }}
        run: |
          python3 tools/pv-ci/control.py import-image --key "$IMAGE_KEY" \
            --region "$DO_REGION" --url-file "$RUNNER_TEMP/image-url"
      - name: Remove staged object
        if: always() && steps.stage.outputs.object != ''
        env:
          OBJECT: ${{ steps.stage.outputs.object }}
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET_ACCESS_KEY }}
        run: |
          nix shell nixpkgs#awscli2 --command python3 tools/pv-ci/storage.py cleanup --object "$OBJECT"
