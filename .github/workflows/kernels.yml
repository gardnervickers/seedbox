name: Guest assets

on:
  push:
    branches: [main]
    paths:
      - 'kernel/**'
      - 'kernel-arm64/**'
      - 'guest/**'
      - 'nix/kernels.nix'
      - 'nix/runtime.nix'
      - 'tools/runtime/**'
      - 'tools/runtime/notices.py'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/kernels.yml'
  pull_request:
    paths:
      - 'kernel/**'
      - 'kernel-arm64/**'
      - 'guest/**'
      - 'nix/kernels.nix'
      - 'nix/runtime.nix'
      - 'tools/runtime/**'
      - 'tools/runtime/notices.py'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/kernels.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guest-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      kernel: ${{ steps.release.outputs.kernel }}
      runtime: ${{ steps.release.outputs.runtime }}
      releases: ${{ steps.release.outputs.releases }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: inputs
        name: Select changed asset recipes
        env:
          ASSET_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, subprocess
          event = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          base = event.get('before')
          if not base and 'pull_request' in event:
              base = event['pull_request']['base']['sha']
          force = os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch' or not base or set(base) == {'0'}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for kind, manifest in [('kernel', 'kernel/inputs.json'), ('runtime', 'tools/runtime/inputs.json')]:
                  groups = json.loads(pathlib.Path(manifest).read_text())
                  paths = sorted({name for group in groups.values() for name in group})
                  paths += ['flake.nix', '.github/workflows/kernels.yml']
                  changed = force
                  if not force:
                      result = subprocess.run(['git', 'diff', '--quiet', base, 'HEAD', '--', *paths])
                      if result.returncode not in (0, 1):
                          raise SystemExit(result.returncode)
                      changed = result.returncode == 1
                  output.write(f'{kind}={kind}-{os.environ["ASSET_RUN_ID"]}\n')
                  output.write(f'{kind}_changed={str(changed).lower()}\n')
          PYTHON
      - id: release
        name: Skip unchanged recipes and completed reruns
        uses: actions/github-script@v9
        env:
          KERNEL_TAG: ${{ steps.inputs.outputs.kernel }}
          RUNTIME_TAG: ${{ steps.inputs.outputs.runtime }}
          KERNEL_CHANGED: ${{ steps.inputs.outputs.kernel_changed }}
          RUNTIME_CHANGED: ${{ steps.inputs.outputs.runtime_changed }}
        with:
          script: |
            const releases = [];
            for (const kind of ['kernel', 'runtime']) {
              if (process.env[`${kind.toUpperCase()}_CHANGED`] !== 'true') {
                core.setOutput(kind, false);
                core.info(`${kind}: no asset inputs changed`);
                continue;
              }
              const tag = process.env[`${kind.toUpperCase()}_TAG`];
              let published = false;
              try {
                const { data } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
                published = !data.draft;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              core.setOutput(kind, !published);
              if (!published) releases.push({ kind, tag });
              core.info(`${tag}: ${published ? 'reuse published assets' : 'build both architectures'}`);
            }
            core.setOutput('releases', JSON.stringify(releases));

  build:
    needs: plan
    if: needs.plan.outputs.kernel == 'true' || needs.plan.outputs.runtime == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            architecture: x86_64
            runner: ubuntu-24.04
            image: bzImage
          - system: aarch64-linux
            architecture: aarch64
            runner: ubuntu-24.04-arm
            image: Image
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      SYSTEM: ${{ matrix.system }}
      ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build kernel and diagnostics
        if: needs.plan.outputs.kernel == 'true'
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          nix build ".#packages.$SYSTEM.guestKernel" --out-link kernel-output
          nix build ".#packages.$SYSTEM.guestKernelArchive" --out-link kernel-archive
          mkdir -p dist/kernel
          cp "kernel-output/$IMAGE" "dist/kernel/seedbox-kernel-$ARCHITECTURE"
          cp kernel-archive "dist/kernel/seedbox-kernel-$ARCHITECTURE.tar.gz"
      - name: Include corresponding kernel source
        if: needs.plan.outputs.kernel == 'true' && matrix.architecture == 'x86_64'
        run: |
          nix build .#guestKernelSources --out-link kernel-source
          cp kernel-source dist/kernel/seedbox-kernel-source.tar.gz
      - name: Build guest helpers
        if: needs.plan.outputs.runtime == 'true'
        run: |
          nix build ".#packages.$SYSTEM.runtimeArchive" --out-link runtime-archive
          mkdir -p dist/runtime
          cp runtime-archive "dist/runtime/seedbox-runtime-$ARCHITECTURE.tar.gz"
          test "$(stat -Lc %s runtime-archive)" -le 536870912
      - name: Include corresponding helper source
        if: needs.plan.outputs.runtime == 'true' && matrix.architecture == 'x86_64'
        run: |
          nix build .#runtimeSources --out-link runtime-source
          cp runtime-source dist/runtime/seedbox-runtime-source.tar.gz
      - name: Checksum assets
        run: |
          for kind in kernel runtime; do
            if [ -d "dist/$kind" ]; then
              (cd "dist/$kind" && sha256sum ./* > "$ARCHITECTURE.sha256")
            fi
          done
      - uses: actions/upload-artifact@v7
        if: needs.plan.outputs.kernel == 'true'
        with:
          name: kernel-${{ matrix.architecture }}
          path: dist/kernel/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: needs.plan.outputs.runtime == 'true'
        with:
          name: runtime-${{ matrix.architecture }}
          path: dist/runtime/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [plan, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.plan.outputs.releases != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.releases) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      ASSET_TAG: ${{ matrix.tag }}
      ASSET_KIND: ${{ matrix.kind }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ matrix.kind }}-*
          merge-multiple: true
          path: dist
      - name: Verify transferred assets
        run: |
          cd dist
          sha256sum --check ./*.sha256
          cat ./*.sha256 > SHA256SUMS
          rm ./*.sha256
      - id: draft
        name: Stage the release
        uses: actions/github-script@v9
        with:
          script: |
            // Tag lookup omits drafts; listing lets a failed upload resume.
            const tag = process.env.ASSET_TAG;
            const kind = process.env.ASSET_KIND;
            let release = (await github.paginate(github.rest.repos.listReleases, {
              ...context.repo, per_page: 100
            })).find(release => release.tag_name === tag);
            if (!release) {
              const contents = kind === 'kernel'
                ? 'guest kernels, resolved configuration, ARM instruction audit'
                : 'static guest supervisor and mke2fs';
              release = (await github.rest.repos.createRelease({
                ...context.repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: `Guest ${kind === 'kernel' ? 'kernels' : 'helpers'} ${tag.split('-')[1]}`,
                body: `Built from ${context.sha}. Contains native ARM64 and x86-64 ${contents}, licenses, checksums and corresponding source. Release labels identify CI runs; runtime overrides remain unrestricted.`,
                draft: true,
                prerelease: true,
                make_latest: 'false'
              })).data;
            }
            if (!release.draft) throw new Error('Refusing to overwrite a published release');
            core.setOutput('id', release.id);
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$ASSET_TAG" dist/* --clobber
      - name: Publish the complete release
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              ...context.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
              make_latest: 'false'
            });
