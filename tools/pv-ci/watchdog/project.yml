packages:
  - name: seedbox
    environment:
      DIGITALOCEAN_TOKEN: "${DIGITALOCEAN_TOKEN}"
    functions:
      - name: sweep
        runtime: python:default
        web: false
        limits:
          timeout: 60000
          memory: 128
        triggers:
          - name: seedbox-pv-expiration
            sourceType: scheduler
            sourceDetails:
              cron: '* * * * *'
