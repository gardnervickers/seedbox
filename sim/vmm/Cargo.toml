[package]
name = "seedbox-vmm"
version = "0.1.0"
edition = "2021"

[dependencies]
kvm-ioctls = "=0.25.0"
kvm-bindings = { version = "=0.14.1", features = ["fam-wrappers"] }
libc = "0.2"
serde_json = "1"
sha2 = "0.10"
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info"] }

[profile.release]
debug = 1
