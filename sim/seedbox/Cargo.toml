[package]
name = "seedbox"
version = "0.1.0"
edition = "2021"
description = "Seedbox simulation configuration and orchestration"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
shell-words = "1"
tempfile = "3"
thiserror = "2"
