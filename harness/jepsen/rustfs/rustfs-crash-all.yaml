# The current release (1.0.2) under coordinated power loss: every server fails
# together about every 20 s (10-30 s) during 75 s of PUTs and reboots 2 s later. An object acknowledged
# before a power failure must survive it intact; this asks whether RustFS syncs
# an object before acknowledging it.
# Generated by `seedbox-jepsen gen`: RustFS 1.0.2, four servers with one drive each.
name: rustfs-crash-all
machines:
  n1:
    image: docker.io/rustfs/rustfs:1.0.2@sha256:7e948dad4748bda48f8985fda7195f8cf2e4259427011f6120acc2c9acf51587
    environment:
      RUSTFS_VOLUMES: "http://n{1...4}:9000/data/rustfs0"
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_ACCESS_KEY: "jepsen"
      RUSTFS_SECRET_KEY: "jepsen-secret"
      RUSTFS_RPC_SECRET: "jepsen-rpc-secret"
      RUSTFS_CONSOLE_ENABLE: "false"
    memoryMiB: 1024
    volumes:
      data:
        target: /data
        size: 4GiB
  n2:
    image: docker.io/rustfs/rustfs:1.0.2@sha256:7e948dad4748bda48f8985fda7195f8cf2e4259427011f6120acc2c9acf51587
