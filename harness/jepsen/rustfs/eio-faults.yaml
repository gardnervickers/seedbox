# Failed disk reads and writes (EIO) on any one server at a time, with crashes,
# pauses and partitions. A failed write must not be acknowledged as durable,
# and a failed read must be served from the other shards.
start: 20s
end: 80s
interval: 3s
faults:
  - kind: disk_error
    weight: 3
    op: any
    ppm: 50000
    duration: {min: 2s, max: 8s}
  - kind: crash
    weight: 1
    downtime: {min: 1s, max: 5s}
  - kind: pause_process
    weight: 1
    duration: {min: 500ms, max: 4s}
  - kind: partition
    weight: 1
    duration: {min: 1s, max: 6s}
