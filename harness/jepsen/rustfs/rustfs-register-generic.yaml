# The current release (1.0.2) with six overwritten keys: PUT, DELETE and GET from
# clients on every node for 75 s, then a read of each key; every key's history must
# be linearizable (S3's strong read-after-write and list consistency). Run it with
# `--fault-profile harness/jepsen/rustfs/generic-faults.yaml` or `corruption-faults.yaml`.
# Generated by `seedbox-jepsen gen`: RustFS 1.0.2, four servers with one drive each.
name: rustfs-register-generic
machines:
  n1:
    image: docker.io/rustfs/rustfs:1.0.2@sha256:7e948dad4748bda48f8985fda7195f8cf2e4259427011f6120acc2c9acf51587
    environment:
      RUSTFS_VOLUMES: "http://n{1...4}:9000/data/rustfs0"
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_ACCESS_KEY: "jepsen"
      RUSTFS_SECRET_KEY: "jepsen-secret"
      RUSTFS_RPC_SECRET: "jepsen-rpc-secret"
      RUSTFS_CONSOLE_ENABLE: "false"
    memoryMiB: 1024
    volumes:
      data:
        target: /data
        size: 4GiB
