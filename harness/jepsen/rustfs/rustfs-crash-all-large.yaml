# rustfs-crash-all with 1 MiB objects, which RustFS erasure-codes into separate
# part files rather than keeping inline in its metadata.
# Generated by `seedbox-jepsen gen`: RustFS 1.0.2, four servers with one drive each.
name: rustfs-crash-all-large
machines:
  n1:
    image: docker.io/rustfs/rustfs:1.0.2@sha256:7e948dad4748bda48f8985fda7195f8cf2e4259427011f6120acc2c9acf51587
    environment:
      RUSTFS_VOLUMES: "http://n{1...4}:9000/data/rustfs0"
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_ACCESS_KEY: "jepsen"
      RUSTFS_SECRET_KEY: "jepsen-secret"
      RUSTFS_RPC_SECRET: "jepsen-rpc-secret"
      RUSTFS_CONSOLE_ENABLE: "false"
    memoryMiB: 1024
    volumes:
      data:
        target: /data
        size: 4GiB
  n2:
    image: docker.io/rustfs/rustfs:1.0.2@sha256:7e948dad4748bda48f8985fda7195f8cf2e4259427011f6120acc2c9acf51587
    environment:
      RUSTFS_VOLUMES: "http://n{1...4}:9000/data/rustfs0"
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_ACCESS_KEY: "jepsen"
      RUSTFS_SECRET_KEY: "jepsen-secret"
      RUSTFS_RPC_SECRET: "jepsen-rpc-secret"
      RUSTFS_CONSOLE_ENABLE: "false"
    memoryMiB: 1024
    volumes:
      data:
        target: /data
        size: 4GiB
  n3:
    image: docker.io/rustfs/rustfs:1.0.2@sha256:7e948dad4748bda48f8985fda7195f8cf2e4259427011f6120acc2c9acf51587
    environment:
      RUSTFS_VOLUMES: "http://n{1...4}:9000/data/rustfs0"
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_ACCESS_KEY: "jepsen"
      RUSTFS_SECRET_KEY: "jepsen-secret"
      RUSTFS_RPC_SECRET: "jepsen-rpc-secret"
      RUSTFS_CONSOLE_ENABLE: "false"
    memoryMiB: 1024
    volumes:
      data:
        target: /data
        size: 4GiB
  n4:
    image: docker.io/rustfs/rustfs:1.0.2@sha256:7e948dad4748bda48f8985fda7195f8cf2e4259427011f6120acc2c9acf51587
    environment:
      RUSTFS_VOLUMES: "http://n{1...4}:9000/data/rustfs0"
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_ACCESS_KEY: "jepsen"
      RUSTFS_SECRET_KEY: "jepsen-secret"
      RUSTFS_RPC_SECRET: "jepsen-rpc-secret"
      RUSTFS_CONSOLE_ENABLE: "false"
    memoryMiB: 1024
    volumes:
      data:
        target: /data
        size: 4GiB
oracle:
  build:
    context: ../../..
    dockerfile: crates/seedbox-jepsen/guest.Dockerfile
  entrypoint: ["/jepsen/seedbox-jepsen", "rustfs", "--crash-all-every", "20", "--size", "1048576", "--clients", "2"]
  memoryMiB: 1024
network:
  latency: 1ms
