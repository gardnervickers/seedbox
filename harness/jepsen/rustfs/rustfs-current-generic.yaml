# The current release (1.0.2), looking for unknown bugs: S3 PUTs of unique objects
# for 75 s with reads of acknowledged objects, then a read-back of every acknowledged
# object. Run it with `--fault-profile harness/jepsen/rustfs/generic-faults.yaml`
# (power loss, process pauses, partitions) or `corruption-faults.yaml` (bit flips in
# one server's object data).
# Generated by `seedbox-jepsen gen`: RustFS 1.0.2, four servers with one drive each.
