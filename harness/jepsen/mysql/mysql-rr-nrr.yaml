# MySQL 8.0.34 REPEATABLE READ non-repeatable reads (Jepsen): a transaction reads a
# row's name, updates its gender, and reads the name again, which then shows a concurrent
# rename, delete or re-insert, because InnoDB DML reads the latest committed row.
# Generated by `seedbox-jepsen gen`: MySQL 8.0.34, --workload nrr --isolation repeatable-read.
name: mysql-rr-nrr
machines:
  mysql:
    # mysqlmon.sh runs the official entrypoint and reports guest memory and the data size.
    image: docker.io/library/mysql:8.0.34@sha256:3c362d5eed04f271a2ebad41f45fed5ed86e934da533a079bcbd2b3a4ff372e8
    entrypoint: ["bash", "/mysqlmon.sh"]
    command: ["mysqld", "--datadir=/var/lib/mysql/data", "--innodb-buffer-pool-size=128M", "--max-connections=64", "--performance-schema=OFF", "--innodb-lock-wait-timeout=5", "--skip-log-bin"]
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    memoryMiB: 1024
    files:
    - source: mysqlmon.sh
      target: /mysqlmon.sh
    volumes:
      data:
        target: /var/lib/mysql
oracle:
  build:
    context: ../../..
    dockerfile: crates/seedbox-jepsen/guest.Dockerfile
  entrypoint: ["/jepsen/seedbox-jepsen", "mysql", "--workload", "nrr", "--isolation", "repeatable-read", "--label", "8.0.34/mysql-rr-nrr"]
  memoryMiB: 256
network:
  latency: 1ms
