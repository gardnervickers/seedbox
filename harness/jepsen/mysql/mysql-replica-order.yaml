# Jepsen's RDS finding on local binlog replication: with
# replica_preserve_commit_order=OFF (RDS's default), multi-threaded replicas commit out
# of the primary's order, so SERIALIZABLE read-only transactions on replicas observe
# G-single and G2-item.
# Generated by `seedbox-jepsen gen`: MySQL 8.0.34, primary and two replicas, replica_preserve_commit_order=OFF.
name: mysql-replica-order
machines:
  mysql:
    # mysqlmon.sh runs the official entrypoint and reports guest memory and the data size.
    image: docker.io/library/mysql:8.0.34@sha256:3c362d5eed04f271a2ebad41f45fed5ed86e934da533a079bcbd2b3a4ff372e8
    entrypoint: ["bash", "/mysqlmon.sh"]
    command: ["mysqld", "--datadir=/var/lib/mysql/data", "--innodb-buffer-pool-size=128M", "--max-connections=64", "--performance-schema=OFF", "--innodb-lock-wait-timeout=5", "--server-id=1", "--binlog-transaction-dependency-tracking=WRITESET", "--gtid-mode=ON", "--enforce-gtid-consistency=ON"]
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    memoryMiB: 1024
    files:
    - source: mysqlmon.sh
      target: /mysqlmon.sh
    volumes:
      data:
        target: /var/lib/mysql
  r1:
    # mysqlmon.sh runs the official entrypoint and reports guest memory and the data size.
    image: docker.io/library/mysql:8.0.34@sha256:3c362d5eed04f271a2ebad41f45fed5ed86e934da533a079bcbd2b3a4ff372e8
    entrypoint: ["bash", "/mysqlmon.sh"]
    command: ["mysqld", "--datadir=/var/lib/mysql/data", "--innodb-buffer-pool-size=128M", "--max-connections=64", "--performance-schema=OFF", "--innodb-lock-wait-timeout=5", "--server-id=2", "--skip-log-bin", "--replica-parallel-workers=4", "--replica-parallel-type=LOGICAL_CLOCK", "--replica-preserve-commit-order=OFF", "--gtid-mode=ON", "--enforce-gtid-consistency=ON"]
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    memoryMiB: 1024
    files:
    - source: mysqlmon.sh
      target: /mysqlmon.sh
    volumes:
      data:
        target: /var/lib/mysql
  r2:
    # mysqlmon.sh runs the official entrypoint and reports guest memory and the data size.
    image: docker.io/library/mysql:8.0.34@sha256:3c362d5eed04f271a2ebad41f45fed5ed86e934da533a079bcbd2b3a4ff372e8
    entrypoint: ["bash", "/mysqlmon.sh"]
    command: ["mysqld", "--datadir=/var/lib/mysql/data", "--innodb-buffer-pool-size=128M", "--max-connections=64", "--performance-schema=OFF", "--innodb-lock-wait-timeout=5", "--server-id=3", "--skip-log-bin", "--replica-parallel-workers=4", "--replica-parallel-type=LOGICAL_CLOCK", "--replica-preserve-commit-order=OFF", "--gtid-mode=ON", "--enforce-gtid-consistency=ON"]
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    memoryMiB: 1024
    files:
    - source: mysqlmon.sh
      target: /mysqlmon.sh
    volumes:
      data:
        target: /var/lib/mysql
oracle:
  build:
    context: ../../..
    dockerfile: crates/seedbox-jepsen/guest.Dockerfile
  entrypoint: ["/jepsen/seedbox-jepsen", "mysql", "--workload", "append", "--isolation", "serializable", "--replica", "r1", "--replica", "r2", "--label", "8.0.34/mysql-replica-order"]
  memoryMiB: 256
network:
  latency: 1ms
