# MySQL 8.0.34 with innodb_flush_log_at_trx_commit=0 acknowledges commits it has
# not written: power-fail the node at 20 s and reboot it, and acknowledged appends
# are missing from the final read. SERIALIZABLE, so only durability can fail.
# Generated by `seedbox-jepsen gen`: MySQL 8.0.34, --workload append --isolation serializable --duration 45 --crash-at 20.
name: mysql-crash-flush0
machines:
  mysql:
    # mysqlmon.sh runs the official entrypoint and reports guest memory and the data size.
    image: docker.io/library/mysql:8.0.34@sha256:3c362d5eed04f271a2ebad41f45fed5ed86e934da533a079bcbd2b3a4ff372e8
    entrypoint: ["bash", "/mysqlmon.sh"]
    command: ["mysqld", "--datadir=/var/lib/mysql/data", "--innodb-buffer-pool-size=128M", "--max-connections=64", "--performance-schema=OFF", "--innodb-lock-wait-timeout=5", "--skip-log-bin", "--innodb-flush-log-at-trx-commit=0"]
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    memoryMiB: 1024
    files:
    - source: mysqlmon.sh
      target: /mysqlmon.sh
    volumes:
      data:
        target: /var/lib/mysql
oracle:
  build:
    context: ../../..
    dockerfile: crates/seedbox-jepsen/guest.Dockerfile
  entrypoint: ["/jepsen/seedbox-jepsen", "mysql", "--workload", "append", "--isolation", "serializable", "--duration", "45", "--crash-at", "20", "--label", "8.0.34/mysql-crash-flush0"]
  memoryMiB: 256
network:
  latency: 1ms
