# MySQL 8.0.34 REPEATABLE READ is not Adya's repeatable read (Jepsen, 2023-12-19):
# on one healthy node, list-append commits G-single, G2-item and lost updates (P4), and
# reads after a transaction's own write see other transactions' commits (internal).
# Generated by `seedbox-jepsen gen`: MySQL 8.0.34, --workload append --isolation repeatable-read.
name: mysql-rr-append
machines:
  mysql:
    # mysqlmon.sh runs the official entrypoint and reports guest memory and the data size.
    build:
      context: image
      dockerfile: mysql-8.0.34.Dockerfile
    entrypoint: ["bash", "/mysqlmon.sh"]
    command: ["mysqld", "--datadir=/var/lib/mysql/data", "--innodb-buffer-pool-size=128M", "--max-connections=64", "--performance-schema=OFF", "--innodb-lock-wait-timeout=5", "--skip-log-bin"]
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    memoryMiB: 1536
    files:
    - source: mysqlmon.sh
      target: /mysqlmon.sh
    volumes:
      data:
        target: /var/lib/mysql
oracle:
  build:
    context: ../../..
    dockerfile: crates/seedbox-jepsen/guest.Dockerfile
  entrypoint: ["/jepsen/seedbox-jepsen", "mysql", "--workload", "append", "--isolation", "repeatable-read", "--label", "8.0.34/mysql-rr-append"]
  memoryMiB: 256
network:
  latency: 1ms
