# Negative control for mysql-crash-flush0: the default innodb_flush_log_at_trx_commit=1
# keeps every acknowledged append through the same power failure.
# Generated by `seedbox-jepsen gen`: MySQL 8.0.34, --workload append --isolation serializable --duration 45 --crash-at 20.
name: mysql-crash-flush1
machines:
  mysql:
    # mysqlmon.sh runs the official entrypoint and reports guest memory and the data size.
    build:
      context: image
      dockerfile: mysql-8.0.34.Dockerfile
    entrypoint: ["bash", "/mysqlmon.sh"]
    command: ["mysqld", "--datadir=/var/lib/mysql/data", "--innodb-buffer-pool-size=128M", "--max-connections=64", "--performance-schema=OFF", "--innodb-lock-wait-timeout=5", "--skip-log-bin", "--innodb-flush-log-at-trx-commit=1"]
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    memoryMiB: 1536
    files:
    - source: mysqlmon.sh
      target: /mysqlmon.sh
    volumes:
      data:
        target: /var/lib/mysql
oracle:
  build:
    context: ../../..
    dockerfile: crates/seedbox-jepsen/guest.Dockerfile
  entrypoint: ["/jepsen/seedbox-jepsen", "mysql", "--workload", "append", "--isolation", "serializable", "--duration", "45", "--crash-at", "20", "--label", "8.0.34/mysql-crash-flush1"]
  memoryMiB: 256
network:
  latency: 1ms
