# mysql-rr-append on MySQL 8.4.6: the behaviour is by design, so RR anomalies remain.
# Generated by `seedbox-jepsen gen`: MySQL 8.4.6, --workload append --isolation repeatable-read.
name: mysql846-rr-append
machines:
  mysql:
    # mysqlmon.sh runs the official entrypoint and reports guest memory and the data size.
    image: docker.io/library/mysql:8.4.6@sha256:6752fee1ed70df146fe22d5d1656deee79463f780a24cb7e67c807f2f07d7dc5
    entrypoint: ["bash", "/mysqlmon.sh"]
    command: ["mysqld", "--datadir=/var/lib/mysql/data", "--innodb-buffer-pool-size=128M", "--max-connections=64", "--performance-schema=OFF", "--innodb-lock-wait-timeout=5", "--skip-log-bin"]
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    memoryMiB: 1024
    files:
    - source: mysqlmon.sh
      target: /mysqlmon.sh
    volumes:
      data:
        target: /var/lib/mysql
oracle:
  build:
    context: ../../..
    dockerfile: crates/seedbox-jepsen/guest.Dockerfile
  entrypoint: ["/jepsen/seedbox-jepsen", "mysql", "--workload", "append", "--isolation", "repeatable-read", "--label", "8.4.6/mysql846-rr-append"]
  memoryMiB: 256
network:
  latency: 1ms
