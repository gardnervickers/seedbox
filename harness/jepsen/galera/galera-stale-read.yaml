# MDEV-38999: write on n1, read on n2, no faults. A transaction on n2 that begins after
# an append on n1 was acknowledged does not observe it (a real-time stale read):
# replication is not synchronous with the acknowledgement.
# Generated by `seedbox-jepsen gen`: MariaDB 12.1.2, Galera 26.4.24, three nodes, innodb_flush_log_at_trx_commit=0, --client-nodes n1,n2 --read-only n2.
name: galera-stale-read
machines:
  n1:
    # galera-node.sh recovers the node's position and waits for the oracle to say bootstrap or join.
    build:
      context: image
      dockerfile: mariadb-12.1.2.Dockerfile
    entrypoint: ["bash", "/galera-node.sh"]
    command: ["--wsrep-node-address=n1", "--wsrep-node-name=n1", "--innodb-flush-log-at-trx-commit=0"]
    environment:
      GALERA_NODE: "n1"
    memoryMiB: 1280
    files:
    - source: galera-node.sh
      target: /galera-node.sh
    - source: galera.cnf
      target: /etc/mysql/mariadb.conf.d/99-jepsen-galera.cnf
    volumes:
      data:
        target: /var/lib/mysql
  n2:
    # galera-node.sh recovers the node's position and waits for the oracle to say bootstrap or join.
    build:
      context: image
      dockerfile: mariadb-12.1.2.Dockerfile
    entrypoint: ["bash", "/galera-node.sh"]
    command: ["--wsrep-node-address=n2", "--wsrep-node-name=n2", "--innodb-flush-log-at-trx-commit=0"]
    environment:
      GALERA_NODE: "n2"
    memoryMiB: 1280
    files:
    - source: galera-node.sh
      target: /galera-node.sh
    - source: galera.cnf
      target: /etc/mysql/mariadb.conf.d/99-jepsen-galera.cnf
    volumes:
      data:
        target: /var/lib/mysql
  n3:
    # galera-node.sh recovers the node's position and waits for the oracle to say bootstrap or join.
    build:
      context: image
      dockerfile: mariadb-12.1.2.Dockerfile
    entrypoint: ["bash", "/galera-node.sh"]
    command: ["--wsrep-node-address=n3", "--wsrep-node-name=n3", "--innodb-flush-log-at-trx-commit=0"]
    environment:
      GALERA_NODE: "n3"
    memoryMiB: 1280
    files:
    - source: galera-node.sh
      target: /galera-node.sh
    - source: galera.cnf
      target: /etc/mysql/mariadb.conf.d/99-jepsen-galera.cnf
    volumes:
      data:
        target: /var/lib/mysql
oracle:
  build:
    context: ../../..
    dockerfile: crates/seedbox-jepsen/guest.Dockerfile
  entrypoint: ["/jepsen/seedbox-jepsen", "galera", "--client-nodes", "n1,n2", "--read-only", "n2", "--label", "12.1.2/galera-stale-read"]
  memoryMiB: 256
network:
  latency: 1ms
