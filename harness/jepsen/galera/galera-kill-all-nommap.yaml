# galera-kill-all with innodb_log_file_mmap=OFF. MariaDB 12 memory-maps the redo log by
# default on Linux, so redo records are in the page cache as soon as they are written and a
# process kill loses nothing; with the log written from a private buffer once a second, the
# kill loses the acknowledged commits still in that buffer, as Jepsen saw.
# Generated by `seedbox-jepsen gen`: MariaDB 12.1.2, Galera 26.4.24, three nodes, innodb_flush_log_at_trx_commit=0, --fault kill --fault-at 20 --duration 130.
name: galera-kill-all-nommap
machines:
  n1:
    # galera-node.sh recovers the node's position and waits for the oracle to say bootstrap or join.
    build:
      context: image
      dockerfile: mariadb-12.1.2.Dockerfile
    entrypoint: ["bash", "/galera-node.sh"]
    command: ["--wsrep-node-address=n1", "--wsrep-node-name=n1", "--innodb-flush-log-at-trx-commit=0", "--innodb-log-file-mmap=OFF"]
    environment:
      GALERA_NODE: "n1"
    memoryMiB: 1280
    files:
    - source: galera-node.sh
      target: /galera-node.sh
    - source: galera.cnf
      target: /etc/mysql/mariadb.conf.d/99-jepsen-galera.cnf
    volumes:
      data:
        target: /var/lib/mysql
  n2:
    # galera-node.sh recovers the node's position and waits for the oracle to say bootstrap or join.
    build:
      context: image
      dockerfile: mariadb-12.1.2.Dockerfile
    entrypoint: ["bash", "/galera-node.sh"]
    command: ["--wsrep-node-address=n2", "--wsrep-node-name=n2", "--innodb-flush-log-at-trx-commit=0", "--innodb-log-file-mmap=OFF"]
    environment:
      GALERA_NODE: "n2"
    memoryMiB: 1280
    files:
    - source: galera-node.sh
      target: /galera-node.sh
    - source: galera.cnf
      target: /etc/mysql/mariadb.conf.d/99-jepsen-galera.cnf
    volumes:
      data:
        target: /var/lib/mysql
  n3:
    # galera-node.sh recovers the node's position and waits for the oracle to say bootstrap or join.
    build:
      context: image
      dockerfile: mariadb-12.1.2.Dockerfile
    entrypoint: ["bash", "/galera-node.sh"]
    command: ["--wsrep-node-address=n3", "--wsrep-node-name=n3", "--innodb-flush-log-at-trx-commit=0", "--innodb-log-file-mmap=OFF"]
    environment:
      GALERA_NODE: "n3"
    memoryMiB: 1280
    files:
    - source: galera-node.sh
      target: /galera-node.sh
    - source: galera.cnf
      target: /etc/mysql/mariadb.conf.d/99-jepsen-galera.cnf
    volumes:
      data:
        target: /var/lib/mysql
oracle:
  build:
    context: ../../..
    dockerfile: crates/seedbox-jepsen/guest.Dockerfile
  entrypoint: ["/jepsen/seedbox-jepsen", "galera", "--fault", "kill", "--fault-at", "20", "--duration", "130", "--label", "12.1.2/galera-kill-all-nommap"]
  memoryMiB: 1024
network:
  latency: 1ms
