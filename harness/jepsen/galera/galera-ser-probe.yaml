# Diagnostic for galera-healthy-append-ser: the same workload, and after every statement
# of a multi-statement transaction the client checks @@in_transaction. A session that
# silently left its transaction (rolled back by a brute-force abort) yet goes on to
# COMMIT successfully is reported as transaction-ended-early.
# Generated by `seedbox-jepsen gen`: MariaDB 12.1.2, Galera 26.4.24, three nodes, innodb_flush_log_at_trx_commit=0, --isolation serializable --probe-transaction.
name: galera-ser-probe
machines:
  n1:
    # galera-node.sh recovers the node's position and waits for the oracle to say bootstrap or join.
    build:
      context: image
      dockerfile: mariadb-12.1.2.Dockerfile
    entrypoint: ["bash", "/galera-node.sh"]
    command: ["--wsrep-node-address=n1", "--wsrep-node-name=n1", "--innodb-flush-log-at-trx-commit=0"]
    environment:
      GALERA_NODE: "n1"
    memoryMiB: 1280
    files:
    - source: galera-node.sh
      target: /galera-node.sh
    - source: galera.cnf
      target: /etc/mysql/mariadb.conf.d/99-jepsen-galera.cnf
    volumes:
      data:
        target: /var/lib/mysql
  n2:
    # galera-node.sh recovers the node's position and waits for the oracle to say bootstrap or join.
    build:
      context: image
      dockerfile: mariadb-12.1.2.Dockerfile
    entrypoint: ["bash", "/galera-node.sh"]
    command: ["--wsrep-node-address=n2", "--wsrep-node-name=n2", "--innodb-flush-log-at-trx-commit=0"]
    environment:
      GALERA_NODE: "n2"
    memoryMiB: 1280
    files:
    - source: galera-node.sh
      target: /galera-node.sh
    - source: galera.cnf
      target: /etc/mysql/mariadb.conf.d/99-jepsen-galera.cnf
    volumes:
      data:
        target: /var/lib/mysql
  n3:
    # galera-node.sh recovers the node's position and waits for the oracle to say bootstrap or join.
    build:
      context: image
      dockerfile: mariadb-12.1.2.Dockerfile
    entrypoint: ["bash", "/galera-node.sh"]
    command: ["--wsrep-node-address=n3", "--wsrep-node-name=n3", "--innodb-flush-log-at-trx-commit=0"]
    environment:
      GALERA_NODE: "n3"
    memoryMiB: 1280
    files:
    - source: galera-node.sh
      target: /galera-node.sh
    - source: galera.cnf
      target: /etc/mysql/mariadb.conf.d/99-jepsen-galera.cnf
    volumes:
      data:
        target: /var/lib/mysql
oracle:
  build:
    context: ../../..
    dockerfile: crates/seedbox-jepsen/guest.Dockerfile
  entrypoint: ["/jepsen/seedbox-jepsen", "galera", "--isolation", "serializable", "--probe-transaction", "--label", "12.1.2/galera-ser-probe"]
  memoryMiB: 1024
network:
  latency: 1ms
