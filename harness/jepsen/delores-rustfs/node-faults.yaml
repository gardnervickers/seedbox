# For the delores-rustfs scenarios, never touching the in-memory demo
# sequencer and never wiping an S3 volume: one RustFS server isolated from
# every node, a node cut off from every RustFS server, SIGKILL (a fresh ballot
# incarnation) and SIGSTOP of a node or a RustFS server, power loss of a
# RustFS server (volume kept) or a node, and wall-clock steps. Pauses run up
# to 20 s, past the nodes' CASPaxos, S3 and request timeouts. The oracle's
# operations run 120 s.
start: 15s
end: 110s
interval: 3s
targets: [n1, n2, n3, s3-a, s3-b, s3-c]
faults:
  - kind: pause_process
    weight: 2
    duration: {min: 500ms, max: 20s}
  - kind: partition
    weight: 2
    duration: {min: 1s, max: 8s}
    from: [n1, n2, n3]
  - kind: partition
    weight: 2
    duration: {min: 1s, max: 8s}
    from: [s3-a, s3-b, s3-c]
  - kind: stop
    weight: 2
    downtime: {min: 1s, max: 6s}
  - kind: crash
    weight: 1
    downtime: {min: 1s, max: 5s}
  - kind: clock_skew
    weight: 1
    duration: {min: 3s, max: 15s}
    maxOffset: 30s
