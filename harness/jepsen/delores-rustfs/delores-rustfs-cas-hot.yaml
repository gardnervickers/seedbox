# Adversarial: one CASPaxos register, twelve clients with no think time racing reads,
# writes and compare-and-sets through all three nodes, while the oracle cuts single
# links (a node from one S3 server, from the sequencer or from another node) about
# every 4 s, overlapping. Run it with `node-adversarial-faults.yaml` for compound
# faults. The register's history must stay linearizable.
# Generated by `seedbox-jepsen gen`: delores jepsen-node, three nodes, three independent single-drive RustFS 1.0.2.
name: delores-rustfs-cas-hot
machines:
  s3-a:
    image: docker.io/rustfs/rustfs:1.0.2@sha256:7e948dad4748bda48f8985fda7195f8cf2e4259427011f6120acc2c9acf51587
    environment:
      RUSTFS_VOLUMES: "/data/rustfs0"
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_ACCESS_KEY: "jepsen"
      RUSTFS_SECRET_KEY: "jepsen-secret"
      RUSTFS_CONSOLE_ENABLE: "false"
    memoryMiB: 1024
    volumes:
      data:
        target: /data
        size: 3GiB
  s3-b:
    image: docker.io/rustfs/rustfs:1.0.2@sha256:7e948dad4748bda48f8985fda7195f8cf2e4259427011f6120acc2c9acf51587
    environment:
      RUSTFS_VOLUMES: "/data/rustfs0"
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_ACCESS_KEY: "jepsen"
      RUSTFS_SECRET_KEY: "jepsen-secret"
      RUSTFS_CONSOLE_ENABLE: "false"
    memoryMiB: 1024
    volumes:
      data:
        target: /data
        size: 3GiB
  s3-c:
    image: docker.io/rustfs/rustfs:1.0.2@sha256:7e948dad4748bda48f8985fda7195f8cf2e4259427011f6120acc2c9acf51587
    environment:
      RUSTFS_VOLUMES: "/data/rustfs0"
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_ACCESS_KEY: "jepsen"
      RUSTFS_SECRET_KEY: "jepsen-secret"
      RUSTFS_CONSOLE_ENABLE: "false"
    memoryMiB: 1024
    volumes:
      data:
        target: /data
        size: 3GiB
  sequencer:
    # The in-memory demo sequencer: never fault it (losing it is a liveness test).
    image: localhost/seedbox-jepsen/delores-jepsen-node:current
    command: ["sequencer"]
    environment:
      RUST_LOG: "info"
      NO_COLOR: "1"
      S3_ENDPOINTS: "s3-a=http://s3-a:9000,s3-b=http://s3-b:9000,s3-c=http://s3-c:9000"
      S3_BUCKET: "delores"
      AWS_ACCESS_KEY_ID: "jepsen"
      AWS_SECRET_ACCESS_KEY: "jepsen-secret"
      SEQUENCER_ENDPOINT: "tcp://sequencer:7100"
      BIND: "0.0.0.0:7100"
    memoryMiB: 512
  n1:
    # `node` first runs the idempotent `init` (bucket and view register).
    image: localhost/seedbox-jepsen/delores-jepsen-node:current
    command: ["node"]
    environment:
      RUST_LOG: "info"
      NO_COLOR: "1"
      S3_ENDPOINTS: "s3-a=http://s3-a:9000,s3-b=http://s3-b:9000,s3-c=http://s3-c:9000"
      S3_BUCKET: "delores"
      AWS_ACCESS_KEY_ID: "jepsen"
      AWS_SECRET_ACCESS_KEY: "jepsen-secret"
      SEQUENCER_ENDPOINT: "tcp://sequencer:7100"
      NODE_ID: "n1"
      BIND: "0.0.0.0:8080"
    memoryMiB: 512
  n2:
    # `node` first runs the idempotent `init` (bucket and view register).
    image: localhost/seedbox-jepsen/delores-jepsen-node:current
    command: ["node"]
    environment:
      RUST_LOG: "info"
      NO_COLOR: "1"
      S3_ENDPOINTS: "s3-a=http://s3-a:9000,s3-b=http://s3-b:9000,s3-c=http://s3-c:9000"
      S3_BUCKET: "delores"
      AWS_ACCESS_KEY_ID: "jepsen"
      AWS_SECRET_ACCESS_KEY: "jepsen-secret"
      SEQUENCER_ENDPOINT: "tcp://sequencer:7100"
      NODE_ID: "n2"
      BIND: "0.0.0.0:8080"
    memoryMiB: 512
  n3:
    # `node` first runs the idempotent `init` (bucket and view register).
    image: localhost/seedbox-jepsen/delores-jepsen-node:current
    command: ["node"]
    environment:
      RUST_LOG: "info"
      NO_COLOR: "1"
      S3_ENDPOINTS: "s3-a=http://s3-a:9000,s3-b=http://s3-b:9000,s3-c=http://s3-c:9000"
      S3_BUCKET: "delores"
      AWS_ACCESS_KEY_ID: "jepsen"
      AWS_SECRET_ACCESS_KEY: "jepsen-secret"
      SEQUENCER_ENDPOINT: "tcp://sequencer:7100"
      NODE_ID: "n3"
      BIND: "0.0.0.0:8080"
    memoryMiB: 512
oracle:
  build:
    context: ../../..
    dockerfile: crates/seedbox-jepsen/guest.Dockerfile
  entrypoint: ["/jepsen/seedbox-jepsen", "delores-node", "--duration", "120", "--workload", "cas-register", "--registers", "1", "--clients", "12", "--think-ms", "0", "--chaos-cuts", "4"]
  memoryMiB: 1024
network:
  latency: 1ms
