# Three delores jepsen-nodes, each running SMR over a virtual log whose metadata
# register is CASPaxos over three independent single-drive RustFS 1.0.2 servers (no
# erasure set or replication between them; one acceptor and one log-drive replica
# each, the conditional PUT is the primitive), with slots from the in-memory demo
# sequencer.
# Six clients read, write and compare-and-set five CASPaxos registers
# (/cas-register) through random nodes for 120 s; then every node reads every
# register. Each register's history must be linearizable and the final reads must
# agree. Run it without a profile for a baseline, or with a
# profile from harness/jepsen/delores-rustfs, none of which fault the sequencer.
# Generated by `seedbox-jepsen gen`: delores jepsen-node, three nodes, three independent single-drive RustFS 1.0.2.
name: delores-rustfs-cas
machines:
  s3-a:
    image: docker.io/rustfs/rustfs:1.0.2@sha256:7e948dad4748bda48f8985fda7195f8cf2e4259427011f6120acc2c9acf51587
    environment:
      RUSTFS_VOLUMES: "/data/rustfs0"
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_ACCESS_KEY: "jepsen"
      RUSTFS_SECRET_KEY: "jepsen-secret"
      RUSTFS_CONSOLE_ENABLE: "false"
    memoryMiB: 1024
    volumes:
      data:
        target: /data
        size: 3GiB
  s3-b:
    image: docker.io/rustfs/rustfs:1.0.2@sha256:7e948dad4748bda48f8985fda7195f8cf2e4259427011f6120acc2c9acf51587
    environment:
      RUSTFS_VOLUMES: "/data/rustfs0"
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_ACCESS_KEY: "jepsen"
      RUSTFS_SECRET_KEY: "jepsen-secret"
      RUSTFS_CONSOLE_ENABLE: "false"
    memoryMiB: 1024
    volumes:
      data:
        target: /data
        size: 3GiB
  s3-c:
    image: docker.io/rustfs/rustfs:1.0.2@sha256:7e948dad4748bda48f8985fda7195f8cf2e4259427011f6120acc2c9acf51587
    environment:
      RUSTFS_VOLUMES: "/data/rustfs0"
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_ACCESS_KEY: "jepsen"
      RUSTFS_SECRET_KEY: "jepsen-secret"
      RUSTFS_CONSOLE_ENABLE: "false"
    memoryMiB: 1024
    volumes:
      data:
        target: /data
        size: 3GiB
  sequencer:
    # The in-memory demo sequencer: never fault it (losing it is a liveness test).
    image: localhost/seedbox-jepsen/delores-jepsen-node:current
    command: ["sequencer"]
    environment:
      RUST_LOG: "info"
      NO_COLOR: "1"
      S3_ENDPOINTS: "s3-a=http://s3-a:9000,s3-b=http://s3-b:9000,s3-c=http://s3-c:9000"
      S3_BUCKET: "delores"
      AWS_ACCESS_KEY_ID: "jepsen"
      AWS_SECRET_ACCESS_KEY: "jepsen-secret"
      SEQUENCER_ENDPOINT: "tcp://sequencer:7100"
      BIND: "0.0.0.0:7100"
    memoryMiB: 512
  n1:
    # `node` first runs the idempotent `init` (bucket and view register).
    image: localhost/seedbox-jepsen/delores-jepsen-node:current
    command: ["node"]
    environment:
      RUST_LOG: "info"
      NO_COLOR: "1"
      S3_ENDPOINTS: "s3-a=http://s3-a:9000,s3-b=http://s3-b:9000,s3-c=http://s3-c:9000"
      S3_BUCKET: "delores"
      AWS_ACCESS_KEY_ID: "jepsen"
      AWS_SECRET_ACCESS_KEY: "jepsen-secret"
      SEQUENCER_ENDPOINT: "tcp://sequencer:7100"
      NODE_ID: "n1"
      BIND: "0.0.0.0:8080"
    memoryMiB: 512
  n2:
    # `node` first runs the idempotent `init` (bucket and view register).
    image: localhost/seedbox-jepsen/delores-jepsen-node:current
    command: ["node"]
    environment:
      RUST_LOG: "info"
      NO_COLOR: "1"
      S3_ENDPOINTS: "s3-a=http://s3-a:9000,s3-b=http://s3-b:9000,s3-c=http://s3-c:9000"
      S3_BUCKET: "delores"
      AWS_ACCESS_KEY_ID: "jepsen"
      AWS_SECRET_ACCESS_KEY: "jepsen-secret"
      SEQUENCER_ENDPOINT: "tcp://sequencer:7100"
      NODE_ID: "n2"
      BIND: "0.0.0.0:8080"
    memoryMiB: 512
  n3:
    # `node` first runs the idempotent `init` (bucket and view register).
    image: localhost/seedbox-jepsen/delores-jepsen-node:current
    command: ["node"]
    environment:
      RUST_LOG: "info"
      NO_COLOR: "1"
      S3_ENDPOINTS: "s3-a=http://s3-a:9000,s3-b=http://s3-b:9000,s3-c=http://s3-c:9000"
      S3_BUCKET: "delores"
      AWS_ACCESS_KEY_ID: "jepsen"
      AWS_SECRET_ACCESS_KEY: "jepsen-secret"
      SEQUENCER_ENDPOINT: "tcp://sequencer:7100"
      NODE_ID: "n3"
      BIND: "0.0.0.0:8080"
    memoryMiB: 512
oracle:
  build:
    context: ../../..
    dockerfile: crates/seedbox-jepsen/guest.Dockerfile
  entrypoint: ["/jepsen/seedbox-jepsen", "delores-node", "--duration", "120", "--workload", "cas-register"]
  memoryMiB: 1024
network:
  latency: 1ms
