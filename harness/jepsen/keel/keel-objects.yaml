# One keel-s3dd server with the poll I/O backend and objects in the segment log.
# Looking for unknown bugs: S3 PUTs of unique 4 KiB objects from four clients for
# 60 s with reads of acknowledged objects, then a read-back and a listing of every
# acknowledged object. keel-s3dd acknowledges a write only once it is synced, so
# nothing acknowledged may be lost. Run it without a fault profile for a baseline,
# or with `--fault-profile harness/jepsen/keel/generic-faults.yaml`.
# Generated by `seedbox-jepsen gen`: keel-s3dd, one server, --io-backend poll --object-placement log.
name: keel-objects
machines:
  s3:
    # run-s3dd.sh restarts keel-s3dd whenever it exits, as a supervisor would.
    image: localhost/seedbox-jepsen/keel-s3dd:current
    entrypoint: ["/bin/sh", "/run-s3dd.sh"]
    command: ["--listen", "0.0.0.0:9000", "--data-dir", "/data", "--access-key", "jepsen", "--secret-key", "jepsen-secret", "--region", "us-east-1", "--io-backend", "poll", "--object-placement", "log", "--store-segments", "32"]
    memoryMiB: 512
    files:
    - source: run-s3dd.sh
      target: /run-s3dd.sh
    volumes:
      data:
        target: /data
        size: 2GiB
oracle:
  build:
    context: ../../..
    dockerfile: crates/seedbox-jepsen/guest.Dockerfile
  entrypoint: ["/jepsen/seedbox-jepsen", "keel-s3", "--nodes", "s3", "--duration", "60", "--size", "4096"]
  memoryMiB: 1024
network:
  latency: 1ms
