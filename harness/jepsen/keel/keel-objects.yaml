# One keel-s3dd server with the poll I/O backend and objects in the segment log.
# Looking for unknown bugs: S3 PUTs of unique 16 KiB objects from twelve clients for
# 120 s with reads of acknowledged objects, then a read-back and a listing of every
# acknowledged object. keel-s3dd acknowledges a write only once it is synced, so
# nothing acknowledged may be lost. Run it without a fault profile for a baseline,
# or with `--fault-profile harness/jepsen/keel/below-pause-faults.yaml` or
# `above-pause-faults.yaml`. Known failing with `corruption-faults.yaml` until keel
# stops truncating its log after a corrupted read during recovery (5frhxmz3).
# Generated by `seedbox-jepsen gen`: keel-s3dd, one server, --io-backend poll --object-placement log.
name: keel-objects
machines:
  s3:
    # run-s3dd.sh restarts keel-s3dd whenever it exits, as a supervisor would.
    image: localhost/seedbox-jepsen/keel-s3dd:current
    entrypoint: ["/bin/sh", "/run-s3dd.sh"]
    command: ["--listen", "0.0.0.0:9000", "--data-dir", "/data", "--access-key", "jepsen", "--secret-key", "jepsen-secret", "--region", "us-east-1", "--io-backend", "poll", "--object-placement", "log", "--store-segments", "64", "--watchdog-wedge-ms", "12000"]
    memoryMiB: 512
    files:
    - source: run-s3dd.sh
      target: /run-s3dd.sh
    volumes:
      data:
        target: /data
        size: 3GiB
    expectedCrashes:
    - signal: SIGABRT
      command: "keel-watchdog"
oracle:
  build:
    context: ../../..
    dockerfile: crates/seedbox-jepsen/guest.Dockerfile
  entrypoint: ["/jepsen/seedbox-jepsen", "keel-s3", "--nodes", "s3", "--duration", "120", "--clients", "12", "--think-ms", "5", "--size", "16384", "--timeout", "30"]
  memoryMiB: 1024
network:
  latency: 1ms
