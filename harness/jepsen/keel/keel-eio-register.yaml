# keel-register under failed disk requests, power-cycled before the checks like
# keel-eio: run it with `--fault-profile harness/jepsen/keel/eio-data-faults.yaml`. A
# wedged keel-s3dd answers every write with an ambiguous 500, so a client waits 1 s
# after each unknown outcome to keep the history checkable.
# Generated by `seedbox-jepsen gen`: keel-s3dd, one server, --io-backend poll --object-placement log.
name: keel-eio-register
machines:
  s3:
    # run-s3dd.sh restarts keel-s3dd whenever it exits, as a supervisor would.
    image: localhost/seedbox-jepsen/keel-s3dd:current
    entrypoint: ["/bin/sh", "/run-s3dd.sh"]
    command: ["--listen", "0.0.0.0:9000", "--data-dir", "/data", "--access-key", "jepsen", "--secret-key", "jepsen-secret", "--region", "us-east-1", "--io-backend", "poll", "--object-placement", "log", "--store-segments", "64", "--watchdog-wedge-ms", "12000"]
    memoryMiB: 512
    files:
    - source: run-s3dd.sh
      target: /run-s3dd.sh
    volumes:
      data:
        target: /data
        size: 3GiB
oracle:
  build:
    context: ../../..
    dockerfile: crates/seedbox-jepsen/guest.Dockerfile
  entrypoint: ["/jepsen/seedbox-jepsen", "keel-s3", "--nodes", "s3", "--workload", "cas-register", "--size", "1024", "--keys", "4", "--reboot-before-check", "--unknown-backoff-ms", "1000", "--duration", "60"]
  memoryMiB: 1024
network:
  latency: 1ms
