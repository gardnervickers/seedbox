# One keel-s3dd server with the poll I/O backend and objects in the segment log.
# Four registers: reads, PUTs, DELETEs and compare-and-set by conditional PUT (a GET,
# then If-Match on its ETag, or If-None-Match from absent) from twelve clients for 120 s,
# then a read of each key. Every key's history must be linearizable. Run it with
# `--fault-profile harness/jepsen/keel/below-pause-faults.yaml` or `above-pause-faults.yaml`.
# Generated by `seedbox-jepsen gen`: keel-s3dd, one server, --io-backend poll --object-placement log.
name: keel-register
machines:
  s3:
    # run-s3dd.sh restarts keel-s3dd whenever it exits, as a supervisor would.
    image: localhost/seedbox-jepsen/keel-s3dd:current
    entrypoint: ["/bin/sh", "/run-s3dd.sh"]
    command: ["--listen", "0.0.0.0:9000", "--data-dir", "/data", "--access-key", "jepsen", "--secret-key", "jepsen-secret", "--region", "us-east-1", "--io-backend", "poll", "--object-placement", "log", "--store-segments", "64", "--watchdog-wedge-ms", "12000"]
    memoryMiB: 512
    files:
    - source: run-s3dd.sh
      target: /run-s3dd.sh
    volumes:
      data:
        target: /data
        size: 3GiB
oracle:
  build:
    context: ../../..
    dockerfile: crates/seedbox-jepsen/guest.Dockerfile
  entrypoint: ["/jepsen/seedbox-jepsen", "keel-s3", "--nodes", "s3", "--workload", "cas-register", "--keys", "4", "--duration", "120", "--clients", "12", "--think-ms", "5", "--size", "16384"]
  memoryMiB: 1024
network:
  latency: 1ms
