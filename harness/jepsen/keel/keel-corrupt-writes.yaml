# keel-objects under silent corruption of written data: run it with
# `--fault-profile harness/jepsen/keel/corruption-write-faults.yaml`. One server keeps one
# copy, so corrupted objects may be lost; but every read must return the bytes written
# or an error, never other bytes, and a listing must hold only keys some client wrote.
# The server is power-cycled once the faults end; keel-s3dd then refuses to start on a
# corrupt frame mid-log (exit 3) rather than discard what follows it, which is the
# expected fail-stop for a corrupted single copy and is reported, not failed.
# Generated by `seedbox-jepsen gen`: keel-s3dd, one server, --io-backend poll --object-placement log.
name: keel-corrupt-writes
machines:
  s3:
    # run-s3dd.sh restarts keel-s3dd whenever it exits, as a supervisor would.
    image: localhost/seedbox-jepsen/keel-s3dd:current
    entrypoint: ["/bin/sh", "/run-s3dd.sh"]
    command: ["--listen", "0.0.0.0:9000", "--data-dir", "/data", "--access-key", "jepsen", "--secret-key", "jepsen-secret", "--region", "us-east-1", "--io-backend", "poll", "--object-placement", "log", "--store-segments", "64", "--watchdog-wedge-ms", "12000"]
    memoryMiB: 512
    files:
    - source: run-s3dd.sh
      target: /run-s3dd.sh
    volumes:
      data:
        target: /data
        size: 3GiB
    expectedCrashes:
    - signal: SIGABRT
      command: "keel-watchdog"
oracle:
  build:
    context: ../../..
    dockerfile: crates/seedbox-jepsen/guest.Dockerfile
  entrypoint: ["/jepsen/seedbox-jepsen", "keel-s3", "--nodes", "s3", "--size", "4096", "--reboot-before-check", "--integrity-only", "--duration", "60"]
  memoryMiB: 1024
network:
  latency: 1ms
