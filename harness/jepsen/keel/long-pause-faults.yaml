# Process pauses in the long band, 2.2-6 s: past keel-s3dd's default 2 s watchdog
# bound, so keel-s3dd may abort by design (KEEL-EMERGENCY envelope wedged) when a
# pause lands mid-tick, and comes back through its restart wrapper; the data and
# recovery checks decide the verdict. With --watchdog-wedge-ms 10000 (the
# *-wedge10s scenarios) the same pauses must not crash it.
#
# Generic faults for one keel-s3dd server, aimed at nothing in particular:
# power loss (the volume is kept; page cache and unflushed sectors are lost),
# process pauses (SIGSTOP), partitions from the clients, slow disk requests and
# scheduling perturbation. run-s3dd.sh restarts keel-s3dd if it exits, and a
# rebooted server starts it again by itself. The oracle's writes run 60 s.
start: 15s
end: 70s
interval: 3s
faults:
  - kind: crash
    weight: 2
    downtime: {min: 1s, max: 5s}
  - kind: pause_process
    weight: 2
    duration: {min: 2200ms, max: 6s}
  - kind: partition
    weight: 2
    duration: {min: 1s, max: 8s}
  - kind: disk_latency
    weight: 1
    duration: {min: 2s, max: 8s}
    latency: {min: 5ms, max: 100ms}
    jitter: 50ms
  - kind: preempt
    weight: 1
    duration: {min: 2s, max: 8s}
    ppm: 20000
