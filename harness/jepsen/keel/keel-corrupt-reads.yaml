# keel-objects under silent corruption of data reads: run it with
# `--fault-profile harness/jepsen/keel/corruption-faults.yaml`. The disk keeps the right
# bytes, so no acknowledged object may be lost and no read may return other bytes. A
# read that fails its checksum fails that request; one during recovery makes
# keel-s3dd exit (3) rather than truncate its log, and run-s3dd.sh restarts it. With
# buffered I/O a corrupted read can leave a bad page cached, so the server is
# power-cycled once the faults end (a fail-stop operator's restart), and every
# acknowledged object must then read back intact.
# Generated by `seedbox-jepsen gen`: keel-s3dd, one server, --io-backend poll --object-placement log.
name: keel-corrupt-reads
machines:
  s3:
    # run-s3dd.sh restarts keel-s3dd whenever it exits, as a supervisor would.
    image: localhost/seedbox-jepsen/keel-s3dd:current
    entrypoint: ["/bin/sh", "/run-s3dd.sh"]
    command: ["--listen", "0.0.0.0:9000", "--data-dir", "/data", "--access-key", "jepsen", "--secret-key", "jepsen-secret", "--region", "us-east-1", "--io-backend", "poll", "--object-placement", "log", "--store-segments", "64", "--watchdog-wedge-ms", "12000"]
    memoryMiB: 512
    files:
    - source: run-s3dd.sh
      target: /run-s3dd.sh
    volumes:
      data:
        target: /data
        size: 3GiB
    expectedCrashes:
    - signal: SIGABRT
      command: "keel-watchdog"
oracle:
  build:
    context: ../../..
    dockerfile: crates/seedbox-jepsen/guest.Dockerfile
  entrypoint: ["/jepsen/seedbox-jepsen", "keel-s3", "--nodes", "s3", "--size", "4096", "--reboot-before-check", "--duration", "60"]
  memoryMiB: 1024
network:
  latency: 1ms
