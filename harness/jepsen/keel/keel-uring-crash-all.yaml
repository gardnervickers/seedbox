# keel-uring-objects under power loss: the server fails about every 15 s (7.5-22.5 s)
# and boots 2 s later, its volume kept (page cache and unflushed sectors are lost). An
# object acknowledged before a power failure must survive it intact.
# Generated by `seedbox-jepsen gen`: keel-s3dd, one server, --io-backend uring --object-placement log.
name: keel-uring-crash-all
machines:
  s3:
    # run-s3dd.sh restarts keel-s3dd whenever it exits, as a supervisor would.
    image: localhost/seedbox-jepsen/keel-s3dd:current
    entrypoint: ["/bin/sh", "/run-s3dd.sh"]
    command: ["--listen", "0.0.0.0:9000", "--data-dir", "/data", "--access-key", "jepsen", "--secret-key", "jepsen-secret", "--region", "us-east-1", "--io-backend", "uring", "--object-placement", "log", "--store-segments", "64", "--watchdog-wedge-ms", "12000"]
    memoryMiB: 512
    files:
    - source: run-s3dd.sh
      target: /run-s3dd.sh
    volumes:
      data:
        target: /data
        size: 3GiB
oracle:
  build:
    context: ../../..
    dockerfile: crates/seedbox-jepsen/guest.Dockerfile
  entrypoint: ["/jepsen/seedbox-jepsen", "keel-s3", "--nodes", "s3", "--size", "4096", "--crash-all-every", "15", "--duration", "60"]
  memoryMiB: 1024
network:
  latency: 1ms
