# keel-uring-register under the same power loss: no acknowledged write or
# compare-and-set may be lost, and every key's history must stay linearizable.
# Generated by `seedbox-jepsen gen`: keel-s3dd, one server, --io-backend uring --object-placement log.
name: keel-uring-crash-all-register
machines:
  s3:
    # run-s3dd.sh restarts keel-s3dd whenever it exits, as a supervisor would.
    image: localhost/seedbox-jepsen/keel-s3dd:current
    entrypoint: ["/bin/sh", "/run-s3dd.sh"]
    command: ["--listen", "0.0.0.0:9000", "--data-dir", "/data", "--access-key", "jepsen", "--secret-key", "jepsen-secret", "--region", "us-east-1", "--io-backend", "uring", "--object-placement", "log", "--store-segments", "32"]
    memoryMiB: 512
    files:
    - source: run-s3dd.sh
      target: /run-s3dd.sh
    volumes:
      data:
        target: /data
        size: 2GiB
oracle:
  build:
    context: ../../..
    dockerfile: crates/seedbox-jepsen/guest.Dockerfile
  entrypoint: ["/jepsen/seedbox-jepsen", "keel-s3", "--nodes", "s3", "--duration", "60", "--workload", "cas-register", "--size", "1024", "--keys", "4", "--crash-all-every", "15"]
  memoryMiB: 1024
network:
  latency: 1ms
