# keel-objects under failed disk requests: run it with
# `--fault-profile harness/jepsen/keel/eio-data-faults.yaml`. keel-s3dd wedges for good on
# a failed write or sync (fail-stop by design), so the server is power-cycled once the
# faults end and must then come back with every acknowledged object: a write whose sync
# failed must never have been acknowledged.
# Generated by `seedbox-jepsen gen`: keel-s3dd, one server, --io-backend poll --object-placement log.
name: keel-eio
machines:
  s3:
    # run-s3dd.sh restarts keel-s3dd whenever it exits, as a supervisor would.
    image: localhost/seedbox-jepsen/keel-s3dd:current
    entrypoint: ["/bin/sh", "/run-s3dd.sh"]
    command: ["--listen", "0.0.0.0:9000", "--data-dir", "/data", "--access-key", "jepsen", "--secret-key", "jepsen-secret", "--region", "us-east-1", "--io-backend", "poll", "--object-placement", "log", "--store-segments", "32"]
    memoryMiB: 512
    files:
    - source: run-s3dd.sh
      target: /run-s3dd.sh
    volumes:
      data:
        target: /data
        size: 2GiB
oracle:
  build:
    context: ../../..
    dockerfile: crates/seedbox-jepsen/guest.Dockerfile
  entrypoint: ["/jepsen/seedbox-jepsen", "keel-s3", "--nodes", "s3", "--duration", "60", "--size", "4096", "--reboot-before-check"]
  memoryMiB: 1024
network:
  latency: 1ms
