# Baseline: Jepsen's transactional queue workload on Kafka 3.8.0, no faults.
# Generated by `seedbox-jepsen gen`: Kafka 3.8.0 brokers, 3.8.0 client, 1 broker(s), workload txn, nemesis none.
name: kafka-healthy
machines:
  n1:
    build:
      context: image
      dockerfile: kafka-3.8.0.Dockerfile
    environment:
      KAFKA_NODE_ID: "1"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_VOTERS: "1@n1:9093"
      KAFKA_RF: "1"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
      KAFKA_JVM_PERFORMANCE_OPTS: "-server -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:CICompilerCount=1 -XX:-UsePerfData -Djava.awt.headless=true"
    memoryMiB: 2048
    cpu:
      speed: 4GHz
    volumes:
      data:
        target: /data
  c1:
    build:
      context: image
      dockerfile: client-3.8.0.Dockerfile
    command: ["--name", "c1", "--bootstrap", "n1:9092", "--rf", "1", "--mode", "txn", "--txn-timeout-ms", "1000"]
    memoryMiB: 1024
    cpu:
      speed: 4GHz
oracle:
  build:
    context: ../../..
    dockerfile: crates/seedbox-jepsen/guest.Dockerfile
  entrypoint: ["/jepsen/seedbox-jepsen", "kafka", "--workload", "txn", "--nemesis", "none", "--brokers", "n1", "--duration", "30"]
  memoryMiB: 256
network:
  latency: 1ms
