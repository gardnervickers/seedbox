# acks=all without fsync: an idempotent acks=all producer writes to a topic with
# replication factor 3 and min.insync.replicas 2; after 1000 acknowledgements every
# broker machine loses power at once, then all reboot. Kafka's default flush settings
# leave acknowledged records in the page cache, so they are lost.
# Generated by gen.py: Kafka 3.8.0, 3 broker(s), workload produce, nemesis crash-all.
name: kafka-crash-all
machines:
  n1:
    build:
      context: image
      dockerfile: kafka-3.8.0.Dockerfile
    environment:
      KAFKA_NODE_ID: "1"
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_VOTERS: "1@n1:9093,2@n2:9093,3@n3:9093"
      KAFKA_RF: "3"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
      KAFKA_JVM_PERFORMANCE_OPTS: "-server -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:CICompilerCount=1 -XX:-UsePerfData -Djava.awt.headless=true"
    volumes:
      data:
        target: /data
    memoryMiB: 2048
    cpu:
      speed: 4GHz
  n2:
