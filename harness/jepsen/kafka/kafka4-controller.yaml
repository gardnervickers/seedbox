# Controller-targeted faults on Kafka 4.3.1 with a separate KRaft quorum (k1..k3) and three
# brokers: every 4 s (2-6 s) crash, kill, pause or isolate the active controller for
# 2-8 s (a quarter of the time another controller; a fifth of the time power-fail it and a
# second controller, losing the quorum), during the queue workload.
# Generated by `seedbox-jepsen gen`: Kafka 4.3.1 brokers and client, 3 controllers and 3 brokers, workload queue, nemesis controller.
name: kafka4-controller
machines:
  k1:
    build:
      context: image
      dockerfile: kafka-4.3.1-lean.Dockerfile
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_HOST: "k1"
      KAFKA_ROLES: "controller"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_VOTERS: "1@k1:9093,2@k2:9093,3@k3:9093"
      KAFKA_RF: "3"
      KAFKA_SUPERVISE: "1"
      KAFKA_HEAP_OPTS: "-Xms160m -Xmx160m"
      KAFKA_JVM_PERFORMANCE_OPTS: "-server -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:CICompilerCount=1 -XX:-UsePerfData -Djava.awt.headless=true"
      SEEDBOX_EXTRA_PROPERTIES: "log.cleaner.dedupe.buffer.size=8388608;group.consumer.session.timeout.ms=10000;group.consumer.min.session.timeout.ms=6000;group.consumer.heartbeat.interval.ms=1000;group.consumer.min.heartbeat.interval.ms=1000"
    memoryMiB: 1024
    cpu:
      speed: 4GHz
    volumes:
      data:
