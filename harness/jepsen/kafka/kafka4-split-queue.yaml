# The queue workload on Kafka 4.3.1 with a separate KRaft quorum (k1..k3) and three brokers,
# for fault profiles aimed at the controllers: run it with
# `harness/jepsen/kafka/controller-faults.yaml`.
# Generated by `seedbox-jepsen gen`: Kafka 4.3.1 brokers and client, 3 controllers and 3 brokers, workload queue, nemesis none.
name: kafka4-split-queue
machines:
  k1:
    build:
      context: image
      dockerfile: kafka-4.3.1-lean.Dockerfile
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_HOST: "k1"
      KAFKA_ROLES: "controller"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_VOTERS: "1@k1:9093,2@k2:9093,3@k3:9093"
      KAFKA_RF: "3"
      KAFKA_SUPERVISE: "1"
      KAFKA_HEAP_OPTS: "-Xms160m -Xmx160m"
      KAFKA_JVM_PERFORMANCE_OPTS: "-server -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:CICompilerCount=1 -XX:-UsePerfData -Djava.awt.headless=true"
      SEEDBOX_EXTRA_PROPERTIES: "log.cleaner.dedupe.buffer.size=8388608;group.consumer.session.timeout.ms=10000;group.consumer.min.session.timeout.ms=6000;group.consumer.heartbeat.interval.ms=1000;group.consumer.min.heartbeat.interval.ms=1000"
    memoryMiB: 1024
    cpu:
      speed: 4GHz
    volumes:
      data:
        target: /data
  k2:
