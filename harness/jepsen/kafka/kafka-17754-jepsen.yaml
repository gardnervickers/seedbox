# Jepsen's untargeted nemesis on Kafka 3.8.0: every 10 s, pause a broker's process or cut
# c1 off from a broker for 2-10 s.
# Generated by `seedbox-jepsen gen`: Kafka 3.8.0, 3 broker(s), workload txn, nemesis jepsen.
name: kafka-17754-jepsen
machines:
  n1:
    build:
      context: image
      dockerfile: kafka-3.8.0.Dockerfile
    environment:
      KAFKA_NODE_ID: "1"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_VOTERS: "1@n1:9093,2@n2:9093,3@n3:9093"
      KAFKA_RF: "3"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
      KAFKA_JVM_PERFORMANCE_OPTS: "-server -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:CICompilerCount=1 -XX:-UsePerfData -Djava.awt.headless=true"
    memoryMiB: 2048
    cpu:
      speed: 4GHz
    volumes:
      data:
        target: /data
  n2:
    build:
      context: image
      dockerfile: kafka-3.8.0.Dockerfile
    environment:
      KAFKA_NODE_ID: "2"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_VOTERS: "1@n1:9093,2@n2:9093,3@n3:9093"
      KAFKA_RF: "3"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
      KAFKA_JVM_PERFORMANCE_OPTS: "-server -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:CICompilerCount=1 -XX:-UsePerfData -Djava.awt.headless=true"
    memoryMiB: 2048
    cpu:
      speed: 4GHz
    volumes:
      data:
        target: /data
  n3:
    build:
      context: image
      dockerfile: kafka-3.8.0.Dockerfile
    environment:
      KAFKA_NODE_ID: "3"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_VOTERS: "1@n1:9093,2@n2:9093,3@n3:9093"
      KAFKA_RF: "3"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
      KAFKA_JVM_PERFORMANCE_OPTS: "-server -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:CICompilerCount=1 -XX:-UsePerfData -Djava.awt.headless=true"
    memoryMiB: 2048
    cpu:
      speed: 4GHz
    volumes:
      data:
        target: /data
  c1:
    build:
      context: image
      dockerfile: client-3.8.0.Dockerfile
    command: ["--name", "c1", "--bootstrap", "n1:9092,n2:9092,n3:9092", "--rf", "3", "--mode", "txn", "--txn-timeout-ms", "1000"]
    memoryMiB: 1024
    cpu:
      speed: 4GHz
oracle:
  build:
    context: ../../..
    dockerfile: crates/seedbox-jepsen/guest.Dockerfile
  entrypoint: ["/jepsen/seedbox-jepsen", "kafka", "--workload", "txn", "--nemesis", "jepsen", "--brokers", "n1,n2,n3", "--duration", "90"]
  memoryMiB: 256
network:
  latency: 1ms
