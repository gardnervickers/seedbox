# KAFKA-17754 (a delayed EndTxn decides a later transaction): when the client prints
# its marker just before commitTransaction/abortTransaction, cut c1 off from the brokers
# for 3.5-5.5 s. The client times out the EndTxn, retries it on a new connection after
# the heal and moves on; the first copy, still queued in c1's TCP stack, is retransmitted
# later and commits or aborts whatever transaction the producer has open then.
# Kafka 3.8.0, one broker, Jepsen's transaction.timeout.ms of 1 s: a cut that spans the
# coordinator's 10 s timeout check aborts the transaction with an epoch bump, which fences
# the delayed EndTxn.
# Generated by `seedbox-jepsen gen`: Kafka 3.8.0 brokers, 3.8.0 client, 1 broker(s), workload txn, nemesis end-partition.
name: kafka-17754-end-partition-t1s
machines:
  n1:
    build:
      context: image
      dockerfile: kafka-3.8.0.Dockerfile
    environment:
      KAFKA_NODE_ID: "1"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_VOTERS: "1@n1:9093"
      KAFKA_RF: "1"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
      KAFKA_JVM_PERFORMANCE_OPTS: "-server -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:CICompilerCount=1 -XX:-UsePerfData -Djava.awt.headless=true"
    memoryMiB: 2048
    cpu:
      speed: 4GHz
    volumes:
      data:
        target: /data
  c1:
    build:
      context: image
      dockerfile: client-3.8.0.Dockerfile
    command: ["--name", "c1", "--bootstrap", "n1:9092", "--rf", "1", "--mode", "txn", "--txn-timeout-ms", "1000"]
    memoryMiB: 1024
    cpu:
      speed: 4GHz
oracle:
  build:
    context: ../../..
    dockerfile: crates/seedbox-jepsen/guest.Dockerfile
  entrypoint: ["/jepsen/seedbox-jepsen", "kafka", "--workload", "txn", "--nemesis", "end-partition", "--brokers", "n1", "--duration", "60"]
  memoryMiB: 256
network:
  latency: 1ms
