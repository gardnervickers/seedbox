# Coordinated power loss on Kafka 4.3.1 with the default flush settings: during the queue
# workload every node fails together about every 15 s (7.5-22.5 s) and reboots 2 s later. Kafka
# acknowledges acks=all writes once the in-sync replicas have them in memory and leaves
# flushing to the OS, so losing acknowledged records here is documented behaviour; the
# flush control is kafka4-crash-all-flush.
# Generated by `seedbox-jepsen gen`: Kafka 4.3.1 brokers and client, 3 combined broker+controller nodes, workload queue, nemesis crash-all.
name: kafka4-crash-all
machines:
  n1:
    build:
      context: image
      dockerfile: kafka-4.3.1-lean.Dockerfile
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_HOST: "n1"
      KAFKA_ROLES: "broker,controller"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_VOTERS: "1@n1:9093,2@n2:9093,3@n3:9093"
      KAFKA_RF: "3"
      KAFKA_SUPERVISE: "1"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
      KAFKA_JVM_PERFORMANCE_OPTS: "-server -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:CICompilerCount=1 -XX:-UsePerfData -Djava.awt.headless=true"
      SEEDBOX_EXTRA_PROPERTIES: "log.cleaner.dedupe.buffer.size=8388608;group.consumer.session.timeout.ms=10000;group.consumer.min.session.timeout.ms=6000;group.consumer.heartbeat.interval.ms=1000;group.consumer.min.heartbeat.interval.ms=1000"
    memoryMiB: 1536
    cpu:
      speed: 4GHz
    volumes:
      data:
        target: /data
  n2:
    build:
      context: image
      dockerfile: kafka-4.3.1-lean.Dockerfile
    environment:
      KAFKA_NODE_ID: "2"
      KAFKA_HOST: "n2"
      KAFKA_ROLES: "broker,controller"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_VOTERS: "1@n1:9093,2@n2:9093,3@n3:9093"
      KAFKA_RF: "3"
      KAFKA_SUPERVISE: "1"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
      KAFKA_JVM_PERFORMANCE_OPTS: "-server -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:CICompilerCount=1 -XX:-UsePerfData -Djava.awt.headless=true"
      SEEDBOX_EXTRA_PROPERTIES: "log.cleaner.dedupe.buffer.size=8388608;group.consumer.session.timeout.ms=10000;group.consumer.min.session.timeout.ms=6000;group.consumer.heartbeat.interval.ms=1000;group.consumer.min.heartbeat.interval.ms=1000"
    memoryMiB: 1536
    cpu:
      speed: 4GHz
    volumes:
      data:
        target: /data
  n3:
    build:
      context: image
      dockerfile: kafka-4.3.1-lean.Dockerfile
    environment:
      KAFKA_NODE_ID: "3"
      KAFKA_HOST: "n3"
      KAFKA_ROLES: "broker,controller"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_VOTERS: "1@n1:9093,2@n2:9093,3@n3:9093"
      KAFKA_RF: "3"
      KAFKA_SUPERVISE: "1"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
      KAFKA_JVM_PERFORMANCE_OPTS: "-server -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:CICompilerCount=1 -XX:-UsePerfData -Djava.awt.headless=true"
      SEEDBOX_EXTRA_PROPERTIES: "log.cleaner.dedupe.buffer.size=8388608;group.consumer.session.timeout.ms=10000;group.consumer.min.session.timeout.ms=6000;group.consumer.heartbeat.interval.ms=1000;group.consumer.min.heartbeat.interval.ms=1000"
    memoryMiB: 1536
    cpu:
      speed: 4GHz
    volumes:
      data:
        target: /data
  c1:
    build:
      context: image
      dockerfile: client-4.3.1.Dockerfile
    command: ["--name", "c1", "--bootstrap", "n1:9092,n2:9092,n3:9092", "--rf", "3", "--mode", "queue", "--txn-timeout-ms", "10000", "--consumers", "2", "--group-protocol", "consumer"]
    memoryMiB: 1024
    cpu:
      speed: 4GHz
oracle:
  build:
    context: ../../..
    dockerfile: crates/seedbox-jepsen/guest.Dockerfile
  entrypoint: ["/jepsen/seedbox-jepsen", "kafka", "--workload", "queue", "--nemesis", "crash-all", "--brokers", "n1,n2,n3", "--duration", "45", "--recover", "120", "--crash-all-every", "15"]
  memoryMiB: 512
network:
  latency: 1ms
