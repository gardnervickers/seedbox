# Negative control for KAFKA-17754: the end-partition schedule on Kafka 4.3.1 brokers and
# client, with transaction.version 2 (KIP-890 part 2: every transaction bumps the producer
# epoch, so a delayed EndTxn carries a stale epoch and is fenced).
# Generated by gen.py: Kafka 4.3.1, 1 broker(s), workload txn, nemesis end-partition.
name: kafka-17754-control-v431-end-partition
machines:
  n1:
    build:
      context: image
      dockerfile: kafka-4.3.1.Dockerfile
    environment:
      KAFKA_NODE_ID: "1"
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_VOTERS: "1@n1:9093"
      KAFKA_RF: "1"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
      KAFKA_JVM_PERFORMANCE_OPTS: "-server -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:CICompilerCount=1 -XX:-UsePerfData -Djava.awt.headless=true"
    volumes:
      data:
        target: /data
    memoryMiB: 2048
    cpu:
      speed: 4GHz
  c1:
    build:
      context: image
      dockerfile: client-4.3.1.Dockerfile
    command: ["--name", "c1", "--bootstrap", "n1:9092", "--rf", "1", "--mode", "txn", "--txn-timeout-ms", "60000"]
    memoryMiB: 1024
    cpu:
      speed: 4GHz
oracle:
  image: docker.io/library/python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
  entrypoint:
  - python3
  - -u
  - /scenario/kafka_jepsen.py
  - "--workload"
  - "txn"
  - "--nemesis"
  - "end-partition"
  - "--brokers"
  - "n1"
  - "--duration"
  - "60"
  memoryMiB: 512
  files:
  - source: kafka_jepsen.py
    target: /scenario/kafka_jepsen.py
  - source: ../elle/list_append.py
    target: /scenario/elle/list_append.py
  - source: ../../../python/seedbox/__init__.py
    target: /scenario/seedbox/__init__.py
  - source: ../../../python/seedbox/control.py
    target: /scenario/seedbox/control.py
network:
  latency: 1ms
