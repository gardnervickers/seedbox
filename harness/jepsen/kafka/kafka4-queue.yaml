# Jepsen's queue workload on Kafka 4.3.1 for unknown bugs: kafka4-healthy-queue for 45 s.
# Run it with a fault profile: `harness/jepsen/kafka/generic-faults.yaml` (power loss,
# process pauses, partitions), `corruption-faults.yaml` (bit flips in n1's data reads and
# writes) or `eio-data-faults.yaml` (failed data reads and writes). Every acknowledged
# record must be in the final read once, consumers must poll each partition in order
# without gaps, every record below the group's committed offset must have been delivered,
# and every broker must serve the topic again within 120 s of the faults ending.
# Generated by `seedbox-jepsen gen`: Kafka 4.3.1 brokers and client, 3 combined broker+controller nodes, workload queue, nemesis none.
name: kafka4-queue
machines:
  n1:
    build:
      context: image
      dockerfile: kafka-4.3.1-lean.Dockerfile
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_HOST: "n1"
      KAFKA_ROLES: "broker,controller"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_VOTERS: "1@n1:9093,2@n2:9093,3@n3:9093"
      KAFKA_RF: "3"
      KAFKA_SUPERVISE: "1"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
      KAFKA_JVM_PERFORMANCE_OPTS: "-server -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:CICompilerCount=1 -XX:-UsePerfData -Djava.awt.headless=true"
      SEEDBOX_EXTRA_PROPERTIES: "log.cleaner.dedupe.buffer.size=8388608;group.consumer.session.timeout.ms=10000;group.consumer.min.session.timeout.ms=6000;group.consumer.heartbeat.interval.ms=1000;group.consumer.min.heartbeat.interval.ms=1000"
    memoryMiB: 1536
    cpu:
      speed: 4GHz
    volumes:
      data:
        target: /data
  n2:
    build:
      context: image
      dockerfile: kafka-4.3.1-lean.Dockerfile
    environment:
      KAFKA_NODE_ID: "2"
      KAFKA_HOST: "n2"
      KAFKA_ROLES: "broker,controller"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_VOTERS: "1@n1:9093,2@n2:9093,3@n3:9093"
      KAFKA_RF: "3"
      KAFKA_SUPERVISE: "1"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
      KAFKA_JVM_PERFORMANCE_OPTS: "-server -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:CICompilerCount=1 -XX:-UsePerfData -Djava.awt.headless=true"
      SEEDBOX_EXTRA_PROPERTIES: "log.cleaner.dedupe.buffer.size=8388608;group.consumer.session.timeout.ms=10000;group.consumer.min.session.timeout.ms=6000;group.consumer.heartbeat.interval.ms=1000;group.consumer.min.heartbeat.interval.ms=1000"
    memoryMiB: 1536
    cpu:
      speed: 4GHz
    volumes:
      data:
        target: /data
  n3:
    build:
      context: image
      dockerfile: kafka-4.3.1-lean.Dockerfile
    environment:
      KAFKA_NODE_ID: "3"
      KAFKA_HOST: "n3"
      KAFKA_ROLES: "broker,controller"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_VOTERS: "1@n1:9093,2@n2:9093,3@n3:9093"
      KAFKA_RF: "3"
      KAFKA_SUPERVISE: "1"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
      KAFKA_JVM_PERFORMANCE_OPTS: "-server -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:CICompilerCount=1 -XX:-UsePerfData -Djava.awt.headless=true"
      SEEDBOX_EXTRA_PROPERTIES: "log.cleaner.dedupe.buffer.size=8388608;group.consumer.session.timeout.ms=10000;group.consumer.min.session.timeout.ms=6000;group.consumer.heartbeat.interval.ms=1000;group.consumer.min.heartbeat.interval.ms=1000"
    memoryMiB: 1536
    cpu:
      speed: 4GHz
    volumes:
      data:
        target: /data
  c1:
    build:
      context: image
      dockerfile: client-4.3.1.Dockerfile
    command: ["--name", "c1", "--bootstrap", "n1:9092,n2:9092,n3:9092", "--rf", "3", "--mode", "queue", "--txn-timeout-ms", "10000", "--consumers", "2", "--group-protocol", "consumer"]
    memoryMiB: 1024
    cpu:
      speed: 4GHz
oracle:
  build:
    context: ../../..
    dockerfile: crates/seedbox-jepsen/guest.Dockerfile
  entrypoint: ["/jepsen/seedbox-jepsen", "kafka", "--workload", "queue", "--nemesis", "none", "--brokers", "n1,n2,n3", "--duration", "45", "--recover", "120"]
  memoryMiB: 512
network:
  latency: 1ms
