# Use it with the -disk scenarios (etcd36-register-disk, etcd37-crash-all-disk, ...).
# generic-faults.yaml plus silent corruption of n1's data reads and writes
# (never the filesystem's metadata), in its WAL, snapshots and bbolt database.
# etcd checksums WAL records but not bbolt pages: corruption on one member must
# not reach clients or the other members' state unnoticed.
start: 15s
end: 200s
interval: 3s
faults:
  - kind: crash
    weight: 1
    downtime: {min: 1s, max: 6s}
  - kind: pause_process
    weight: 1
    duration: {min: 500ms, max: 6s}
  - kind: partition
    weight: 1
    duration: {min: 1s, max: 8s}
    from: [n1, n2, n3, n4, n5]
  - kind: disk_error
    weight: 3
    op: any
    ppm: 20000
    effect: corrupt
    scope: data
    duration: {min: 2s, max: 8s}
    targets: [n1]
