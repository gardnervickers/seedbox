# etcd 3.6.15 with Jepsen's list-append workload: ten clients run transactions
# of up to four reads and appends over eight keys at a time for 60 s, each a
# snapshot txn and then a txn guarded on the snapshot's mod revisions. The history
# must be serializable (Elle-style check), every member must serve reads again once
# faults end, and the members' HashKV must agree. Run it with `--fault-profile`.
# Generated by `seedbox-jepsen gen`: etcd 3.6.15, five members.
name: etcd36-append
machines:
  n1:
    image: gcr.io/etcd-development/etcd:v3.6.15@sha256:5ed4e32061aa061f970d6500629213e8579ef17571dcf9789074966acb9afad1
    entrypoint: ["/usr/local/bin/etcd"]
    command: ["--name=n1", "--data-dir=/var/lib/etcd/data", "--listen-client-urls=http://0.0.0.0:2379", "--advertise-client-urls=http://n1:2379", "--listen-peer-urls=http://0.0.0.0:2380", "--initial-advertise-peer-urls=http://n1:2380", "--initial-cluster=n1=http://n1:2380,n2=http://n2:2380,n3=http://n3:2380,n4=http://n4:2380,n5=http://n5:2380", "--initial-cluster-state=new", "--log-level=info"]
    workingDirectory: /var/lib/etcd
    memoryMiB: 512
    volumes:
      data:
        target: /var/lib/etcd
  n2:
