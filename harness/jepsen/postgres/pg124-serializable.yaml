# Negative control for pg123-serializable: 12.4 carries 5940ffb, so the same
# workload must commit no dependency cycle.
# Generated by `seedbox-jepsen gen`: PostgreSQL 12.4, serializable.
name: pg124-serializable
machines:
  pg:
    # pgmon.sh runs the official entrypoint and reports guest memory and OOM kills.
    # Log no ERROR (every serialization failure would be four lines); keep LOG, FATAL, PANIC.
    image: docker.io/library/postgres:12.4@sha256:a1e04460fdd3c338d6b65a2ab66b5aa2748eb18da3e55bcdc9ef17831ed3ad46
    entrypoint: ["bash", "/pgmon.sh"]
    command: ["postgres", "-c", "log_min_messages=log"]
    environment:
      POSTGRES_HOST_AUTH_METHOD: "trust"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    memoryMiB: 1024
    files:
    - source: pgmon.sh
      target: /pgmon.sh
    volumes:
      data:
        target: /var/lib/postgresql/data
oracle:
  build:
    context: ../../..
    dockerfile: crates/seedbox-jepsen/guest.Dockerfile
  entrypoint: ["/jepsen/seedbox-jepsen", "postgres", "--isolation", "serializable", "--clients", "20", "--duration", "60", "--label", "12.4/serializable"]
  memoryMiB: 256
network:
  latency: 1ms
