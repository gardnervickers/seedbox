# PostgreSQL 18.6 REPEATABLE READ is snapshot isolation: G2-item (write skew) is allowed,
# but nothing else snapshot isolation forbids, no lost append and no stale read.
# Generated by `seedbox-jepsen gen`: PostgreSQL 18.6, one server.
name: pg18-repeatable-read
machines:
  pg:
    # pgmon.sh runs the official entrypoint, reports guest memory and restarts postgres if it exits.
    # Log no ERROR (every serialization failure would be four lines); keep LOG, FATAL, PANIC.
    image: docker.io/library/postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    entrypoint: ["bash", "/pgmon.sh"]
    command: ["postgres", "-c", "log_min_messages=log"]
    environment:
      POSTGRES_HOST_AUTH_METHOD: "trust"
      PGMON_RESTART: "3"
    memoryMiB: 2048
    files:
    - source: pgmon.sh
      target: /pgmon.sh
    - source: pg-sync.sh
      target: /docker-entrypoint-initdb.d/pg-sync.sh
    volumes:
      data:
        target: /var/lib/postgresql
        size: 2GiB
oracle:
  build:
    context: ../../..
    dockerfile: crates/seedbox-jepsen/guest.Dockerfile
  entrypoint: ["/jepsen/seedbox-jepsen", "postgres", "--isolation", "repeatable-read", "--clients", "20", "--duration", "60", "--label", "18.6/repeatable-read"]
  memoryMiB: 256
network:
  latency: 1ms
