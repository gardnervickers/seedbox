# Negative control for pg123-serializable-15s on 12.4.
# Generated by gen.py: PostgreSQL 12.4, serializable.
name: pg124-serializable-15s
machines:
  pg:
    image: docker.io/library/postgres:12.4@sha256:a1e04460fdd3c338d6b65a2ab66b5aa2748eb18da3e55bcdc9ef17831ed3ad46
    memoryMiB: 1024
    # pgmon.sh runs the official entrypoint and reports guest memory and OOM kills.
    entrypoint: [bash, /pgmon.sh]
    # Log no ERROR (every serialization failure would be four lines); keep LOG, FATAL, PANIC.
    command: [postgres, -c, log_min_messages=log]
    files:
    - source: pgmon.sh
      target: /pgmon.sh
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
oracle:
  image: docker.io/library/python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
  entrypoint:
  - python3
  - -u
  - /scenario/pg_append.py
  - "--isolation"
  - "serializable"
  - "--clients"
  - "20"
  - "--duration"
  - "15"
  - "--label"
  - "12.4/serializable"
  memoryMiB: 1024
  files:
  - source: pg_append.py
    target: /scenario/pg_append.py
  - source: ../elle/list_append.py
    target: /scenario/list_append.py
network:
  latency: 1ms
