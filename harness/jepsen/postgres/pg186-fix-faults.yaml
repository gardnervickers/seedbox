# Control for the PostgreSQL 18.6 postmaster hang found by pg18-faults with eio-faults.yaml:
# the same scenario with the server binary rebuilt from 18.6 plus upstream commit
# 6a1759a02a (REL_18_STABLE), which makes the postmaster exit when a restarted
# startup process crashes during crash recovery instead of waiting forever.
# Generated by `seedbox-jepsen gen`: PostgreSQL 18.6 + 6a1759a02a, one server.
name: pg186-fix-faults
machines:
  pg:
    # pgmon.sh runs the official entrypoint, reports guest memory and restarts postgres if it exits.
    # Log no ERROR (every serialization failure would be four lines); keep LOG, FATAL, PANIC.
    build:
      context: pg186-fix
    entrypoint: ["bash", "/pgmon.sh"]
    command: ["postgres", "-c", "log_min_messages=log", "-c", "checkpoint_timeout=30s"]
    environment:
      POSTGRES_HOST_AUTH_METHOD: "trust"
      PGMON_RESTART: "3"
      PGMON_PS: "1"
      PGMON_WAL: "400"
    memoryMiB: 2048
    files:
    - source: pgmon.sh
      target: /pgmon.sh
    - source: pg-sync.sh
      target: /docker-entrypoint-initdb.d/pg-sync.sh
    volumes:
      data:
        target: /var/lib/postgresql
        size: 2GiB
oracle:
  build:
    context: ../../..
    dockerfile: crates/seedbox-jepsen/guest.Dockerfile
  entrypoint: ["/jepsen/seedbox-jepsen", "postgres", "--isolation", "serializable", "--clients", "20", "--duration", "90", "--label", "18.6+fix/faults", "--min-commit-rate", "0.05", "--recover", "90"]
  memoryMiB: 256
network:
  latency: 1ms
