# Diagnostic for a Seedbox issue: pg123-serializable-15s plus log_lock_waits=on and an idle
# probe machine that reports pg_stat_activity and pg_locks at 13, 16 and 19 s. In a
# stalled seed two backends deadlock at startup and no deadlock_timeout (SIGALRM) fires
# afterwards, so the deadlock is never broken.
# Generated by `seedbox-jepsen gen`: PostgreSQL 12.3, serializable, log_lock_waits.
name: pg123-stall-lockwaits
machines:
  pg:
    # pgmon.sh runs the official entrypoint and reports guest memory and OOM kills.
    # Log no ERROR (every serialization failure would be four lines); keep LOG, FATAL, PANIC.
    image: docker.io/library/postgres:12.3@sha256:a06e6e6e519b7a329c419f8221edec66cfc45511e8b80e262c12103ba745cf19
    entrypoint: ["bash", "/pgmon.sh"]
    command: ["postgres", "-c", "log_min_messages=log", "-c", "log_lock_waits=on"]
    environment:
      POSTGRES_HOST_AUTH_METHOD: "trust"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    memoryMiB: 1024
    files:
    - source: ../pgmon.sh
      target: /pgmon.sh
    volumes:
      data:
        target: /var/lib/postgresql/data
  probe:
    build:
      context: ../../../..
      dockerfile: crates/seedbox-jepsen/guest.Dockerfile
    entrypoint: ["/jepsen/seedbox-jepsen", "pg-probe", "--at", "13", "--at", "16", "--at", "19"]
    memoryMiB: 256
oracle:
  build:
    context: ../../../..
    dockerfile: crates/seedbox-jepsen/guest.Dockerfile
  entrypoint: ["/jepsen/seedbox-jepsen", "postgres", "--isolation", "serializable", "--clients", "20", "--duration", "15", "--label", "12.3/serializable"]
  memoryMiB: 256
network:
  latency: 1ms
