# PostgreSQL 18.6 primary (pg1) with a synchronous streaming standby (pg2,
# synchronous_standby_names='*', synchronous_commit=on, streaming delayed 50 ms): 30 s into 75 s of SERIALIZABLE
# list-append the primary is power-failed for good and the standby promoted
# (pg_promote), and every client moves to it. Every acknowledged commit must survive
# the promotion, and no read on the promoted standby may be stale.
# Generated by `seedbox-jepsen gen`: PostgreSQL 18.6, primary and synchronous standby.
name: pg18-failover-sync
machines:
  pg1:
    # pgmon.sh runs the official entrypoint, reports guest memory and restarts postgres if it exits.
    # Log no ERROR (every serialization failure would be four lines); keep LOG, FATAL, PANIC.
    image: docker.io/library/postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    entrypoint: ["bash", "/pgmon.sh"]
    command: ["postgres", "-c", "log_min_messages=log", "-c", "checkpoint_timeout=30s", "-c", "synchronous_standby_names=*"]
    environment:
      POSTGRES_HOST_AUTH_METHOD: "trust"
      PGMON_RESTART: "3"
    memoryMiB: 2048
    files:
    - source: pgmon.sh
      target: /pgmon.sh
    - source: pg-sync.sh
      target: /docker-entrypoint-initdb.d/pg-sync.sh
    - source: pg-replication.sh
      target: /docker-entrypoint-initdb.d/pg-replication.sh
    volumes:
      data:
        target: /var/lib/postgresql
        size: 2GiB
  pg2:
    # pg-standby.sh copies pg1 with pg_basebackup on first boot, then runs pgmon.sh.
    image: docker.io/library/postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    entrypoint: ["bash", "/pg-standby.sh"]
    command: ["postgres", "-c", "log_min_messages=log", "-c", "checkpoint_timeout=30s"]
    environment:
      POSTGRES_HOST_AUTH_METHOD: "trust"
      PGMON_RESTART: "3"
      PRIMARY: "pg1"
    memoryMiB: 2048
    files:
    - source: pgmon.sh
      target: /pgmon.sh
    - source: pg-sync.sh
      target: /docker-entrypoint-initdb.d/pg-sync.sh
    - source: pg-standby.sh
      target: /pg-standby.sh
    volumes:
      data:
        target: /var/lib/postgresql
        size: 2GiB
oracle:
  build:
    context: ../../..
    dockerfile: crates/seedbox-jepsen/guest.Dockerfile
  entrypoint: ["/jepsen/seedbox-jepsen", "postgres", "--isolation", "serializable", "--clients", "20", "--duration", "75", "--label", "pg18-failover-sync", "--host", "pg1", "--standby", "pg2", "--failover-at", "30", "--replication-delay-ms", "50", "--min-commit-rate", "0.1", "--expect-sync"]
  memoryMiB: 256
network:
  latency: 1ms
