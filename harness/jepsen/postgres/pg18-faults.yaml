# PostgreSQL 18.6, looking for unknown bugs under generated faults: 90 s of SERIALIZABLE
# list-append with checkpoints every 30 s. Run it with `--fault-profile` and one of
# harness/jepsen/postgres/*-faults.yaml (power loss, pauses, partitions, clock steps,
# data-scoped disk corruption or EIO). Acknowledged commits must survive and never read
# back wrong; errors and fail-stop are allowed, but the server must answer again within
# 90 s of the workload's end.
# Generated by `seedbox-jepsen gen`: PostgreSQL 18.6, one server.
name: pg18-faults
machines:
  pg:
    # pgmon.sh runs the official entrypoint, reports guest memory and restarts postgres if it exits.
    # Log no ERROR (every serialization failure would be four lines); keep LOG, FATAL, PANIC.
    image: docker.io/library/postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    entrypoint: ["bash", "/pgmon.sh"]
    command: ["postgres", "-c", "log_min_messages=log", "-c", "checkpoint_timeout=30s"]
    environment:
      POSTGRES_HOST_AUTH_METHOD: "trust"
      PGMON_RESTART: "3"
    memoryMiB: 2048
    files:
    - source: pgmon.sh
      target: /pgmon.sh
    - source: pg-sync.sh
      target: /docker-entrypoint-initdb.d/pg-sync.sh
    volumes:
      data:
        target: /var/lib/postgresql
        size: 2GiB
oracle:
  build:
    context: ../../..
    dockerfile: crates/seedbox-jepsen/guest.Dockerfile
  entrypoint: ["/jepsen/seedbox-jepsen", "postgres", "--isolation", "serializable", "--clients", "20", "--duration", "90", "--label", "18.6/faults", "--min-commit-rate", "0.05", "--recover", "90"]
  memoryMiB: 256
network:
  latency: 1ms
