# PostgreSQL 12.3 SERIALIZABLE allows G2-item (Jepsen, 2020-06-12): SSI misses an
# rw-conflict on a freshly inserted row that a third transaction is updating, so
# anti-dependency cycles commit. Fixed by 5940ffb in 12.4.
# Generated by `seedbox-jepsen gen`: PostgreSQL 12.3, serializable.
name: pg123-serializable
machines:
  pg:
    # pgmon.sh runs the official entrypoint and reports guest memory and OOM kills.
    # Log no ERROR (every serialization failure would be four lines); keep LOG, FATAL, PANIC.
    image: docker.io/library/postgres:12.3@sha256:a06e6e6e519b7a329c419f8221edec66cfc45511e8b80e262c12103ba745cf19
    entrypoint: ["bash", "/pgmon.sh"]
    command: ["postgres", "-c", "log_min_messages=log"]
    environment:
      POSTGRES_HOST_AUTH_METHOD: "trust"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    memoryMiB: 1024
    files:
    - source: pgmon.sh
      target: /pgmon.sh
    volumes:
      data:
        target: /var/lib/postgresql/data
oracle:
  build:
    context: ../../..
    dockerfile: crates/seedbox-jepsen/guest.Dockerfile
  entrypoint: ["/jepsen/seedbox-jepsen", "postgres", "--isolation", "serializable", "--clients", "20", "--duration", "60", "--label", "12.3/serializable"]
  memoryMiB: 256
network:
  latency: 1ms
