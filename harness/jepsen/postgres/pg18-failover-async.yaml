# Negative control for pg18-failover-sync: the standby is asynchronous, so the
# commits the primary acknowledges while the standby is frozen are expected to be
# lost when it fails over.
# Generated by `seedbox-jepsen gen`: PostgreSQL 18.6, primary and asynchronous standby.
name: pg18-failover-async
machines:
  pg1:
    # pgmon.sh runs the official entrypoint, reports guest memory and restarts postgres if it exits.
    # Log no ERROR (every serialization failure would be four lines); keep LOG, FATAL, PANIC.
    image: docker.io/library/postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    entrypoint: ["bash", "/pgmon.sh"]
    command: ["postgres", "-c", "log_min_messages=log", "-c", "checkpoint_timeout=30s"]
    environment:
      POSTGRES_HOST_AUTH_METHOD: "trust"
      PGMON_RESTART: "3"
      PGMON_PS: "1"
      PGMON_WAL: "400"
    memoryMiB: 2048
    files:
    - source: pgmon.sh
      target: /pgmon.sh
    - source: pg-sync.sh
      target: /docker-entrypoint-initdb.d/pg-sync.sh
    - source: pg-replication.sh
      target: /docker-entrypoint-initdb.d/pg-replication.sh
    volumes:
      data:
        target: /var/lib/postgresql
        size: 2GiB
  pg2:
    # pg-standby.sh copies pg1 with pg_basebackup on first boot, then runs pgmon.sh.
    image: docker.io/library/postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    entrypoint: ["bash", "/pg-standby.sh"]
    command: ["postgres", "-c", "log_min_messages=log", "-c", "checkpoint_timeout=30s"]
    environment:
      POSTGRES_HOST_AUTH_METHOD: "trust"
      PGMON_RESTART: "3"
      PGMON_PS: "1"
      PGMON_WAL: "400"
      PRIMARY: "pg1"
    memoryMiB: 2048
    files:
    - source: pgmon.sh
      target: /pgmon.sh
    - source: pg-sync.sh
      target: /docker-entrypoint-initdb.d/pg-sync.sh
    - source: pg-standby.sh
      target: /pg-standby.sh
    volumes:
      data:
        target: /var/lib/postgresql
        size: 2GiB
oracle:
  build:
    context: ../../..
    dockerfile: crates/seedbox-jepsen/guest.Dockerfile
  entrypoint: ["/jepsen/seedbox-jepsen", "postgres", "--isolation", "serializable", "--clients", "20", "--duration", "75", "--label", "pg18-failover-async", "--host", "pg1", "--standby", "pg2", "--failover-at", "30", "--replication-delay-ms", "50", "--standby-stall", "3", "--min-commit-rate", "0.1"]
  memoryMiB: 256
network:
  latency: 1ms
