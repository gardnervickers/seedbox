# pg123-serializable with a 15 s workload, to measure how often one seed reproduces
# the bug in a short window.
# Generated by gen.py: PostgreSQL 12.3, serializable.
name: pg123-serializable-15s
machines:
  pg:
    image: docker.io/library/postgres:12.3@sha256:a06e6e6e519b7a329c419f8221edec66cfc45511e8b80e262c12103ba745cf19
    memoryMiB: 1024
    # pgmon.sh runs the official entrypoint and reports guest memory and OOM kills.
    entrypoint: [bash, /pgmon.sh]
    # Log no ERROR (every serialization failure would be four lines); keep LOG, FATAL, PANIC.
    command: [postgres, -c, log_min_messages=log]
    files:
    - source: pgmon.sh
      target: /pgmon.sh
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
oracle:
  image: docker.io/library/python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
  entrypoint:
  - python3
  - -u
  - /scenario/pg_append.py
  - "--isolation"
  - "serializable"
  - "--clients"
  - "20"
  - "--duration"
  - "15"
  - "--label"
  - "12.3/serializable"
  memoryMiB: 1024
  files:
  - source: pg_append.py
    target: /scenario/pg_append.py
  - source: ../elle/list_append.py
    target: /scenario/list_append.py
network:
  latency: 1ms
