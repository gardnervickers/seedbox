# Jepsen's NATS server configuration (jepsen-io/nats resources/nats.conf),
# without authentication. SERVER_NAME comes from the machine's environment.
server_name: $SERVER_NAME
listen: 0.0.0.0:4222
http: 0.0.0.0:8222

jetstream {
  store_dir: /data/jetstream
  max_memory_store: 64MB
  max_file_store: 512MB
  # sync_interval omitted: NATS's default lazy fsync (every 2 minutes).
}

cluster {
  name: jepsen-cluster
  listen: 0.0.0.0:6222
  routes: [
    nats://n1:6222
    nats://n2:6222
    nats://n3:6222
    nats://n4:6222
    nats://n5:6222
  ]
  ping_interval: 5s
}
