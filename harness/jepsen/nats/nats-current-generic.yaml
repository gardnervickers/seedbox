# The current release (2.15.1) with `sync_interval: always`, looking for unknown bugs: the
# queue workload with no scripted nemesis for 60 s, checked for lost and divergent
# acknowledged messages. Run it with `--fault-profile harness/jepsen/nats/generic-faults.yaml`
# (power loss, process pauses, partitions). The default lazy fsync loses acknowledged
# messages by design (nats-server#7564), so this uses `always`.
# Generated by `seedbox-jepsen gen`: NATS 2.15.1, nats-always.conf.
