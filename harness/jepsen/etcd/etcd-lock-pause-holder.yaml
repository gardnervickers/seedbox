# etcd locks do not give mutual exclusion: pause the lock holder's client process
# (a GC pause) for 3 s, longer than the 2 s lease TTL, after it has read the set.
# Its lease expires, another client takes the lock, and the paused client resumes
# and writes its stale set: acknowledged updates are lost.
# Generated by `seedbox-jepsen gen`: etcd 3.4.3, mode pause-holder, guard none.
name: etcd-lock-pause-holder
