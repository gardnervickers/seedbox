# delores-kv-register with keel-s3dd's watchdog bound raised from 2 s to 10 s
# (--watchdog-wedge-ms 10000): the control for the long-pause profiles, whose 2.2-6 s
# process pauses must then crash nothing.
# Generated by `seedbox-jepsen gen`: delores docker-kv, three replicas, keel-s3dd (poll, log), --watchdog-wedge-ms 10000.
name: delores-kv-register-wedge10s
machines:
  s3:
    # run-s3dd.sh restarts keel-s3dd whenever it exits, as a supervisor would.
    image: localhost/seedbox-jepsen/keel-s3dd:current
    entrypoint: ["/bin/sh", "/run-s3dd.sh"]
    command: ["--listen", "0.0.0.0:9000", "--data-dir", "/data", "--access-key", "jepsen", "--secret-key", "jepsen-secret", "--region", "us-east-1", "--io-backend", "poll", "--object-placement", "log", "--store-segments", "32", "--watchdog-wedge-ms", "10000"]
    memoryMiB: 512
    files:
    - source: ../keel/run-s3dd.sh
      target: /run-s3dd.sh
    volumes:
      data:
        target: /data
        size: 2GiB
  sequencer:
    # The in-memory demo sequencer: never fault it (losing it is a liveness test).
    image: localhost/seedbox-jepsen/delores-docker-kv:current
    command: ["sequencer"]
    environment:
      RUST_LOG: "info"
      NO_COLOR: "1"
      S3_ENDPOINT: "http://s3:9000"
      S3_BUCKET: "delores"
      AWS_ACCESS_KEY_ID: "jepsen"
      AWS_SECRET_ACCESS_KEY: "jepsen-secret"
      AWS_REGION: "us-east-1"
      VIEW_REGISTER_KEY: "demo/view-register"
      LOG_PREFIX: "demo"
      LOG_WINDOW_SIZE: "32"
      SEQUENCER_ID: "main"
      SEQUENCER_ENDPOINT: "tcp://sequencer:7100"
      BIND: "0.0.0.0:7100"
    memoryMiB: 512
  n1:
    # start-replica.sh seeds the view register if no replica has yet, then serves.
    image: localhost/seedbox-jepsen/delores-docker-kv:current
    entrypoint: ["/bin/sh", "/start-replica.sh"]
    environment:
      RUST_LOG: "info"
      NO_COLOR: "1"
      S3_ENDPOINT: "http://s3:9000"
      S3_BUCKET: "delores"
      AWS_ACCESS_KEY_ID: "jepsen"
      AWS_SECRET_ACCESS_KEY: "jepsen-secret"
      AWS_REGION: "us-east-1"
      VIEW_REGISTER_KEY: "demo/view-register"
      LOG_PREFIX: "demo"
      LOG_WINDOW_SIZE: "32"
      SEQUENCER_ID: "main"
      SEQUENCER_ENDPOINT: "tcp://sequencer:7100"
      REPLICA_ID: "0"
      BIND: "0.0.0.0:7000"
    memoryMiB: 512
    files:
    - source: start-replica.sh
      target: /start-replica.sh
  n2:
    # start-replica.sh seeds the view register if no replica has yet, then serves.
    image: localhost/seedbox-jepsen/delores-docker-kv:current
    entrypoint: ["/bin/sh", "/start-replica.sh"]
    environment:
      RUST_LOG: "info"
      NO_COLOR: "1"
      S3_ENDPOINT: "http://s3:9000"
      S3_BUCKET: "delores"
      AWS_ACCESS_KEY_ID: "jepsen"
      AWS_SECRET_ACCESS_KEY: "jepsen-secret"
      AWS_REGION: "us-east-1"
      VIEW_REGISTER_KEY: "demo/view-register"
      LOG_PREFIX: "demo"
      LOG_WINDOW_SIZE: "32"
      SEQUENCER_ID: "main"
      SEQUENCER_ENDPOINT: "tcp://sequencer:7100"
      REPLICA_ID: "1"
      BIND: "0.0.0.0:7000"
    memoryMiB: 512
    files:
    - source: start-replica.sh
      target: /start-replica.sh
  n3:
    # start-replica.sh seeds the view register if no replica has yet, then serves.
    image: localhost/seedbox-jepsen/delores-docker-kv:current
    entrypoint: ["/bin/sh", "/start-replica.sh"]
    environment:
      RUST_LOG: "info"
      NO_COLOR: "1"
      S3_ENDPOINT: "http://s3:9000"
      S3_BUCKET: "delores"
      AWS_ACCESS_KEY_ID: "jepsen"
      AWS_SECRET_ACCESS_KEY: "jepsen-secret"
      AWS_REGION: "us-east-1"
      VIEW_REGISTER_KEY: "demo/view-register"
      LOG_PREFIX: "demo"
      LOG_WINDOW_SIZE: "32"
      SEQUENCER_ID: "main"
      SEQUENCER_ENDPOINT: "tcp://sequencer:7100"
      REPLICA_ID: "2"
      BIND: "0.0.0.0:7000"
    memoryMiB: 512
    files:
    - source: start-replica.sh
      target: /start-replica.sh
oracle:
  build:
    context: ../../..
    dockerfile: crates/seedbox-jepsen/guest.Dockerfile
  entrypoint: ["/jepsen/seedbox-jepsen", "delores"]
  memoryMiB: 1024
network:
  latency: 1ms
