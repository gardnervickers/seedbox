# delores-kv-register with the oracle cutting replicas off from the sequencer, which
# keeps running with its state (no kill): one replica, all three, or one replica from
# the sequencer and S3, for 1-4 s (under the 5 s sequencer timeout) or 10-30 s, with
# 12-20 s between cuts. Safety must hold throughout; the oracle reports how long
# recovery took after each heal, but since a cut can seal the log for good (see
# delores-kv-register), resumption is reported, not asserted.
# Generated by `seedbox-jepsen gen`: delores docker-kv, three replicas, keel-s3dd (poll, log).
name: delores-kv-seqcut
machines:
  s3:
    # run-s3dd.sh restarts keel-s3dd whenever it exits, as a supervisor would.
    image: localhost/seedbox-jepsen/keel-s3dd:current
    entrypoint: ["/bin/sh", "/run-s3dd.sh"]
    command: ["--listen", "0.0.0.0:9000", "--data-dir", "/data", "--access-key", "jepsen", "--secret-key", "jepsen-secret", "--region", "us-east-1", "--io-backend", "poll", "--object-placement", "log", "--store-segments", "64", "--watchdog-wedge-ms", "12000"]
    memoryMiB: 512
    files:
    - source: ../keel/run-s3dd.sh
      target: /run-s3dd.sh
    volumes:
      data:
        target: /data
        size: 3GiB
  sequencer:
    # The in-memory demo sequencer: never fault it (losing it is a liveness test).
    image: localhost/seedbox-jepsen/delores-docker-kv:current
    command: ["sequencer"]
    environment:
      RUST_LOG: "info"
      NO_COLOR: "1"
      S3_ENDPOINT: "http://s3:9000"
      S3_BUCKET: "delores"
      AWS_ACCESS_KEY_ID: "jepsen"
      AWS_SECRET_ACCESS_KEY: "jepsen-secret"
      AWS_REGION: "us-east-1"
      VIEW_REGISTER_KEY: "demo/view-register"
      LOG_PREFIX: "demo"
      LOG_WINDOW_SIZE: "32"
      SEQUENCER_ID: "main"
      SEQUENCER_ENDPOINT: "tcp://sequencer:7100"
      BIND: "0.0.0.0:7100"
    memoryMiB: 512
  n1:
    # start-replica.sh seeds the view register if no replica has yet, then serves.
    image: localhost/seedbox-jepsen/delores-docker-kv:current
    entrypoint: ["/bin/sh", "/start-replica.sh"]
    environment:
      RUST_LOG: "info"
      NO_COLOR: "1"
      S3_ENDPOINT: "http://s3:9000"
      S3_BUCKET: "delores"
      AWS_ACCESS_KEY_ID: "jepsen"
      AWS_SECRET_ACCESS_KEY: "jepsen-secret"
      AWS_REGION: "us-east-1"
      VIEW_REGISTER_KEY: "demo/view-register"
      LOG_PREFIX: "demo"
      LOG_WINDOW_SIZE: "32"
      SEQUENCER_ID: "main"
      SEQUENCER_ENDPOINT: "tcp://sequencer:7100"
      REPLICA_ID: "0"
      BIND: "0.0.0.0:7000"
    memoryMiB: 512
    files:
    - source: start-replica.sh
      target: /start-replica.sh
  n2:
    # start-replica.sh seeds the view register if no replica has yet, then serves.
    image: localhost/seedbox-jepsen/delores-docker-kv:current
    entrypoint: ["/bin/sh", "/start-replica.sh"]
    environment:
      RUST_LOG: "info"
      NO_COLOR: "1"
      S3_ENDPOINT: "http://s3:9000"
      S3_BUCKET: "delores"
      AWS_ACCESS_KEY_ID: "jepsen"
      AWS_SECRET_ACCESS_KEY: "jepsen-secret"
      AWS_REGION: "us-east-1"
      VIEW_REGISTER_KEY: "demo/view-register"
      LOG_PREFIX: "demo"
      LOG_WINDOW_SIZE: "32"
      SEQUENCER_ID: "main"
      SEQUENCER_ENDPOINT: "tcp://sequencer:7100"
      REPLICA_ID: "1"
      BIND: "0.0.0.0:7000"
    memoryMiB: 512
    files:
    - source: start-replica.sh
      target: /start-replica.sh
  n3:
    # start-replica.sh seeds the view register if no replica has yet, then serves.
    image: localhost/seedbox-jepsen/delores-docker-kv:current
    entrypoint: ["/bin/sh", "/start-replica.sh"]
    environment:
      RUST_LOG: "info"
      NO_COLOR: "1"
      S3_ENDPOINT: "http://s3:9000"
      S3_BUCKET: "delores"
      AWS_ACCESS_KEY_ID: "jepsen"
      AWS_SECRET_ACCESS_KEY: "jepsen-secret"
      AWS_REGION: "us-east-1"
      VIEW_REGISTER_KEY: "demo/view-register"
      LOG_PREFIX: "demo"
      LOG_WINDOW_SIZE: "32"
      SEQUENCER_ID: "main"
      SEQUENCER_ENDPOINT: "tcp://sequencer:7100"
      REPLICA_ID: "2"
      BIND: "0.0.0.0:7000"
    memoryMiB: 512
    files:
    - source: start-replica.sh
      target: /start-replica.sh
oracle:
  build:
    context: ../../..
    dockerfile: crates/seedbox-jepsen/guest.Dockerfile
  entrypoint: ["/jepsen/seedbox-jepsen", "delores", "--duration", "120", "--sequencer-cuts", "--expect-unavailable"]
  memoryMiB: 1024
network:
  latency: 1ms
