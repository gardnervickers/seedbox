# delores's examples/docker-kv over keel-s3dd instead of MinIO: three replicas share
# one virtual log through the S3 server, with slots from the in-memory demo sequencer.
# Six clients PUT, DELETE and GET five keys through random replicas for 120 s with no
# retries; then every replica reads every key. Each key's history must be
# linearizable and the replicas that answer must agree. docker-kv cannot reconfigure
# past a sealed log: an append with an unknown outcome seals it for good
# (delores-atomiclog abandon_after_indeterminate) and every replica, restarted or
# not, then answers Log(Sealed). So replicas that never answer again are reported,
# not failed (--expect-unavailable). A replica that hung for good after the S3 server
# lost power, on requests left in flight on half-open connections, was a docker-kv bug:
# its S3 client had no attempt or operation timeout (2y553dxr; fixed in delores 15c0f1a). Run it without a
# profile for a baseline, or with `--fault-profile harness/jepsen/delores/below-pause-faults.yaml`
# or `above-pause-faults.yaml`, which never fault the sequencer.
# Generated by `seedbox-jepsen gen`: delores docker-kv, three replicas, keel-s3dd (poll, log).
name: delores-kv-register
machines:
  s3:
    # run-s3dd.sh restarts keel-s3dd whenever it exits, as a supervisor would.
    image: localhost/seedbox-jepsen/keel-s3dd:current
    entrypoint: ["/bin/sh", "/run-s3dd.sh"]
    command: ["--listen", "0.0.0.0:9000", "--data-dir", "/data", "--access-key", "jepsen", "--secret-key", "jepsen-secret", "--region", "us-east-1", "--io-backend", "poll", "--object-placement", "log", "--store-segments", "64", "--watchdog-wedge-ms", "12000"]
    memoryMiB: 512
    files:
    - source: ../keel/run-s3dd.sh
      target: /run-s3dd.sh
    volumes:
      data:
        target: /data
        size: 3GiB
    expectedCrashes:
    - signal: SIGABRT
      command: "keel-watchdog"
  sequencer:
    # The in-memory demo sequencer: never fault it (losing it is a liveness test).
    image: localhost/seedbox-jepsen/delores-docker-kv:current
    command: ["sequencer"]
    environment:
      RUST_LOG: "info"
      NO_COLOR: "1"
      S3_ENDPOINT: "http://s3:9000"
      S3_BUCKET: "delores"
      AWS_ACCESS_KEY_ID: "jepsen"
      AWS_SECRET_ACCESS_KEY: "jepsen-secret"
      AWS_REGION: "us-east-1"
      VIEW_REGISTER_KEY: "demo/view-register"
      LOG_PREFIX: "demo"
      LOG_WINDOW_SIZE: "32"
      SEQUENCER_ID: "main"
      SEQUENCER_ENDPOINT: "tcp://sequencer:7100"
      BIND: "0.0.0.0:7100"
    memoryMiB: 512
  n1:
    # start-replica.sh seeds the view register if no replica has yet, then serves.
    image: localhost/seedbox-jepsen/delores-docker-kv:current
    entrypoint: ["/bin/sh", "/start-replica.sh"]
    environment:
      RUST_LOG: "info"
      NO_COLOR: "1"
      S3_ENDPOINT: "http://s3:9000"
      S3_BUCKET: "delores"
      AWS_ACCESS_KEY_ID: "jepsen"
      AWS_SECRET_ACCESS_KEY: "jepsen-secret"
      AWS_REGION: "us-east-1"
      VIEW_REGISTER_KEY: "demo/view-register"
      LOG_PREFIX: "demo"
      LOG_WINDOW_SIZE: "32"
      SEQUENCER_ID: "main"
      SEQUENCER_ENDPOINT: "tcp://sequencer:7100"
      REPLICA_ID: "0"
      BIND: "0.0.0.0:7000"
    memoryMiB: 512
    files:
    - source: start-replica.sh
      target: /start-replica.sh
  n2:
    # start-replica.sh seeds the view register if no replica has yet, then serves.
    image: localhost/seedbox-jepsen/delores-docker-kv:current
    entrypoint: ["/bin/sh", "/start-replica.sh"]
    environment:
      RUST_LOG: "info"
      NO_COLOR: "1"
      S3_ENDPOINT: "http://s3:9000"
      S3_BUCKET: "delores"
      AWS_ACCESS_KEY_ID: "jepsen"
      AWS_SECRET_ACCESS_KEY: "jepsen-secret"
      AWS_REGION: "us-east-1"
      VIEW_REGISTER_KEY: "demo/view-register"
      LOG_PREFIX: "demo"
      LOG_WINDOW_SIZE: "32"
      SEQUENCER_ID: "main"
      SEQUENCER_ENDPOINT: "tcp://sequencer:7100"
      REPLICA_ID: "1"
      BIND: "0.0.0.0:7000"
    memoryMiB: 512
    files:
    - source: start-replica.sh
      target: /start-replica.sh
  n3:
    # start-replica.sh seeds the view register if no replica has yet, then serves.
    image: localhost/seedbox-jepsen/delores-docker-kv:current
    entrypoint: ["/bin/sh", "/start-replica.sh"]
    environment:
      RUST_LOG: "info"
      NO_COLOR: "1"
      S3_ENDPOINT: "http://s3:9000"
      S3_BUCKET: "delores"
      AWS_ACCESS_KEY_ID: "jepsen"
      AWS_SECRET_ACCESS_KEY: "jepsen-secret"
      AWS_REGION: "us-east-1"
      VIEW_REGISTER_KEY: "demo/view-register"
      LOG_PREFIX: "demo"
      LOG_WINDOW_SIZE: "32"
      SEQUENCER_ID: "main"
      SEQUENCER_ENDPOINT: "tcp://sequencer:7100"
      REPLICA_ID: "2"
      BIND: "0.0.0.0:7000"
    memoryMiB: 512
    files:
    - source: start-replica.sh
      target: /start-replica.sh
oracle:
  build:
    context: ../../..
    dockerfile: crates/seedbox-jepsen/guest.Dockerfile
  entrypoint: ["/jepsen/seedbox-jepsen", "delores", "--duration", "120", "--expect-unavailable"]
  memoryMiB: 1024
network:
  latency: 1ms
