# Process pauses in the long band, 2.2-6 s: past keel-s3dd's default 2 s watchdog
# bound, so keel-s3dd may abort by design (KEEL-EMERGENCY envelope wedged) when a
# pause lands mid-tick, and comes back through its restart wrapper; the data and
# recovery checks decide the verdict. With --watchdog-wedge-ms 10000 (the
# *-wedge10s scenarios) the same pauses must not crash it.
#
# Faults for the delores-node scenarios, never touching the in-memory demo
# sequencer (rung 7, out of scope) and never wiping an S3 volume: one S3
# server isolated from every node, a node cut off from every S3 server,
# SIGKILL (restarted 1-6 s later, a fresh ballot incarnation) and SIGSTOP of a
# node, power loss of an S3 server (its volume kept) or a node, and wall-clock
# steps (CASPaxos takes no leases, so skew should change nothing). The
# oracle's operations run 60 s.
start: 15s
end: 70s
interval: 3s
targets: [n1, n2, n3, s3-a, s3-b, s3-c]
faults:
  - kind: partition
    weight: 2
    duration: {min: 1s, max: 8s}
    from: [n1, n2, n3]
  - kind: partition
    weight: 2
    duration: {min: 1s, max: 8s}
    from: [s3-a, s3-b, s3-c]
  - kind: stop
    weight: 2
    downtime: {min: 1s, max: 6s}
  - kind: pause_process
    weight: 2
    duration: {min: 2200ms, max: 6s}
  - kind: crash
    weight: 1
    downtime: {min: 1s, max: 5s}
  - kind: clock_skew
    weight: 1
    duration: {min: 3s, max: 15s}
    maxOffset: 30s
