# delores-node-append with keel-s3dd's watchdog bound raised from 2 s to 10 s
# (--watchdog-wedge-ms 10000): the control for the long-pause profiles, whose 2.2-6 s
# process pauses must then crash nothing.
# Generated by `seedbox-jepsen gen`: delores jepsen-node, three nodes, three keel-s3dd (poll, log), --watchdog-wedge-ms 10000.
name: delores-node-append-wedge10s
machines:
  s3-a:
    # run-s3dd.sh restarts keel-s3dd whenever it exits, as a supervisor would.
    image: localhost/seedbox-jepsen/keel-s3dd:current
    entrypoint: ["/bin/sh", "/run-s3dd.sh"]
    command: ["--listen", "0.0.0.0:9000", "--data-dir", "/data", "--access-key", "jepsen", "--secret-key", "jepsen-secret", "--region", "us-east-1", "--io-backend", "poll", "--object-placement", "log", "--store-segments", "32", "--max-connections", "256", "--watchdog-wedge-ms", "10000"]
    memoryMiB: 512
    files:
    - source: ../keel/run-s3dd.sh
      target: /run-s3dd.sh
    volumes:
      data:
        target: /data
        size: 2GiB
  s3-b:
    # run-s3dd.sh restarts keel-s3dd whenever it exits, as a supervisor would.
    image: localhost/seedbox-jepsen/keel-s3dd:current
    entrypoint: ["/bin/sh", "/run-s3dd.sh"]
    command: ["--listen", "0.0.0.0:9000", "--data-dir", "/data", "--access-key", "jepsen", "--secret-key", "jepsen-secret", "--region", "us-east-1", "--io-backend", "poll", "--object-placement", "log", "--store-segments", "32", "--max-connections", "256", "--watchdog-wedge-ms", "10000"]
    memoryMiB: 512
    files:
    - source: ../keel/run-s3dd.sh
      target: /run-s3dd.sh
    volumes:
      data:
        target: /data
        size: 2GiB
  s3-c:
    # run-s3dd.sh restarts keel-s3dd whenever it exits, as a supervisor would.
    image: localhost/seedbox-jepsen/keel-s3dd:current
    entrypoint: ["/bin/sh", "/run-s3dd.sh"]
    command: ["--listen", "0.0.0.0:9000", "--data-dir", "/data", "--access-key", "jepsen", "--secret-key", "jepsen-secret", "--region", "us-east-1", "--io-backend", "poll", "--object-placement", "log", "--store-segments", "32", "--max-connections", "256", "--watchdog-wedge-ms", "10000"]
    memoryMiB: 512
    files:
    - source: ../keel/run-s3dd.sh
      target: /run-s3dd.sh
    volumes:
      data:
        target: /data
        size: 2GiB
  sequencer:
    # The in-memory demo sequencer: never fault it (losing it is a liveness test).
    image: localhost/seedbox-jepsen/delores-jepsen-node:current
    command: ["sequencer"]
    environment:
      RUST_LOG: "info"
      NO_COLOR: "1"
      S3_ENDPOINTS: "s3-a=http://s3-a:9000,s3-b=http://s3-b:9000,s3-c=http://s3-c:9000"
      S3_BUCKET: "delores"
      AWS_ACCESS_KEY_ID: "jepsen"
      AWS_SECRET_ACCESS_KEY: "jepsen-secret"
      SEQUENCER_ENDPOINT: "tcp://sequencer:7100"
      BIND: "0.0.0.0:7100"
    memoryMiB: 512
  n1:
    # `node` first runs the idempotent `init` (bucket and view register).
    image: localhost/seedbox-jepsen/delores-jepsen-node:current
    command: ["node"]
    environment:
      RUST_LOG: "info"
      NO_COLOR: "1"
      S3_ENDPOINTS: "s3-a=http://s3-a:9000,s3-b=http://s3-b:9000,s3-c=http://s3-c:9000"
      S3_BUCKET: "delores"
      AWS_ACCESS_KEY_ID: "jepsen"
      AWS_SECRET_ACCESS_KEY: "jepsen-secret"
      SEQUENCER_ENDPOINT: "tcp://sequencer:7100"
      NODE_ID: "n1"
      BIND: "0.0.0.0:8080"
    memoryMiB: 512
  n2:
    # `node` first runs the idempotent `init` (bucket and view register).
    image: localhost/seedbox-jepsen/delores-jepsen-node:current
    command: ["node"]
    environment:
      RUST_LOG: "info"
      NO_COLOR: "1"
      S3_ENDPOINTS: "s3-a=http://s3-a:9000,s3-b=http://s3-b:9000,s3-c=http://s3-c:9000"
      S3_BUCKET: "delores"
      AWS_ACCESS_KEY_ID: "jepsen"
      AWS_SECRET_ACCESS_KEY: "jepsen-secret"
      SEQUENCER_ENDPOINT: "tcp://sequencer:7100"
      NODE_ID: "n2"
      BIND: "0.0.0.0:8080"
    memoryMiB: 512
  n3:
    # `node` first runs the idempotent `init` (bucket and view register).
    image: localhost/seedbox-jepsen/delores-jepsen-node:current
    command: ["node"]
    environment:
      RUST_LOG: "info"
      NO_COLOR: "1"
      S3_ENDPOINTS: "s3-a=http://s3-a:9000,s3-b=http://s3-b:9000,s3-c=http://s3-c:9000"
      S3_BUCKET: "delores"
      AWS_ACCESS_KEY_ID: "jepsen"
      AWS_SECRET_ACCESS_KEY: "jepsen-secret"
      SEQUENCER_ENDPOINT: "tcp://sequencer:7100"
      NODE_ID: "n3"
      BIND: "0.0.0.0:8080"
    memoryMiB: 512
oracle:
  build:
    context: ../../..
    dockerfile: crates/seedbox-jepsen/guest.Dockerfile
  entrypoint: ["/jepsen/seedbox-jepsen", "delores-node", "--workload", "list-append"]
  memoryMiB: 1024
network:
  latency: 1ms
