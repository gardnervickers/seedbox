# Topic existence register under partitions.
# Generated by `seedbox-jepsen gen`: Kafka 4.3.1, 5 controllers (static quorum, 5 initial voters), 2 brokers, workload topics, nemesis partition.
name: kraft-topics-partition
machines:
  k1:
    build:
      context: image
      dockerfile: kafka-4.3.1.Dockerfile
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_ROLE: "controller"
      KAFKA_HOST: "k1"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      QUORUM: "static"
      KAFKA_VOTERS: "1@k1:9093,2@k2:9093,3@k3:9093,4@k4:9093,5@k5:9093"
      KAFKA_HEAP_OPTS: "-Xms192m -Xmx192m"
      KAFKA_JVM_PERFORMANCE_OPTS: "-server -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:CICompilerCount=1 -XX:-UsePerfData -Djava.awt.headless=true"
    memoryMiB: 1280
    cpu:
      speed: 4GHz
    volumes:
      data:
        target: /data
