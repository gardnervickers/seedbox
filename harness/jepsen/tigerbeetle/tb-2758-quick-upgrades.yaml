# tigerbeetle#2758 (Jepsen 3.11, release_transition panic): from 0.16.26, install 0.16.27,
# 0.16.28 and 0.16.29 within a few seconds, pausing one replica meanwhile. A replica that
# execs 0.16.28 while 0.16.29 is on disk panics in release_transition.
# Generated by `seedbox-jepsen gen`: TigerBeetle 0.16.26, production, 3 replicas.
name: tb-2758-quick-upgrades
machines:
  n1:
    build:
      context: ../../..
      dockerfile: harness/jepsen/tigerbeetle/image/tigerbeetle-upgrade.Dockerfile
    entrypoint: ["/jepsen/seedbox-jepsen", "tb-node", "--replica", "0", "--peers", "n1,n2,n3", "--data", "/var/lib/tigerbeetle/0_0.tigerbeetle", "--binary-dir", "/var/lib/tigerbeetle/bin", "--release", "0.16.26", "--respawn", "2", "--start-arg=--cache-grid=128MiB"]
    memoryMiB: 3072
    volumes:
      data:
        target: /var/lib/tigerbeetle
        size: 4GiB
  n2:
    build:
      context: ../../..
      dockerfile: harness/jepsen/tigerbeetle/image/tigerbeetle-upgrade.Dockerfile
    entrypoint: ["/jepsen/seedbox-jepsen", "tb-node", "--replica", "1", "--peers", "n1,n2,n3", "--data", "/var/lib/tigerbeetle/0_1.tigerbeetle", "--binary-dir", "/var/lib/tigerbeetle/bin", "--release", "0.16.26", "--respawn", "2", "--start-arg=--cache-grid=128MiB"]
    memoryMiB: 3072
    volumes:
      data:
        target: /var/lib/tigerbeetle
        size: 4GiB
  n3:
    build:
      context: ../../..
      dockerfile: harness/jepsen/tigerbeetle/image/tigerbeetle-upgrade.Dockerfile
    entrypoint: ["/jepsen/seedbox-jepsen", "tb-node", "--replica", "2", "--peers", "n1,n2,n3", "--data", "/var/lib/tigerbeetle/0_2.tigerbeetle", "--binary-dir", "/var/lib/tigerbeetle/bin", "--release", "0.16.26", "--respawn", "2", "--start-arg=--cache-grid=128MiB"]
