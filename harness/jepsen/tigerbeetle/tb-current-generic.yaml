# The current release (0.17.9) under generic faults, looking for unknown bugs: steady
# transfers from four clients for 60 s, checked for lost acknowledged transfers and
# panics. Run it with `--fault-profile harness/jepsen/tigerbeetle/generic-crash-faults.yaml`
# or `corruption-faults.yaml` (silent data corruption on one replica, which TigerBeetle
# repairs from its peers).
# Generated by `seedbox-jepsen gen`: TigerBeetle 0.17.9, 3 replicas.
name: tb-current-generic
machines:
  n1:
    build:
      context: ../../..
      dockerfile: harness/jepsen/tigerbeetle/image/tigerbeetle-0.17.9.Dockerfile
    entrypoint: ["/jepsen/seedbox-jepsen", "tb-node", "--replica", "0", "--peers", "n1,n2,n3", "--data", "/var/lib/tigerbeetle/0_0.tigerbeetle", "--format-arg=--development", "--start-arg=--development", "--start-arg=--experimental", "--start-arg=--limit-request=256KiB", "--start-arg=--limit-pipeline-requests=56", "--start-on-reboot"]
    memoryMiB: 3072
    volumes:
      data:
        target: /var/lib/tigerbeetle
        size: 4GiB
  n2:
    build:
      context: ../../..
      dockerfile: harness/jepsen/tigerbeetle/image/tigerbeetle-0.17.9.Dockerfile
    entrypoint: ["/jepsen/seedbox-jepsen", "tb-node", "--replica", "1", "--peers", "n1,n2,n3", "--data", "/var/lib/tigerbeetle/0_1.tigerbeetle", "--format-arg=--development", "--start-arg=--development", "--start-arg=--experimental", "--start-arg=--limit-request=256KiB", "--start-arg=--limit-pipeline-requests=56", "--start-on-reboot"]
    memoryMiB: 3072
    volumes:
      data:
        target: /var/lib/tigerbeetle
        size: 4GiB
  n3:
    build:
      context: ../../..
      dockerfile: harness/jepsen/tigerbeetle/image/tigerbeetle-0.17.9.Dockerfile
    entrypoint: ["/jepsen/seedbox-jepsen", "tb-node", "--replica", "2", "--peers", "n1,n2,n3", "--data", "/var/lib/tigerbeetle/0_2.tigerbeetle", "--format-arg=--development", "--start-arg=--development", "--start-arg=--experimental", "--start-arg=--limit-request=256KiB", "--start-arg=--limit-pipeline-requests=56", "--start-on-reboot"]
    memoryMiB: 3072
