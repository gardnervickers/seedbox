# Smoke test: a healthy 3-replica TigerBeetle 0.16.11 cluster, a short mixed
# workload, and an O_DIRECT/io_uring probe on n1's volume.
# Generated by `seedbox-jepsen gen`: TigerBeetle 0.16.11, 3 replicas.
name: tb-smoke
machines:
  n1:
    build:
      context: ../../..
      dockerfile: harness/jepsen/tigerbeetle/image/tigerbeetle-0.16.11.Dockerfile
    entrypoint: ["/jepsen/seedbox-jepsen", "tb-node", "--replica", "0", "--peers", "n1,n2,n3", "--ramfs", "/var/lib/tigerbeetle", "--data", "/var/lib/tigerbeetle/0_0.tigerbeetle", "--format-arg=--development", "--start-arg=--development", "--start-arg=--experimental", "--start-arg=--limit-request=256KiB", "--start-arg=--limit-pipeline-requests=56", "--probe", "/data"]
    memoryMiB: 3072
    volumes:
      data:
        target: /data
  n2:
    build:
      context: ../../..
      dockerfile: harness/jepsen/tigerbeetle/image/tigerbeetle-0.16.11.Dockerfile
    entrypoint: ["/jepsen/seedbox-jepsen", "tb-node", "--replica", "1", "--peers", "n1,n2,n3", "--ramfs", "/var/lib/tigerbeetle", "--data", "/var/lib/tigerbeetle/0_1.tigerbeetle", "--format-arg=--development", "--start-arg=--development", "--start-arg=--experimental", "--start-arg=--limit-request=256KiB", "--start-arg=--limit-pipeline-requests=56"]
    memoryMiB: 3072
  n3:
    build:
      context: ../../..
      dockerfile: harness/jepsen/tigerbeetle/image/tigerbeetle-0.16.11.Dockerfile
    entrypoint: ["/jepsen/seedbox-jepsen", "tb-node", "--replica", "2", "--peers", "n1,n2,n3", "--ramfs", "/var/lib/tigerbeetle", "--data", "/var/lib/tigerbeetle/0_2.tigerbeetle", "--format-arg=--development", "--start-arg=--development", "--start-arg=--experimental", "--start-arg=--limit-request=256KiB", "--start-arg=--limit-pipeline-requests=56"]
    memoryMiB: 3072
oracle:
  build:
    context: ../../..
    dockerfile: crates/seedbox-jepsen/guest.Dockerfile
  entrypoint: ["/jepsen/seedbox-jepsen", "tigerbeetle", "--workload", "query", "--duration", "20", "--clients", "4", "--nodes", "n1,n2,n3", "--label", "0.16.11/tb-smoke"]
  memoryMiB: 512
network:
  latency: 1ms
