# The current release line in production mode, looking for unknown bugs: from 0.17.7,
# install 0.17.8 and then 0.17.9 on every replica at seeded offsets while four clients
# transfer, so the cluster upgrades itself twice (each replica execs the new release from
# a memfd). Run it with `--fault-profile harness/jepsen/tigerbeetle/generic-crash-faults.yaml`.
# Generated by `seedbox-jepsen gen`: TigerBeetle 0.17.7, production, 3 replicas.
name: tb-current-upgrade-generic
machines:
  n1:
    build:
      context: ../../..
      dockerfile: harness/jepsen/tigerbeetle/image/tigerbeetle-upgrade-0.17.Dockerfile
    entrypoint: ["/jepsen/seedbox-jepsen", "tb-node", "--replica", "0", "--peers", "n1,n2,n3", "--data", "/var/lib/tigerbeetle/0_0.tigerbeetle", "--binary-dir", "/var/lib/tigerbeetle/bin", "--release", "0.17.7", "--respawn", "2", "--start-arg=--cache-grid=128MiB", "--start-on-reboot"]
    memoryMiB: 3072
    volumes:
      data:
        target: /var/lib/tigerbeetle
        size: 4GiB
  n2:
    build:
      context: ../../..
      dockerfile: harness/jepsen/tigerbeetle/image/tigerbeetle-upgrade-0.17.Dockerfile
    entrypoint: ["/jepsen/seedbox-jepsen", "tb-node", "--replica", "1", "--peers", "n1,n2,n3", "--data", "/var/lib/tigerbeetle/0_1.tigerbeetle", "--binary-dir", "/var/lib/tigerbeetle/bin", "--release", "0.17.7", "--respawn", "2", "--start-arg=--cache-grid=128MiB", "--start-on-reboot"]
    memoryMiB: 3072
    volumes:
      data:
        target: /var/lib/tigerbeetle
        size: 4GiB
  n3:
    build:
      context: ../../..
      dockerfile: harness/jepsen/tigerbeetle/image/tigerbeetle-upgrade-0.17.Dockerfile
    entrypoint: ["/jepsen/seedbox-jepsen", "tb-node", "--replica", "2", "--peers", "n1,n2,n3", "--data", "/var/lib/tigerbeetle/0_2.tigerbeetle", "--binary-dir", "/var/lib/tigerbeetle/bin", "--release", "0.17.7", "--respawn", "2", "--start-arg=--cache-grid=128MiB", "--start-on-reboot"]
    memoryMiB: 3072
    volumes:
      data:
        target: /var/lib/tigerbeetle
        size: 4GiB
oracle:
  build:
    context: ../../..
    dockerfile: crates/seedbox-jepsen/guest.Dockerfile
  entrypoint: ["/jepsen/seedbox-jepsen", "tigerbeetle", "--workload", "steps", "--duration", "60", "--clients", "4", "--batch", "8", "--think-ms", "20", "--query-fraction", "0", "--timeout", "10", "--step", "+5-15:install:all:0.17.8", "--step", "+10-20:install:all:0.17.9", "--await-release", "0.17.9", "--client", "0.17.6", "--nodes", "n1,n2,n3", "--label", "0.17.7, production/tb-current-upgrade-generic"]
  memoryMiB: 512
network:
  latency: 1ms
