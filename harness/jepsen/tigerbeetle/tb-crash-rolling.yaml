# Power loss on each replica in turn: crash and reboot n1, n2 and n3 of a 0.16.11
# cluster one after another (in random order) under load. No acknowledged transfer may
# be lost.
# Generated by `seedbox-jepsen gen`: TigerBeetle 0.16.11, 3 replicas.
name: tb-crash-rolling
machines:
  n1:
    build:
      context: ../../..
      dockerfile: harness/jepsen/tigerbeetle/image/tigerbeetle-0.16.11.Dockerfile
    entrypoint: ["/jepsen/seedbox-jepsen", "tb-node", "--replica", "0", "--peers", "n1,n2,n3", "--data", "/var/lib/tigerbeetle/0_0.tigerbeetle", "--format-arg=--development", "--start-arg=--development", "--start-arg=--experimental", "--start-arg=--limit-request=256KiB", "--start-arg=--limit-pipeline-requests=56"]
    memoryMiB: 3072
    volumes:
      data:
        target: /var/lib/tigerbeetle
        size: 4GiB
  n2:
    build:
      context: ../../..
      dockerfile: harness/jepsen/tigerbeetle/image/tigerbeetle-0.16.11.Dockerfile
    entrypoint: ["/jepsen/seedbox-jepsen", "tb-node", "--replica", "1", "--peers", "n1,n2,n3", "--data", "/var/lib/tigerbeetle/0_1.tigerbeetle", "--format-arg=--development", "--start-arg=--development", "--start-arg=--experimental", "--start-arg=--limit-request=256KiB", "--start-arg=--limit-pipeline-requests=56"]
    memoryMiB: 3072
    volumes:
      data:
        target: /var/lib/tigerbeetle
        size: 4GiB
  n3:
    build:
      context: ../../..
      dockerfile: harness/jepsen/tigerbeetle/image/tigerbeetle-0.16.11.Dockerfile
    entrypoint: ["/jepsen/seedbox-jepsen", "tb-node", "--replica", "2", "--peers", "n1,n2,n3", "--data", "/var/lib/tigerbeetle/0_2.tigerbeetle", "--format-arg=--development", "--start-arg=--development", "--start-arg=--experimental", "--start-arg=--limit-request=256KiB", "--start-arg=--limit-pipeline-requests=56"]
    memoryMiB: 3072
    volumes:
      data:
        target: /var/lib/tigerbeetle
        size: 4GiB
oracle:
  build:
    context: ../../..
    dockerfile: crates/seedbox-jepsen/guest.Dockerfile
  entrypoint: ["/jepsen/seedbox-jepsen", "tigerbeetle", "--workload", "steps", "--duration", "45", "--clients", "4", "--batch", "8", "--think-ms", "20", "--query-fraction", "0", "--timeout", "10", "--step", "6:crash:r1", "--step", "10:reboot:r1", "--step", "16:crash:r2", "--step", "20:reboot:r2", "--step", "26:crash:r3", "--step", "30:reboot:r3", "--nodes", "n1,n2,n3", "--label", "0.16.11/tb-crash-rolling"]
  memoryMiB: 512
network:
  latency: 1ms
