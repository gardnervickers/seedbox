# Generic faults for the TigerBeetle rolling-upgrade workload, aimed at nothing
# in particular: replica process pauses and isolations while the cluster
# upgrades. #2763 needs a view change led by a replica still on the old release
# after another has upgraded; most faults here land elsewhere or let the lagging
# replica catch up first. No power loss: a rebooted replica waits for its agent
# to be told to start, which only the oracle's own reboot steps do.
start: 4s
end: 40s
interval: 3s
faults:
  - kind: pause_process
    weight: 2
    duration: {min: 500ms, max: 6s}
  - kind: partition
    weight: 2
    duration: {min: 1s, max: 6s}
