# tigerbeetle#2763 without a scripted nemesis: the rolling install from 0.16.26 to
# 0.16.27 alone. Run it with `--fault-profile harness/jepsen/tigerbeetle/generic-faults.yaml`;
# a seed or a campaign must itself cause a view change led by a replica still on 0.16.26.
# Generated by `seedbox-jepsen gen`: TigerBeetle 0.16.26, production, 3 replicas.
name: tb-2763-rolling-generic
machines:
  n1:
    build:
      context: ../../..
      dockerfile: harness/jepsen/tigerbeetle/image/tigerbeetle-upgrade.Dockerfile
    entrypoint: ["/jepsen/seedbox-jepsen", "tb-node", "--replica", "0", "--peers", "n1,n2,n3", "--data", "/var/lib/tigerbeetle/0_0.tigerbeetle", "--binary-dir", "/var/lib/tigerbeetle/bin", "--release", "0.16.26", "--respawn", "2", "--start-arg=--cache-grid=128MiB", "--start-on-reboot"]
    memoryMiB: 3072
    volumes:
      data:
        target: /var/lib/tigerbeetle
        size: 4GiB
  n2:
    build:
      context: ../../..
      dockerfile: harness/jepsen/tigerbeetle/image/tigerbeetle-upgrade.Dockerfile
    entrypoint: ["/jepsen/seedbox-jepsen", "tb-node", "--replica", "1", "--peers", "n1,n2,n3", "--data", "/var/lib/tigerbeetle/0_1.tigerbeetle", "--binary-dir", "/var/lib/tigerbeetle/bin", "--release", "0.16.26", "--respawn", "2", "--start-arg=--cache-grid=128MiB", "--start-on-reboot"]
    memoryMiB: 3072
    volumes:
      data:
        target: /var/lib/tigerbeetle
        size: 4GiB
  n3:
    build:
      context: ../../..
      dockerfile: harness/jepsen/tigerbeetle/image/tigerbeetle-upgrade.Dockerfile
    entrypoint: ["/jepsen/seedbox-jepsen", "tb-node", "--replica", "2", "--peers", "n1,n2,n3", "--data", "/var/lib/tigerbeetle/0_2.tigerbeetle", "--binary-dir", "/var/lib/tigerbeetle/bin", "--release", "0.16.26", "--respawn", "2", "--start-arg=--cache-grid=128MiB", "--start-on-reboot"]
    memoryMiB: 3072
    volumes:
      data:
        target: /var/lib/tigerbeetle
        size: 4GiB
oracle:
  build:
    context: ../../..
    dockerfile: crates/seedbox-jepsen/guest.Dockerfile
  entrypoint: ["/jepsen/seedbox-jepsen", "tigerbeetle", "--workload", "steps", "--duration", "40", "--clients", "4", "--batch", "8", "--think-ms", "20", "--query-fraction", "0", "--timeout", "10", "--step", "5:install:n1:0.16.27", "--step", "6:install:n2:0.16.27", "--step", "7:install:n3:0.16.27", "--step", "7:await:all:upgrading from", "--await-release", "0.16.27", "--nodes", "n1,n2,n3", "--label", "0.16.26, production/tb-2763-rolling-generic"]
  memoryMiB: 512
network:
  latency: 1ms
