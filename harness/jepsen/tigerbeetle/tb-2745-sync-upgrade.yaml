# tigerbeetle#2745 (Jepsen 3.10, checkpoint divergence): upgrade a production 0.16.25
# cluster to 0.16.26 while n3 is down and far behind. n3 restarts on 0.16.25, state-syncs
# from a 0.16.26 replica's old-format checkpoint (without its released blocks), then
# upgrades to 0.16.26 and crashes.
# Generated by `seedbox-jepsen gen`: TigerBeetle 0.16.25, production, 3 replicas.
name: tb-2745-sync-upgrade
machines:
  n1:
    build:
      context: ../../..
      dockerfile: harness/jepsen/tigerbeetle/image/tigerbeetle-upgrade.Dockerfile
    entrypoint: ["/jepsen/seedbox-jepsen", "tb-node", "--replica", "0", "--peers", "n1,n2,n3", "--data", "/var/lib/tigerbeetle/0_0.tigerbeetle", "--binary-dir", "/var/lib/tigerbeetle/bin", "--release", "0.16.25", "--respawn", "2", "--start-arg=--cache-grid=128MiB"]
    memoryMiB: 3072
    volumes:
      data:
        target: /var/lib/tigerbeetle
        size: 4GiB
  n2:
    build:
      context: ../../..
      dockerfile: harness/jepsen/tigerbeetle/image/tigerbeetle-upgrade.Dockerfile
    entrypoint: ["/jepsen/seedbox-jepsen", "tb-node", "--replica", "1", "--peers", "n1,n2,n3", "--data", "/var/lib/tigerbeetle/0_1.tigerbeetle", "--binary-dir", "/var/lib/tigerbeetle/bin", "--release", "0.16.25", "--respawn", "2", "--start-arg=--cache-grid=128MiB"]
    memoryMiB: 3072
    volumes:
      data:
        target: /var/lib/tigerbeetle
        size: 4GiB
  n3:
    build:
      context: ../../..
      dockerfile: harness/jepsen/tigerbeetle/image/tigerbeetle-upgrade.Dockerfile
    entrypoint: ["/jepsen/seedbox-jepsen", "tb-node", "--replica", "2", "--peers", "n1,n2,n3", "--data", "/var/lib/tigerbeetle/0_2.tigerbeetle", "--binary-dir", "/var/lib/tigerbeetle/bin", "--release", "0.16.25", "--respawn", "2", "--start-arg=--cache-grid=128MiB"]
    memoryMiB: 3072
    volumes:
      data:
        target: /var/lib/tigerbeetle
        size: 4GiB
oracle:
  build:
    context: ../../..
    dockerfile: crates/seedbox-jepsen/guest.Dockerfile
  entrypoint: ["/jepsen/seedbox-jepsen", "tigerbeetle", "--workload", "steps", "--duration", "60", "--clients", "4", "--batch", "8", "--think-ms", "20", "--query-fraction", "0", "--timeout", "10", "--step", "2:install:ring-last:0.16.26", "--step", "5:stop:ring-last", "--step", "6:install:primary,ring-next:0.16.26", "--step", "50:restart:ring-last", "--await-release", "0.16.26", "--nodes", "n1,n2,n3", "--label", "0.16.25, production/tb-2745-sync-upgrade"]
  memoryMiB: 512
network:
  latency: 1ms
