# Negative control for tb-2484-sessions: 0.16.17 replicas and the 0.16.17 client, whose
# evicted sessions fail their requests with client_evicted instead of panicking.
# Generated by `seedbox-jepsen gen`: TigerBeetle 0.16.17, 3 replicas.
name: tb-2484-sessions-fixed
machines:
  n1:
    build:
      context: ../../..
      dockerfile: harness/jepsen/tigerbeetle/image/tigerbeetle-0.16.17.Dockerfile
    entrypoint: ["/jepsen/seedbox-jepsen", "tb-node", "--replica", "0", "--peers", "n1,n2,n3", "--ramfs", "/var/lib/tigerbeetle", "--data", "/var/lib/tigerbeetle/0_0.tigerbeetle", "--format-arg=--development", "--start-arg=--development", "--start-arg=--experimental", "--start-arg=--limit-request=256KiB", "--start-arg=--limit-pipeline-requests=56"]
    memoryMiB: 2560
  n2:
    build:
      context: ../../..
      dockerfile: harness/jepsen/tigerbeetle/image/tigerbeetle-0.16.17.Dockerfile
    entrypoint: ["/jepsen/seedbox-jepsen", "tb-node", "--replica", "1", "--peers", "n1,n2,n3", "--ramfs", "/var/lib/tigerbeetle", "--data", "/var/lib/tigerbeetle/0_1.tigerbeetle", "--format-arg=--development", "--start-arg=--development", "--start-arg=--experimental", "--start-arg=--limit-request=256KiB", "--start-arg=--limit-pipeline-requests=56"]
    memoryMiB: 2560
  n3:
    build:
      context: ../../..
      dockerfile: harness/jepsen/tigerbeetle/image/tigerbeetle-0.16.17.Dockerfile
    entrypoint: ["/jepsen/seedbox-jepsen", "tb-node", "--replica", "2", "--peers", "n1,n2,n3", "--ramfs", "/var/lib/tigerbeetle", "--data", "/var/lib/tigerbeetle/0_2.tigerbeetle", "--format-arg=--development", "--start-arg=--development", "--start-arg=--experimental", "--start-arg=--limit-request=256KiB", "--start-arg=--limit-pipeline-requests=56"]
