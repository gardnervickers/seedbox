oracle:
  build:
    context: ../../..
    dockerfile: crates/seedbox-jepsen/guest.Dockerfile
  entrypoint: ["/jepsen/seedbox-jepsen", "tigerbeetle", "--workload", "sessions", "--sessions", "64", "--evictions", "5", "--accounts", "4", "--client", "0.16.17", "--nodes", "n1,n2,n3", "--label", "0.16.17/tb-2484-sessions-fixed"]
