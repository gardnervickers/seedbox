name: redis-aof
machines:
  redis:
    image: docker.io/library/redis:7.2@sha256:46f15cf64fdef63e483dcda99e74e3d51c017b1175547b6bb874152ee2391aad
    entrypoint: [redis-server]
    command: [--appendonly, "yes", --appendfsync, always, --save, "", --dir, /data, --protected-mode, "no"]
    volumes:
      data:
        target: "/data"
oracle:
  image: docker.io/library/python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
  entrypoint:
  - python3
  - "/scenario/redis_aof.py"
  files:
  - source: "../driver/redis_aof.py"
    target: "/scenario/redis_aof.py"
  - source: "../../../python/seedbox/__init__.py"
    target: "/scenario/seedbox/__init__.py"
  - source: "../../../python/seedbox/control.py"
    target: "/scenario/seedbox/control.py"
network:
  latency: 1ms
