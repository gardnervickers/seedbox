    image: quay.io/coreos/etcd:v3.5.2@sha256:70fe70b6cdaea99fa9e99d3a16483954eb084c3b32a2475abea4e709a793636c
    entrypoint: [bash, /scenario/etcd_lease_client.sh]
    files:
    - source: "../driver/etcd_lease_client.sh"
      target: "/scenario/etcd_lease_client.sh"
oracle:
  image: docker.io/library/python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
  entrypoint:
  - python3
  - "/scenario/etcd_lease.py"
  files:
  - source: "../driver/etcd_lease.py"
    target: "/scenario/etcd_lease.py"
  - source: "../../../python/seedbox/__init__.py"
    target: "/scenario/seedbox/__init__.py"
  - source: "../../../python/seedbox/control.py"
    target: "/scenario/seedbox/control.py"
network:
  latency: 1ms
