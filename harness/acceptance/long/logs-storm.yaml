name: logs-storm
machines:
  app:
    image: docker.io/library/python:3.13-alpine
    entrypoint:
    - python3
    - "/scenario/output_storm.py"
    - app
    files:
    - source: "../driver/output_storm.py"
      target: "/scenario/output_storm.py"
oracle:
  image: docker.io/library/python:3.13-alpine
  entrypoint:
  - python3
  - "/scenario/output_storm.py"
  - oracle
  files:
  - source: "../driver/output_storm.py"
    target: "/scenario/output_storm.py"
  - source: "../../../python/seedbox/__init__.py"
    target: "/scenario/seedbox/__init__.py"
  - source: "../../../python/seedbox/control.py"
    target: "/scenario/seedbox/control.py"
network:
  latency: 1ms
