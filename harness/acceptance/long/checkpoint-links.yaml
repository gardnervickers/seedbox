name: checkpoint-links
machines:
  src:
    image: docker.io/library/python:3.13-alpine
    entrypoint:
    - python3
    - "/scenario/link_checkpoint.py"
    - src
    files:
    - source: "../driver/link_checkpoint.py"
      target: "/scenario/link_checkpoint.py"
  dst:
    image: docker.io/library/python:3.13-alpine
    entrypoint:
    - python3
    - "/scenario/link_checkpoint.py"
    - dst
    files:
    - source: "../driver/link_checkpoint.py"
      target: "/scenario/link_checkpoint.py"
oracle:
  image: docker.io/library/python:3.13-alpine
  entrypoint:
  - python3
  - "/scenario/link_checkpoint.py"
  - oracle
  files:
  - source: "../driver/link_checkpoint.py"
    target: "/scenario/link_checkpoint.py"
  - source: "../../../python/seedbox/__init__.py"
    target: "/scenario/seedbox/__init__.py"
  - source: "../../../python/seedbox/control.py"
    target: "/scenario/seedbox/control.py"
network:
  latency: 1ms
