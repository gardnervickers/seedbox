name: race
services:
  n1:
    build:
      context: ../../../guest
      dockerfile: race.Dockerfile
    entrypoint: [/bin/sh, -ec]
    command: ["/race 3000000; exec /race 3000000 atomic"]
x-seedbox:
  version: 1
  limits: {simulated_time: 60s, wall_time: 30m}
  schedule: {timer_jitter: 1ms, stop_tolerance: 2ms}
  check: {service: n1, exit_code: 0}
