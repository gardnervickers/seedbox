name: connection-selectors
machines:
  server:
    image: docker.io/library/python:3.13-alpine
    entrypoint:
    - python3
    - "/scenario/connections.py"
    - server
    files:
    - source: "../driver/connections.py"
      target: "/scenario/connections.py"
  client:
    image: docker.io/library/python:3.13-alpine
    entrypoint:
    - python3
    - "/scenario/connections.py"
    - client
    files:
    - source: "../driver/connections.py"
      target: "/scenario/connections.py"
oracle:
  image: docker.io/library/python:3.13-alpine
  entrypoint:
  - python3
  - "/scenario/connections.py"
  - scenario
  files:
  - source: "../driver/connections.py"
    target: "/scenario/connections.py"
  - source: "../../../python/seedbox/__init__.py"
    target: "/scenario/seedbox/__init__.py"
  - source: "../../../python/seedbox/control.py"
    target: "/scenario/seedbox/control.py"
network:
  latency: 1ms
