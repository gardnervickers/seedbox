name: clock-step
machines:
  clock:
    build:
      context: "../../../tools/jvm-fuzz/probes/c"
      dockerfile: cfztime.Dockerfile
oracle:
  image: docker.io/library/python:3.13-alpine
  entrypoint:
  - python3
  - "/scenario/clock_step.py"
  - scenario
  files:
  - source: "../driver/clock_step.py"
    target: "/scenario/clock_step.py"
  - source: "../../../python/seedbox/__init__.py"
    target: "/scenario/seedbox/__init__.py"
  - source: "../../../python/seedbox/control.py"
    target: "/scenario/seedbox/control.py"
network:
  latency: 1ms
