name: clock-drift
machines:
  a:
    image: docker.io/library/python:3.13-alpine
    entrypoint:
    - python3
    - "/scenario/clock_drift.py"
    - clock
    files:
    - source: "../driver/clock_drift.py"
      target: "/scenario/clock_drift.py"
  b:
    image: docker.io/library/python:3.13-alpine
    entrypoint:
    - python3
    - "/scenario/clock_drift.py"
    - clock
    files:
    - source: "../driver/clock_drift.py"
      target: "/scenario/clock_drift.py"
oracle:
  image: docker.io/library/python:3.13-alpine
  entrypoint:
  - python3
  - "/scenario/clock_drift.py"
  - scenario
  files:
  - source: "../driver/clock_drift.py"
    target: "/scenario/clock_drift.py"
  - source: "../../../python/seedbox/__init__.py"
    target: "/scenario/seedbox/__init__.py"
  - source: "../../../python/seedbox/control.py"
    target: "/scenario/seedbox/control.py"
network:
  latency: 1ms
