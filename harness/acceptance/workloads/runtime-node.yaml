name: runtime-node
services:
  node:
    image: docker.io/library/node:22-alpine
    command: [node, /runtime.js]
    configs:
      - {source: driver, target: /runtime.js}
configs:
  driver: {file: ../driver/runtime_node.js}
x-seedbox:
  version: 1
  machine: {memory_mb: 2048}
  seed: 172
  limits: {simulated_time: 60s, wall_time: 15m}
  check: {service: node, exit_code: 0}
