name: mac-capabilities
machines:
  server:
    image: docker.io/library/busybox:1.37
    command:
    - sleep
    - '3600'
  client:
    image: docker.io/library/busybox:1.37
    command:
    - sleep
    - '3600'
oracle:
  image: docker.io/library/python:3.13-alpine
  entrypoint:
  - python3
  - "/scenario/mac_capabilities.py"
  files:
  - source: "../driver/mac_capabilities.py"
    target: "/scenario/mac_capabilities.py"
  - source: "../../../python/seedbox/__init__.py"
    target: "/scenario/seedbox/__init__.py"
  - source: "../../../python/seedbox/control.py"
    target: "/scenario/seedbox/control.py"
network:
  latency: 1ms
