name: volume-crash
machines:
  server:
    image: docker.io/library/python:3.13-alpine
    entrypoint:
    - python3
    - "/scenario/main.py"
    command:
    - server
    - "--listen"
    - 0.0.0.0:7000
    - "--state"
    - "/data/kv.log"
    files:
    - source: "../../../examples/faults/workload/main.py"
      target: "/scenario/main.py"
    volumes:
      data:
        target: "/data"
oracle:
  image: docker.io/library/python:3.13-alpine
  entrypoint:
  - python3
  - "/scenario/volume.py"
  files:
  - source: "../driver/volume.py"
    target: "/scenario/volume.py"
  - source: "../../../examples/faults/workload/main.py"
    target: "/scenario/main.py"
  - source: "../../../python/seedbox/__init__.py"
    target: "/scenario/seedbox/__init__.py"
  - source: "../../../python/seedbox/control.py"
    target: "/scenario/seedbox/control.py"
network:
  latency: 1ms
