name: key-value-faults
machines:
  server:
    image: docker.io/library/python:3.13-alpine
    entrypoint:
    - python3
    - "/scenario/main.py"
    command:
    - server
    - "--listen"
    - 0.0.0.0:7000
    - "--state"
    - "/data/kv.log"
    files:
    - source: "../../../examples/faults/workload/main.py"
      target: "/scenario/main.py"
    - source: "../../../examples/faults/workload/scenario.py"
      target: "/scenario/scenario.py"
    - source: "../../../python/seedbox/__init__.py"
      target: "/scenario/seedbox/__init__.py"
    - source: "../../../python/seedbox/control.py"
      target: "/scenario/seedbox/control.py"
  client:
    image: docker.io/library/python:3.13-alpine
    entrypoint:
    - python3
    - "/scenario/main.py"
    command:
    - client
    - "--listen"
    - 0.0.0.0:7001
    - "--address"
    - server:7000
    files:
    - source: "../../../examples/faults/workload/main.py"
      target: "/scenario/main.py"
    - source: "../../../examples/faults/workload/scenario.py"
      target: "/scenario/scenario.py"
    - source: "../../../python/seedbox/__init__.py"
      target: "/scenario/seedbox/__init__.py"
    - source: "../../../python/seedbox/control.py"
      target: "/scenario/seedbox/control.py"
oracle:
  image: docker.io/library/python:3.13-alpine
  entrypoint:
  - python3
  - "/scenario/main.py"
  command:
  - scenario
  - "--control-address"
  - client:7001
  files:
  - source: "../../../examples/faults/workload/main.py"
    target: "/scenario/main.py"
  - source: "../../../examples/faults/workload/scenario.py"
    target: "/scenario/scenario.py"
  - source: "../../../python/seedbox/__init__.py"
    target: "/scenario/seedbox/__init__.py"
  - source: "../../../python/seedbox/control.py"
    target: "/scenario/seedbox/control.py"
network:
  latency: 1ms
