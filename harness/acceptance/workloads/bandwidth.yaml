name: link-bandwidth
services:
  server:
    image: docker.io/library/python:3.13-alpine
    entrypoint: [python3, /scenario/bandwidth.py, server]
    configs:
      - {source: driver, target: /scenario/bandwidth.py}
  client:
    image: docker.io/library/python:3.13-alpine
    entrypoint: [python3, /scenario/bandwidth.py, client]
    configs:
      - {source: driver, target: /scenario/bandwidth.py}
  scenario:
    image: docker.io/library/python:3.13-alpine
    entrypoint: [python3, /scenario/bandwidth.py, scenario]
    configs:
      - {source: driver, target: /scenario/bandwidth.py}
      - {source: api-package, target: /scenario/seedbox/__init__.py}
      - {source: api-control, target: /scenario/seedbox/control.py}
configs:
  driver: {file: ../driver/bandwidth.py}
  api-package: {file: ../../../python/seedbox/__init__.py}
  api-control: {file: ../../../python/seedbox/control.py}
x-seedbox:
  version: 1
  seed: 173
  limits: {simulated_time: 20s, wall_time: 10m}
  network: {latency: 1ms, jitter: 0ns}
  control: {service: scenario}
  check: {service: scenario, exit_code: 0}
