name: dynamic-network-faults
services:
  server:
    image: docker.io/library/python:3.13-alpine
    entrypoint: [python3, /scenario/network_faults.py, server]
    configs:
      - {source: driver, target: /scenario/network_faults.py}
  client:
    image: docker.io/library/python:3.13-alpine
    entrypoint: [python3, /scenario/network_faults.py, client]
    configs:
      - {source: driver, target: /scenario/network_faults.py}
  scenario:
    image: docker.io/library/python:3.13-alpine
    entrypoint: [python3, /scenario/network_faults.py, scenario]
    configs:
      - {source: driver, target: /scenario/network_faults.py}
      - {source: api-package, target: /scenario/seedbox/__init__.py}
      - {source: api-control, target: /scenario/seedbox/control.py}
configs:
  driver: {file: ../driver/network_faults.py}
  api-package: {file: ../../../python/seedbox/__init__.py}
  api-control: {file: ../../../python/seedbox/control.py}
x-seedbox:
  version: 1
  seed: 173
  limits: {simulated_time: 30s, wall_time: 10m}
  network: {latency: 1ms, jitter: 0ns}
  control: {service: scenario}
  check: {service: scenario, exit_code: 0}
