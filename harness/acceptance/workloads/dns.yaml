name: simulated-dns
machines:
  node:
    image: docker.io/library/python:3.13-alpine
    entrypoint: [python3, /scenario/dns.py, node]
    files:
    - source: ../driver/dns.py
      target: /scenario/dns.py
  peer:
    image: docker.io/library/python:3.13-alpine
    entrypoint: [python3, /scenario/dns.py, peer]
    files:
    - source: ../driver/dns.py
      target: /scenario/dns.py
oracle:
  image: docker.io/library/python:3.13-alpine
  entrypoint: [python3, /scenario/dns.py, oracle]
  files:
  - source: ../driver/dns.py
    target: /scenario/dns.py
  - source: ../../../python/seedbox/__init__.py
    target: /scenario/seedbox/__init__.py
  - source: ../../../python/seedbox/control.py
    target: /scenario/seedbox/control.py
network:
  latency: 1ms
