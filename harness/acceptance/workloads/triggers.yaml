name: committed-console-triggers
machines:
  source:
    image: docker.io/library/python:3.13-alpine
    command:
    - python3
    - "-u"
    - "/triggers.py"
    - source
    files:
    - source: "../driver/triggers.py"
      target: "/triggers.py"
    - source: "../../../python/seedbox/control.py"
      target: "/control.py"
  peer:
    image: docker.io/library/python:3.13-alpine
    command:
    - python3
    - "-u"
    - "/triggers.py"
    - peer
    files:
    - source: "../driver/triggers.py"
      target: "/triggers.py"
    - source: "../../../python/seedbox/control.py"
      target: "/control.py"
oracle:
  image: docker.io/library/python:3.13-alpine
  command:
  - python3
  - "-u"
  - "/triggers.py"
  - scenario
  files:
  - source: "../driver/triggers.py"
    target: "/triggers.py"
  - source: "../../../python/seedbox/control.py"
    target: "/control.py"
network:
  latency: 1ms
