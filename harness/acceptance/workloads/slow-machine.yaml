name: slow-machine
machines:
  worker:
    image: docker.io/library/python:3.13-alpine
    entrypoint:
    - python3
    - "/scenario/slow_machine.py"
    - worker
    files:
    - source: "../driver/slow_machine.py"
      target: "/scenario/slow_machine.py"
oracle:
  image: docker.io/library/python:3.13-alpine
  entrypoint:
  - python3
  - "/scenario/slow_machine.py"
  - scenario
  files:
  - source: "../driver/slow_machine.py"
    target: "/scenario/slow_machine.py"
  - source: "../../../python/seedbox/__init__.py"
    target: "/scenario/seedbox/__init__.py"
  - source: "../../../python/seedbox/control.py"
    target: "/scenario/seedbox/control.py"
network:
  latency: 1ms
