name: device-faults
machines:
  victim:
    build:
      context: "../images/faults"
      dockerfile: Dockerfile
    entrypoint:
    - "/faults"
    - flushes
    - "/data/victim"
    volumes:
      data:
        target: "/data"
oracle:
  build:
    context: "../images/faults"
    dockerfile: Dockerfile
  entrypoint:
  - python3
  - "/scenario/device_faults.py"
  files:
  - source: "../driver/device_faults.py"
    target: "/scenario/device_faults.py"
  - source: "../../../python/seedbox/__init__.py"
    target: "/scenario/seedbox/__init__.py"
  - source: "../../../python/seedbox/control.py"
    target: "/scenario/seedbox/control.py"
  volumes:
    data:
      target: "/data"
