# An oracle that runs a fault profile with seedbox-oracle. Built by its
# Dockerfile from the repository root; not a member of the Seedbox workspace.
[package]
name = "profile-oracle"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
seedbox-oracle = { path = "../../../../crates/seedbox-oracle" }
serde_json = "1"
serde_yaml_ng = "0.10"
